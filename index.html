function renderKanban(){
  var jobs = state.jobs.filter(function(j){
    return !state.jobFilterPlatform || j.platformId===state.jobFilterPlatform;
  });
  var wrap = document.getElementById('kanbanWrap');
  if(!wrap) return;

  // salva scroll horizontal, vertical de cada coluna E do #main
  var savedScrollX = wrap.scrollLeft;
  var savedMainY = (document.getElementById('main') || {}).scrollTop || 0;
  var savedColScrolls = {};
  wrap.querySelectorAll('[data-status-col]').forEach(function(col){
    var key = col.getAttribute('data-status-col');
    if(col.scrollTop > 0) savedColScrolls[key] = col.scrollTop;
  });

  var html = '';
  KANBAN_STATUSES.forEach(function(s){
    var colJobs = jobs.filter(function(j){ return j.status===s.key; });
    html += '<div class="kanban-col">' +
      '<div class="kanban-col-head">'+statusBadgeHtml(s.key, s.label)+'<span class="kanban-col-count">('+colJobs.length+')</span></div>' +
      '<div class="kanban-col-body" data-status-col="'+s.key+'">';
    colJobs.forEach(function(j){ html += kanbanCardHtml(j); });
    html += '<button class="kanban-add" data-new-job-status="'+s.key+'">+ Adicionar</button>';
    html += '</div></div>';
  });
  wrap.innerHTML = html;

  // restaura todos os scrolls
  setScrollLeftInstant(wrap, savedScrollX);
  requestAnimationFrame(function(){
    setScrollLeftInstant(wrap, savedScrollX);
    var mainEl = document.getElementById('main');
    if(mainEl && savedMainY) mainEl.scrollTop = savedMainY;
    wrap.querySelectorAll('[data-status-col]').forEach(function(col){
      var key = col.getAttribute('data-status-col');
      if(savedColScrolls[key]) col.scrollTop = savedColScrolls[key];
    });
  });

  wrap.querySelectorAll('.kanban-card').forEach(function(card){
    card.addEventListener('click', function(e){
      if(card.classList.contains('dragging')) return;
      openJobModal(card.getAttribute('data-job-id'));
    });
    card.addEventListener('dragstart', function(e){
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.getAttribute('data-job-id'));
      e.dataTransfer.effectAllowed = 'move';
      startDragScroll(wrap, e.clientX, e.clientY);
    });
    card.addEventListener('dragend', function(){
      card.classList.remove('dragging');
      stopDragScroll();
    });
  });
  wrap.addEventListener('dragover', function(e){ updateDragScroll(e.clientX, e.clientY); });
  wrap.querySelectorAll('[data-new-job-status]').forEach(function(btn){
    btn.addEventListener('click', function(){ openJobModal(null, btn.getAttribute('data-new-job-status')); });
  });

  wrap.querySelectorAll('[data-status-col]').forEach(function(col){
    col.addEventListener('dragover', function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', function(){
      col.classList.remove('drag-over');
    });
    col.addEventListener('drop', function(e){
      e.preventDefault();
      col.classList.remove('drag-over');
      stopDragScroll();
      var jobId = e.dataTransfer.getData('text/plain');
      var newStatus = col.getAttribute('data-status-col');
      var job = state.jobs.find(function(j){ return j.id===jobId; });
      if(job && job.status!==newStatus){
        job.status = newStatus;
        saveJobs();
        showToast('Movido para "' + (newStatus===STATUS_CANCELLED?'Cancelado':statusLabel(newStatus)) + '".');
        renderKanban();
      }
    });
  });
}

function kanbanCardHtml(job){
  var brand = brandById(job.brandId);
  var platform = platformById(job.platformId);
  var d = job.deadline ? daysUntil(job.deadline) : null;
  var deadlineText = null;
  var deadlineStyle = '';
  var isDelivered = job.deliveredAt || job.status==='aguardando_pagamento' || job.status==='postagem' || job.status==='pago';
  if(d!==null){
    if(isDelivered){
      deadlineText = '✓ entregue';
      deadlineStyle = 'background:var(--sage-tint);color:var(--sage-deep);';
    } else if(d<0){
      deadlineText = Math.abs(d)+'d atrasado';
      deadlineStyle = 'background:var(--danger-tint);color:var(--danger);';
    } else {
      deadlineText = d===0 ? 'hoje' : d===1 ? 'amanhã' : fmtDate(job.deadline);
    }
  }

  // Progresso de vídeos produzidos (só aparece se tem 2+ vídeos e algum check feito)
  var videoProgress = '';
  if(job.videoCount && parseInt(job.videoCount,10) >= 2 && job.videosDone){
    var total = parseInt(job.videoCount,10);
    var done = Object.values(job.videosDone).filter(Boolean).length;
    if(done > 0){
      var pct = Math.round((done/total)*100);
      videoProgress = '<div style="margin-top:8px;">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">' +
          '<span style="font-size:11px; color:var(--ink-faint);">'+done+'/'+total+' vídeos</span>' +
          '<span style="font-size:11px; color:var(--sage-deep); font-weight:600;">'+pct+'%</span>' +
        '</div>' +
        '<div style="height:3px; border-radius:99px; background:var(--line);">' +
          '<div style="height:3px; border-radius:99px; background:var(--sage); width:'+pct+'%;"></div>' +
        '</div>' +
      '</div>';
    }
  }

  return '<div class="kanban-card" draggable="true" data-job-id="'+job.id+'" tabindex="0" role="button" aria-label="Abrir '+escapeHtml(job.title)+'">' +
    '<p class="kanban-card-title">'+escapeHtml(brand?brand.name:(job.title||'Sem título'))+'</p>' +
    '<div class="kanban-tags">' +
      platformBadgeHtml(platform) +
      (job.value ? '<span class="tag-value">'+fmtCurrency(parseMoneyGuess(job.value), job.currency)+'</span>' : '') +
    '</div>' +
    videoProgress +
    (deadlineText ? '<div style="margin-top:8px;"><span class="tag" style="'+deadlineStyle+'">'+escapeHtml(deadlineText)+'</span></div>' : '') +
  '</div>';
}

/* ---------------- render: agenda (intelligent calendar) ---------------- */
var MONTH_NAMES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var DOW_NAMES = ["dom","seg","ter","qua","qui","sex","sáb"];

var AGENDA_CATEGORIES = {
  entregas:    {label:'Entregas',         dot:'#D6455A', filterKey:'entregas'},
  pagamentos:  {label:'Pagamentos',       dot:'#4E9B63', filterKey:'pagamentos'},
  produtos:    {label:'Produtos',         dot:'#8868B0', filterKey:'produtos'},
  followup:    {label:'Follow-up',        dot:'#4E7FB0', filterKey:'followup'},
  pessoal:     {label:'Eventos pessoais', dot:'#D6A53E', filterKey:'pessoal'},
  gravacao:    {label:'Gravações',        dot:'#E0779A', filterKey:'gravacao'},
  edicao:      {label:'Edição',           dot:'#5BBCC2', filterKey:'edicao'}
};

/* Builds the full list of agenda events for the current month by aggregating
   every module — nothing here is a manually-created "event", it's all derived
   live from existing data, per the brief ("calendário não deve depender só de
   eventos manuais"). */
function buildAgendaEvents(year, month){
  var events = [];

  state.jobs.forEach(function(j){
    if(j.status===STATUS_CANCELLED) return;
    var brand = brandById(j.brandId);
    var label = (brand?brand.name:j.title||'Trabalho');

    if(j.deadline){
      var cat = j.status==='gravacao' ? 'gravacao' : j.status==='edicao' ? 'edicao' : 'entregas';
      events.push({date:j.deadline, category:cat, title:label+' — entrega', jobId:j.id, route:'jobs'});
    }
  });

  getReceivableItems().forEach(function(it){
    if(it.paid || !it.date) return;
    events.push({date:it.date, category:'pagamentos', title:it.label+' — '+fmtCurrency(it.value, it.currency), jobId:it.jobId, route:'payments'});
  });

  state.products.forEach(function(p){
    if(p.status==='recebido' || !p.expectedDate) return;
    var brand = brandById(p.brandId);
    events.push({date:p.expectedDate, category:'produtos', title:(brand?brand.name+' — ':'')+p.name, productId:p.id, route:'products'});
  });

  state.checklist.forEach(function(c){
    if(c.done || !c.date) return;
    var cat = c.category==='pessoal' ? 'pessoal' : null;
    if(!cat) return; // work checklist items are already represented via job deadlines
    events.push({date:c.date, category:'pessoal', title:c.text, checkId:c.id, route:'checklist'});
  });

  state.prospects.forEach(function(p){
    if(p.status!=='followup1' && p.status!=='followup2') return;
    var refDate = p.updatedAt || p.createdAt;
    if(!refDate) return;
    // Surface a follow-up reminder 3 days after the last touch, so it's actionable on the calendar.
    var d = new Date(refDate);
    d.setDate(d.getDate()+3);
    events.push({date:isoDate(d), category:'followup', title:'Follow-up — '+p.brandName, prospectId:p.id, route:'prospects'});
  });

  return events.filter(function(e){
    var d = new Date(e.date+"T00:00:00");
    return d.getFullYear()===year && d.getMonth()===month;
  });
}

function renderCalGrid(){
  document.getElementById('calTitle').textContent = MONTH_NAMES[state.calMonth] + ' de ' + state.calYear;
  var firstDow = new Date(state.calYear, state.calMonth, 1).getDay();
  var daysInMonth = new Date(state.calYear, state.calMonth+1, 0).getDate();
  var today = new Date(); today.setHours(0,0,0,0);

  var allEvents = buildAgendaEvents(state.calYear, state.calMonth)
    .filter(function(e){ return state.agendaFilters[e.category]!==false; });

  var eventsByDay = {};
  allEvents.forEach(function(e){
    var d = new Date(e.date+"T00:00:00");
    var day = d.getDate();
    (eventsByDay[day] = eventsByDay[day] || []).push(e);
  });

  var html = '';
  DOW_NAMES.forEach(function(n){ html += '<div class="cal-dow">'+n+'</div>'; });
  for(var i=0;i<firstDow;i++){ html += '<div class="cal-cell empty-cell"></div>'; }
  for(var day=1; day<=daysInMonth; day++){
    var isToday = today.getFullYear()===state.calYear && today.getMonth()===state.calMonth && today.getDate()===day;
    html += '<div class="cal-cell '+(isToday?'today':'')+'"><span class="cal-daynum">'+day+'</span>';
    (eventsByDay[day]||[]).slice(0,4).forEach(function(e){
      var c = AGENDA_CATEGORIES[e.category];
      html += '<span class="cal-job-chip" style="background:'+c.dot+'22; color:'+c.dot+';" ' +
        'data-agenda-event="1" data-route="'+e.route+'" data-job-id="'+(e.jobId||'')+'" data-product-id="'+(e.productId||'')+'" data-check-id="'+(e.checkId||'')+'" data-prospect-id="'+(e.prospectId||'')+'" ' +
        'title="'+escapeHtml(e.title)+'">'+escapeHtml(e.title)+'</span>';
    });
    if((eventsByDay[day]||[]).length>4){
      html += '<span style="font-size:10px; color:var(--ink-faint); padding:1px 2px;">+'+((eventsByDay[day]||[]).length-4)+' mais</span>';
    }
    html += '</div>';
  }
  document.getElementById('calGrid').innerHTML = html;
  document.querySelectorAll('[data-agenda-event]').forEach(function(chip){
    chip.addEventListener('click', function(){
      var jobId = chip.getAttribute('data-job-id');
      var productId = chip.getAttribute('data-product-id');
      var checkId = chip.getAttribute('data-check-id');
      var prospectId = chip.getAttribute('data-prospect-id');
      var route = chip.getAttribute('data-route');
      if(jobId) { openJobModal(jobId); return; }
      if(productId) { openProductModal(productId); return; }
      if(prospectId) { openProspectModal(prospectId); return; }
      if(checkId) { navigate(route); return; }
      navigate(route);
    });
  });
}

var DOW_FULL = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];

function isoDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(d, n){
  var r = new Date(d);
  r.setDate(r.getDate()+n);
  return r;
}
function startOfToday(){
  var d = new Date(); d.setHours(0,0,0,0);
  return d;
}

/* Checklist scroller state: a contiguous window of ISO dates currently rendered.
   Grows at either edge as the user scrolls close to it (infinite navigation). */
var checklistScroll = {
  startDate: null,   // Date object, inclusive
  endDate: null,      // Date object, inclusive
  dayWidth: null,      // measured px width of one day column (for scroll math)
  loadingEdge: false,
  positioning: false   // true enquanto centraliza em hoje (bloqueia o scroll infinito)
};

/* Move o scroll SEM animação. O CSS tem scroll-behavior:smooth, e um scroll
   animado passando perto da borda esquerda disparava o "carregar dias anteriores"
   em cadeia — era isso que fazia o planner abrir meses atrás. */
function setScrollLeftInstant(wrap, left){
  var prev = wrap.style.scrollBehavior;
  wrap.style.scrollBehavior = 'auto';
  wrap.scrollLeft = left;
  wrap.style.scrollBehavior = prev;
}
function centerChecklistOnToday(wrap){
  var todayCol = wrap.querySelector('.week-col.is-today');
  if(!todayCol) return;
  setScrollLeftInstant(wrap, Math.max(0, todayCol.offsetLeft - (wrap.clientWidth/2) + (todayCol.offsetWidth/2)));
  updateChecklistTitle();
}

function debounce(fn, ms){

/* ---- timer pomodoro ---- */
function initTimer(){
  var T = state.timer;
  function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  function totalFor(mode){ return mode==='work'?25*60:mode==='break'?5*60:15*60; }
  function updateUI(){
    var lbl = document.getElementById('timerLabel');
    var modeLbl = document.getElementById('timerModeLabel');
    var prog = document.getElementById('timerProgress');
    var btn = document.getElementById('timerToggle');
    if(lbl) lbl.textContent = fmt(T.seconds);
    if(modeLbl) modeLbl.textContent = T.mode==='work'?'FOCO':T.mode==='break'?'PAUSA':'PAUSA LONGA';
    if(btn) btn.textContent = T.running ? '⏸ Pausar' : '▶ Iniciar';
    if(prog){
      var total = totalFor(T.mode);
      var pct = T.seconds/total;
      var circ = 2*Math.PI*52;
      prog.setAttribute('stroke-dashoffset', circ*(1-pct));
      prog.setAttribute('stroke', T.mode==='work' ? 'var(--magenta)' : 'var(--sage)');
    }
  }
  function tick(){
    if(T.seconds>0){ T.seconds--; updateUI(); }
    else {
      clearInterval(T.interval); T.running=false;
      showToast(T.mode==='work'?'⏱ Tempo de foco concluído! Faça uma pausa.':'✓ Pausa concluída! Hora de focar.');
      updateUI();
    }
  }
  var toggleBtn = document.getElementById('timerToggle');
  var resetBtn = document.getElementById('timerReset');
  var workBtn = document.getElementById('timerWork');
  var breakBtn = document.getElementById('timerBreak');
  var longBtn = document.getElementById('timerLong');

  if(toggleBtn) toggleBtn.addEventListener('click', function(){
    if(T.running){ clearInterval(T.interval); T.running=false; }
    else { T.interval=setInterval(tick,1000); T.running=true; }
    updateUI();
  });
  if(resetBtn) resetBtn.addEventListener('click', function(){
    clearInterval(T.interval); T.running=false;
    T.seconds = totalFor(T.mode);
    updateUI();
  });
  if(workBtn) workBtn.addEventListener('click', function(){
    clearInterval(T.interval); T.running=false; T.mode='work'; T.seconds=25*60; updateUI();
  });
  if(breakBtn) breakBtn.addEventListener('click', function(){
    clearInterval(T.interval); T.running=false; T.mode='break'; T.seconds=5*60; updateUI();
  });
  if(longBtn) longBtn.addEventListener('click', function(){
    clearInterval(T.interval); T.running=false; T.mode='long'; T.seconds=15*60; updateUI();
  });

  var customSet = document.getElementById('timerCustomSet');
  var customInput = document.getElementById('timerCustomMin');
  if(customSet) customSet.addEventListener('click', function(){
    var mins = parseInt(customInput.value, 10);
    if(!mins || mins<1 || mins>120){ showToast('Digite um valor entre 1 e 120 minutos.'); return; }
    clearInterval(T.interval); T.running=false; T.mode='work'; T.seconds=mins*60;
    customInput.value='';
    updateUI();
    showToast('Timer definido para '+mins+' min. ✓');
  });
  if(customInput) customInput.addEventListener('keydown', function(e){
    if(e.key==='Enter') customSet && customSet.click();
  });

  updateUI();
}

function buildChecklistDays(opts){
  opts = opts || {};
  var wrap = document.getElementById('weekKanban');
  if(!wrap) return;
  var today = startOfToday();
  var todayIso = isoDate(today);

  // na abertura (ou sem intervalo definido) centraliza a janela de datas em hoje
  if(opts.initial || !checklistScroll.startDate || !checklistScroll.endDate){
    var dow = today.getDay();
    var monday = addDays(today, (dow===0)?-6:1-dow);
    checklistScroll.startDate = addDays(monday, -7);
    checklistScroll.endDate   = addDays(monday, 14);
  }

  var html = '';
  var cursor = new Date(checklistScroll.startDate);
  while(cursor <= checklistScroll.endDate){
    html += checklistDayColumnHtml(cursor, todayIso);
    cursor = addDays(cursor, 1);
  }
  wrap.innerHTML = html;
  bindChecklistDayHandlers(wrap);
  updateChecklistTitle();

  if(opts.initial){
    // trava o scroll infinito até terminar de posicionar em hoje
    checklistScroll.positioning = true;
    centerChecklistOnToday(wrap);                 // já posiciona na hora
    requestAnimationFrame(function(){
      centerChecklistOnToday(wrap);               // reposiciona após o layout final
      setTimeout(function(){
        if(document.getElementById('weekKanban') === wrap) centerChecklistOnToday(wrap);
        checklistScroll.positioning = false;
      }, 250);
    });
  }
}

function checklistDayColumnHtml(d, todayIso){
  var diso = isoDate(d);
  var isToday = diso===todayIso;
  return '<div class="week-col '+(isToday?'is-today':'')+'" data-day-col="'+diso+'">' +
    '<div class="week-col-head"><div class="week-col-dow">'+DOW_FULL[d.getDay()]+'</div><div class="week-col-date">'+d.getDate()+' '+d.toLocaleDateString('pt-BR',{month:'short'})+'</div></div>' +
    '<div class="week-col-body">' +
      weekCatBlock(diso, 'trabalho', 'cat-work', 'Trabalho') +
      weekCatBlock(diso, 'pessoal', 'cat-personal', 'Pessoal') +
    '</div>' +
  '</div>';
}

function weekCatBlock(dateIso, category, catClass, label){
  var items = state.checklist.filter(function(c){ return c.date===dateIso && c.category===category; })
    .sort(function(a,b){ if(a.done!==b.done) return a.done?1:-1; return (a.createdAt||0)-(b.createdAt||0); });
  var autoItems = category==='trabalho' ? autoDeadlineItemsForDate(dateIso) : [];

  var html = '<div data-cat-block="'+dateIso+'|'+category+'"><div class="week-cat-label '+catClass+'">'+label+'</div>';
  if(items.length>0 || autoItems.length>0){
    html += '<div class="check-list">';
    html += autoItems.map(function(a){
      return '<div class="check-item auto-deadline" draggable="true" data-drag-item="auto" data-job-id="'+a.jobId+'" data-open-job="'+a.jobId+'">' +
        '<span class="check-box" aria-hidden="true" style="visibility:hidden;"></span>' +
        '<span class="check-text">'+escapeHtml(a.text)+'<br><span class="check-auto-tag">prazo</span></span>' +
      '</div>';
    }).join('');
    html += items.map(function(c){
      return '<div class="check-item '+(c.done?'checked':'')+'" draggable="true" data-drag-item="task" data-check-id="'+c.id+'">' +
        '<button class="check-box '+(c.done?'checked':'')+'" data-toggle-check="'+c.id+'" aria-label="Marcar como concluída">'+(c.done?'✓':'')+'</button>' +
        '<span class="check-text">'+escapeHtml(c.text)+'</span>' +
        '<button class="check-del" data-del-check="'+c.id+'" aria-label="Excluir tarefa">✕</button>' +
      '</div>';
    }).join('');
    html += '</div>';
  }
  html += '<button class="week-add" data-add-check="'+dateIso+'|'+category+'">+ Adicionar</button></div>';
  return html;
}

/* Re-renders only the affected day column instead of the whole scroller,
   so scroll position is preserved and nothing flickers. */
function refreshChecklistDay(dateIso){
  var wrap = document.getElementById('weekKanban');
  if(!wrap) return;

  // salva scroll ANTES de qualquer mudança
  var savedScroll = wrap.scrollLeft;

  var col = wrap.querySelector('[data-day-col="'+dateIso+'"]');
  if(col){
    // coluna existe — só atualiza ela, sem tocar no scroll
    var d = new Date(dateIso+'T00:00:00');
    var todayIso = isoDate(startOfToday());
    var temp = document.createElement('div');
    temp.innerHTML = checklistDayColumnHtml(d, todayIso);
    col.replaceWith(temp.firstElementChild);
    bindChecklistDayHandlers(wrap);
  }
  // sempre restaura o scroll — mesmo que a coluna não exista
  requestAnimationFrame(function(){
    setScrollLeftInstant(wrap, savedScroll);
  });
}

function updateChecklistTitle(){
  var titleEl = document.getElementById('weekTitle');
  if(!titleEl) return;

  var wrap = document.getElementById('weekKanban');
  if(!wrap){ titleEl.textContent = ''; return; }

  // lê as datas diretamente do DOM — ignora checklistScroll completamente
  var cols = wrap.querySelectorAll('.week-col[data-day-col]');
  if(cols.length === 0){ titleEl.textContent = ''; return; }

  var wrapLeft = wrap.getBoundingClientRect().left;
  var wrapRight = wrap.getBoundingClientRect().right;
  var visibleDates = [];

  cols.forEach(function(col){
    var rect = col.getBoundingClientRect();
    var iso = col.getAttribute('data-day-col');
    if(iso && rect.right > wrapLeft + 10 && rect.left < wrapRight - 10){
      visibleDates.push(new Date(iso + 'T00:00:00'));
    }
  });

  // fallback: pega todas se nenhuma visível
  if(visibleDates.length === 0){
    cols.forEach(function(col){
      var iso = col.getAttribute('data-day-col');
      if(iso) visibleDates.push(new Date(iso + 'T00:00:00'));
    });
  }

  if(visibleDates.length === 0){ titleEl.textContent = ''; return; }

  visibleDates.sort(function(a,b){ return a - b; });
  var first = visibleDates[0];
  var last  = visibleDates[visibleDates.length - 1];

  if(first.getMonth() === last.getMonth() && first.getFullYear() === last.getFullYear()){
    titleEl.textContent =
      first.toLocaleDateString('pt-BR',{day:'2-digit'}) + ' – ' +
      last.toLocaleDateString('pt-BR',{day:'2-digit', month:'long', year:'numeric'});
  } else {
    titleEl.textContent =
      first.toLocaleDateString('pt-BR',{day:'2-digit', month:'short'}) + ' – ' +
      last.toLocaleDateString('pt-BR',{day:'2-digit', month:'short', year:'numeric'});
  }
}

function scrollChecklistByDays(n){
  var wrap = document.getElementById('weekKanban');
  if(!wrap) return;
  var col = wrap.querySelector('.week-col');
  var step = col ? (col.getBoundingClientRect().width + 16) * n : 200*n;
  wrap.scrollBy({left:step, behavior:'smooth'});
}

function scrollChecklistToToday(){
  var today = startOfToday();
  if(today < checklistScroll.startDate || today > checklistScroll.endDate){
    buildChecklistDays({initial:true});
    return;
  }
  var wrap = document.getElementById('weekKanban');
  var todayCol = wrap.querySelector('.week-col.is-today');
  if(todayCol){
    var target = todayCol.offsetLeft - (wrap.clientWidth - todayCol.offsetWidth)/2;
    wrap.scrollTo({left:Math.max(0,target), behavior:'smooth'});
  }
}

/* Infinite scroll: as the user nears either edge, prepend/append more days
   without resetting scroll position. */
function onChecklistScroll(e){
  if(checklistScroll.positioning){ updateChecklistTitle(); return; }
  if(checklistScroll.loadingEdge) return;
  var wrap = e.target;
  var nearRightEdge = wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - CHECKLIST_EDGE_THRESHOLD;
  var nearLeftEdge = wrap.scrollLeft <= CHECKLIST_EDGE_THRESHOLD;

  if(nearRightEdge){
    appendChecklistDays(CHECKLIST_CHUNK);
  } else if(nearLeftEdge){
    prependChecklistDays(CHECKLIST_CHUNK);
  }
  // atualiza título com os dias visíveis após scroll
  updateChecklistTitle();
}

function appendChecklistDays(n){
  checklistScroll.loadingEdge = true;
  var wrap = document.getElementById('weekKanban');
  var todayIso = isoDate(startOfToday());
  var frag = document.createDocumentFragment();
  var cursor = addDays(checklistScroll.endDate, 1);
  for(var i=0;i<n;i++){
    var temp = document.createElement('div');
    temp.innerHTML = checklistDayColumnHtml(cursor, todayIso);
    frag.appendChild(temp.firstElementChild);
    cursor = addDays(cursor, 1);
  }
  checklistScroll.endDate = addDays(checklistScroll.endDate, n);
  wrap.appendChild(frag);
  bindChecklistDayHandlers(wrap);
  updateChecklistTitle();
  checklistScroll.loadingEdge = false;
}

function prependChecklistDays(n){
  checklistScroll.loadingEdge = true;
  var wrap = document.getElementById('weekKanban');
  var todayIso = isoDate(startOfToday());
  var prevScrollWidth = wrap.scrollWidth;
  var prevScrollLeft = wrap.scrollLeft;

  var frag = document.createDocumentFragment();
  var cursor = addDays(checklistScroll.startDate, -n);
  var days = [];
  for(var i=0;i<n;i++){ days.push(addDays(cursor, i)); }
  days.forEach(function(d){
    var temp = document.createElement('div');
    temp.innerHTML = checklistDayColumnHtml(d, todayIso);
    frag.appendChild(temp.firstElementChild);
  });
  checklistScroll.startDate = cursor;
  wrap.insertBefore(frag, wrap.firstChild);
  bindChecklistDayHandlers(wrap);
  updateChecklistTitle();

  // Preserve visual scroll position since we just inserted content to the left.
  setScrollLeftInstant(wrap, prevScrollLeft + (wrap.scrollWidth - prevScrollWidth));
  checklistScroll.loadingEdge = false;
}

/* ---- drag and drop: move a task (or a job's deadline) to another day ---- */
var checklistDrag = null; // {type:'task'|'auto', id, sourceDateIso}

function bindChecklistDragHandlers(wrap){
  wrap.querySelectorAll('[data-drag-item]').forEach(function(el){
    el.addEventListener('dragstart', function(e){
      var type = el.getAttribute('data-drag-item');
      checklistDrag = {
        type: type,
        checkId: el.getAttribute('data-check-id'),
        jobId: el.getAttribute('data-job-id')
      };
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', function(){
      el.classList.remove('dragging');
      checklistDrag = null;
    });
  });

  wrap.querySelectorAll('[data-cat-block]').forEach(function(block){
    block.addEventListener('dragover', function(e){
      var parts = block.getAttribute('data-cat-block').split('|');
      var category = parts[1];
      // Auto deadline items only belong in "trabalho" — block drops elsewhere.
      if(checklistDrag && checklistDrag.type==='auto' && category!=='trabalho') return;
      e.preventDefault();
      block.closest('.week-col-body').classList.add('drag-over');
    });
    block.addEventListener('dragleave', function(){
      block.closest('.week-col-body').classList.remove('drag-over');
    });
    block.addEventListener('drop', function(e){
      e.preventDefault();
      block.closest('.week-col-body').classList.remove('drag-over');
      if(!checklistDrag) return;
      var parts = block.getAttribute('data-cat-block').split('|');
      var targetDate = parts[0];
      var targetCategory = parts[1];

      if(checklistDrag.type==='task'){
        moveChecklistTask(checklistDrag.checkId, targetDate, targetCategory);
      } else if(checklistDrag.type==='auto' && targetCategory==='trabalho'){
        moveJobDeadline(checklistDrag.jobId, targetDate);
      }
      checklistDrag = null;
    });
  });
}

function moveChecklistTask(checkId, targetDate, targetCategory){
  var item = state.checklist.find(function(c){ return c.id===checkId; });
  if(!item) return;
  var sourceDate = item.date;
  if(item.date===targetDate && item.category===targetCategory) return;
  item.date = targetDate;
  item.category = targetCategory;
  saveChecklist();
  refreshChecklistDay(sourceDate);
  if(targetDate!==sourceDate) refreshChecklistDay(targetDate);
  showToast('Tarefa movida.');
}

function moveJobDeadline(jobId, targetDate){
  var job = state.jobs.find(function(j){ return j.id===jobId; });
  if(!job) return;
  var sourceDate = job.deadline;
  if(sourceDate===targetDate) return;
  job.deadline = targetDate;
  saveJobs();
  if(sourceDate) refreshChecklistDay(sourceDate);
  refreshChecklistDay(targetDate);
  showToast('Prazo do trabalho atualizado.');
}

/* ---------------- finance helpers (shared by dashboard + payments) ---------------- */
function financeSummary(){
  var activeJobs = state.jobs.filter(function(j){ return j.status!==STATUS_CANCELLED; });

  var receivedFromJobs = 0;
  var pendingFromJobs = 0;
  activeJobs.forEach(function(j){
    receivedFromJobs += jobPaidValue(j);
    pendingFromJobs += jobPendingValue(j);
  });
  var previsto = receivedFromJobs + pendingFromJobs;

  var realExpenses = state.expenses.filter(function(e){ return e.type!=='reembolso'; });
  var refunds = state.expenses.filter(function(e){ return e.type==='reembolso'; });

  var paidExpenses = realExpenses.filter(function(e){ return e.paid; });
  var unpaidExpenses = realExpenses.filter(function(e){ return !e.paid; });
  var totalExpenses = paidExpenses.reduce(function(s,e){ return s+parseMoneyGuess(e.value); }, 0);

  var receivedRefunds = refunds.filter(function(e){ return e.paid; }).reduce(function(s,e){ return s+parseMoneyGuess(e.value); }, 0);
  var pendingRefunds = refunds.filter(function(e){ return !e.paid; }).reduce(function(s,e){ return s+parseMoneyGuess(e.value); }, 0);

  // Lucro líquido: tudo que entrou (trabalhos pagos + reembolsos recebidos) menos despesas pagas.
  var lucroLiquido = (receivedFromJobs + receivedRefunds) - totalExpenses;
  // Saldo: a mesma conta, é o resultado líquido acumulado até agora.
  var saldo = lucroLiquido;
  // Fluxo de caixa previsto: o que ainda vai entrar/sair, considerando pendências de ambos os lados.
  var fluxoCaixaPrevisto = saldo + pendingFromJobs + pendingRefunds - unpaidExpenses.reduce(function(s,e){ return s+parseMoneyGuess(e.value); }, 0);

  return {
    previsto: previsto,
    recebido: receivedFromJobs,
    pendente: pendingFromJobs,
    despesas: totalExpenses,
    despesasPendentes: unpaidExpenses.reduce(function(s,e){ return s+parseMoneyGuess(e.value); }, 0),
    reembolsosRecebidos: receivedRefunds,
    reembolsosPendentes: pendingRefunds,
    lucroLiquido: lucroLiquido,
    saldo: saldo,
    fluxoCaixaPrevisto: fluxoCaixaPrevisto,
    jobsFechados: activeJobs.length,
    awaitingJobs: state.jobs.filter(function(j){ return j.status==='aguardando_pagamento'; }),
    paidJobs: state.jobs.filter(function(j){ return j.status==='pago'; })
  };
}

/* returns a flat list of receivable items: one row per installment, or one row per single-payment job */
function getReceivableItems(){
  var todayIso = isoDate(new Date());
  var currentMonthPrefix = todayIso.slice(0,7); // "2026-07"

  // Rolagem automática: se um item não foi pago e o mês previsto já passou,
  // exibe no mês atual sem alterar o dado original no Firebase.
  function effectiveDate(date, paid){
    if(paid || !date) return date;
    var itemMonth = date.slice(0,7);
    if(itemMonth < currentMonthPrefix) return currentMonthPrefix + '-01';
    return date;
  }

  var items = [];
  state.jobs.filter(function(j){ return j.status!==STATUS_CANCELLED; }).forEach(function(j){
    var brand = brandById(j.brandId);
    if(j.paymentType==='split' && j.installments && j.installments.length>0){
      j.installments.forEach(function(inst, idx){
        var rawDate = inst.paid ? inst.paidDate : (inst.dueDate || j.payDate || j.deadline);
        items.push({
          jobId:j.id, installmentId:inst.id, installmentIndex:idx,
          label:(brand?brand.name:j.title) + ' · ' + inst.label,
          value:parseMoneyGuess(inst.value), currency:j.currency||'BRL', paid:!!inst.paid,
          date: effectiveDate(rawDate, !!inst.paid),
          originalDate: rawDate,
          contentType: j.contentType
        });
      });
    } else {
      var rawDate = j.status==='pago' ? j.payDate : (j.payDate || j.deadline);
      items.push({
        jobId:j.id, installmentId:null, installmentIndex:null,
        label:(brand?brand.name:j.title),
        value:parseMoneyGuess(j.value), currency:j.currency||'BRL', paid:j.status==='pago',
        date: effectiveDate(rawDate, j.status==='pago'),
        originalDate: rawDate,
        contentType: j.contentType
      });
    }
  });
  return items;
}

function markReceivablePaid(jobId, installmentId){
  var job = state.jobs.find(function(j){ return j.id===jobId; });
  if(!job) return;
  if(installmentId){
    var inst = (job.installments||[]).find(function(i){ return i.id===installmentId; });
    if(!inst) return;
    inst.paid = true;
    inst.paidDate = isoDate(new Date());
    var allPaid = job.installments.every(function(i){ return i.paid; });
    if(allPaid && job.status!=='pago'){ job.status = 'pago'; }
  } else {
    job.status = 'pago';
    job.payDate = job.payDate || isoDate(new Date());
  }
  saveJobs();
  showToast('Marcado como recebido.');
}

function renderPayments(){
  var summary = financeSummary();
  var html = '';
  html += '<div class="page-head"><div><h1>Finanças 💰</h1><p class="page-sub">Todos os seus recebimentos, despesas e reembolsos.</p></div>' +
    '<div style="display:flex; gap:8px;">' +
    '<button class="btn btn-sm btn-ghost" id="btnExchangeRates">câmbio</button>' +
    '<button class="btn btn-primary" id="btnNewRecord"><span>+</span> Novo registro</button>' +
    '</div></div>';

  html += financeViewSwitch('payments');
  html += '<div class="metrics">';
  html += metricCard("Previsto", fmtBRL(summary.previsto), "", "");
  html += metricCard("Recebido", fmtBRL(summary.recebido), "sage", "");
  html += metricCard("Pendente", fmtBRL(summary.pendente), "amber", "");
  html += metricCard("Despesas", fmtBRL(summary.despesas), "coral", "");
  html += metricCard("Saldo", fmtBRL(summary.saldo), summary.saldo>=0?"sage":"coral", "lucro líquido até agora");
  html += metricCard("Fluxo de caixa previsto", fmtBRL(summary.fluxoCaixaPrevisto), summary.fluxoCaixaPrevisto>=0?"sage":"coral", "considerando pendências");
  html += '</div>';

  html += '<div class="pill-tabs" id="paymentsTabs">' +
    '<button class="pill-tab '+(state.paymentsTab==='receitas'?'active':'')+'" data-ptab="receitas">Receitas</button>' +
    '<button class="pill-tab '+(state.paymentsTab==='despesas'?'active':'')+'" data-ptab="despesas">Despesas</button>' +
    '<button class="pill-tab '+(state.paymentsTab==='reembolsos'?'active':'')+'" data-ptab="reembolsos">Reembolsos</button>' +
    '<button class="pill-tab '+(state.paymentsTab==='historico'?'active':'')+'" data-ptab="historico">Histórico</button>' +
  '</div>';

  html += '<div id="paymentsListWrap"></div>';

  document.getElementById('pageContent').innerHTML = html;
  document.getElementById('btnNewRecord').addEventListener('click', function(){ openRecordModal(); });
  bindFinanceViewSwitch();
  document.getElementById('btnExchangeRates').addEventListener('click', function(){ openExchangeRatesModal(); });
  document.getElementById('paymentsTabs').addEventListener('click', function(e){
    var btn = e.target.closest('.pill-tab');
    if(!btn) return;
    state.paymentsTab = btn.getAttribute('data-ptab');
    renderPayments();
  });
  renderPaymentsList();
}

function receivableRowHtml(item){
  var wasRolled = item.originalDate && item.date !== item.originalDate;
  var originalMonthLabel = wasRolled ? (function(){
    var d = new Date(item.originalDate + 'T00:00:00');
    return d.toLocaleDateString('pt-BR',{month:'long'});
  })() : null;

  return '<div class="kanban-card" style="display:flex; align-items:center; gap:12px; cursor:default;">' +
    '<button class="check-box" data-mark-paid="'+item.jobId+'" data-inst-id="'+(item.installmentId||'')+'" aria-label="Marcar como recebido" style="flex-shrink:0;"></button>' +
    '<div style="flex:1; min-width:0; cursor:pointer;" data-open-job="'+item.jobId+'">' +
      '<p class="kanban-card-title" style="margin-bottom:4px; font-size:14px;">'+escapeHtml(item.label)+(item.contentType?' <span style="font-weight:400; color:var(--ink-soft); font-size:12.5px;">· '+escapeHtml(item.contentType)+'</span>':'')+'</p>' +
      '<span style="font-size:12px; color:var(--ink-faint);">'+(item.originalDate&&!wasRolled?fmtDate(item.originalDate):'sem data original')+'</span>' +
      (wasRolled ? ' <span class="tag" style="background:var(--danger-tint); color:var(--danger); font-size:10.5px;">previsto em '+escapeHtml(originalMonthLabel)+'</span>' : '') +
    '</div>' +
    '<span class="tag-value" style="font-size:15px;">'+fmtCurrency(item.value, item.currency)+'</span>' +
  '</div>';
}

function receivedRowHtml(item){
  return '<div class="kanban-card" style="display:flex; align-items:center; gap:12px; cursor:pointer;" data-open-job="'+item.jobId+'">' +
    '<div style="flex:1; min-width:0;">' +
      '<p class="kanban-card-title" style="margin-bottom:4px; font-size:14px;">'+escapeHtml(item.label)+'</p>' +
      '<span class="tag" style="background:var(--sage-tint); color:var(--sage-deep);">recebido</span> ' +
      '<span style="font-size:12px; color:var(--ink-faint);">'+(item.date?fmtDate(item.date):'')+'</span>' +
    '</div>' +
    '<span class="tag-value" style="font-size:15px;">'+fmtCurrency(item.value, item.currency)+'</span>' +
  '</div>';
}

function expenseRowHtml(exp){
  var isRefund = exp.type==='reembolso';
  var statusTone = exp.paid
    ? {bg:'var(--sage-tint)', fg:'var(--sage-deep)', label: isRefund ? 'recebido' : 'pago'}
    : {bg:'var(--amber-tint)', fg:'var(--amber-deep)', label:'pendente'};
  var valueColor = isRefund ? 'var(--sage-deep)' : 'var(--danger)';
  var valuePrefix = isRefund ? '+' : '-';
  return '<div class="kanban-card" data-expense-id="'+exp.id+'" style="display:flex; align-items:center; justify-content:space-between; gap:14px; cursor:pointer;">' +
    '<div style="min-width:0;">' +
      '<p class="kanban-card-title" style="margin-bottom:6px;">'+(exp.type!=='reembolso'?'<span title="'+escapeHtml(expenseCategory(exp.category).label)+'">'+expenseCategory(exp.category).ico+'</span> ':'')+escapeHtml(exp.description)+'</p>' +
      '<span class="tag" style="background:'+statusTone.bg+'; color:'+statusTone.fg+';">'+statusTone.label+'</span> ' +
      (isRefund ? '<span class="tag" style="background:var(--sage-tint); color:var(--sage-deep);">reembolso</span> ' : '') +
      '<span style="font-size:12px; color:var(--ink-faint);">'+(exp.date?fmtDate(exp.date):'')+'</span>' +
    '</div>' +
    '<span class="tag-value" style="color:'+valueColor+';">'+valuePrefix+fmtCurrency(parseMoneyGuess(exp.value), exp.currency||'BRL')+'</span>' +
  '</div>';
}

function openExchangeRatesModal(){
  var foreignCurrencies = CURRENCIES.filter(function(c){ return c.code!=='BRL'; });
  var modalHtml =
    '<div class="overlay" id="fxOverlay">' +
      '<div class="modal" role="dialog" aria-modal="true" style="max-width:400px;">' +
        '<div class="modal-head"><h2>Taxas de câmbio</h2><button class="modal-close" id="fxModalClose" aria-label="Fechar">✕</button></div>' +
        '<p style="font-size:12.5px; color:var(--ink-soft); margin:-8px 0 16px;">Usadas para converter trabalhos em outras moedas e somar tudo nos totais em Real.</p>' +
        foreignCurrencies.map(function(c){
          return '<div class="field"><label for="fx_'+c.code+'">1 '+c.code+' equivale a quantos R$</label>' +
            '<input id="fx_'+c.code+'" type="text" inputmode="decimal" placeholder="Ex: 5,40" value="'+escapeHtml(String(state.exchangeRates[c.code]||'').replace('.',','))+'" /></div>';
        }).join('') +
        '<div class="modal-actions"><button class="btn btn-ghost" id="fxCancel">cancelar</button><button class="btn btn-primary" id="fxSave">Salvar taxas</button></div>' +
      '</div>' +
    '</div>';
  document.getElementById('modalRoot').innerHTML = modalHtml;
  function close(){ document.getElementById('modalRoot').innerHTML = ''; }
  document.getElementById('fxModalClose').addEventListener('click', close);
  document.getElementById('fxCancel').addEventListener('click', close);
  document.getElementById('fxOverlay').addEventListener('click', function(e){ if(e.target.id==='fxOverlay') close(); });

  document.getElementById('fxSave').addEventListener('click', function(){
    var newRates = {BRL:1};
    var hasInvalid = false;
    foreignCurrencies.forEach(function(c){
      var raw = document.getElementById('fx_'+c.code).value.trim();
      var n = parseMoneyGuess(raw);
      if(!raw || n<=0){ hasInvalid = true; return; }
      newRates[c.code] = n;
    });
    if(hasInvalid){ showToast('Informe uma taxa válida, maior que zero, para cada moeda.'); return; }
    state.exchangeRates = newRates;
    var btn = document.getElementById('fxSave');
    btn.disabled = true;
    saveExchangeRates().then(function(){
      close();
      showToast('Taxas de câmbio atualizadas.');
      render();
    }).catch(function(){
      btn.disabled = false;
      showToast('Não foi possível salvar. Tente novamente.');
    });
  });
}

function renderPaymentsList(){
  var wrap = document.getElementById('paymentsListWrap');
  var html = '';

  if(state.paymentsTab==='receitas'){
    var allReceivable = getReceivableItems();
    var pending = allReceivable.filter(function(it){ return !it.paid; })
      .sort(function(a,b){ return (a.date||'9999').localeCompare(b.date||'9999'); });
    var received = allReceivable.filter(function(it){ return it.paid; })
      .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

    // Agrupa pendentes por mês
    var pendingByMonth = {};
    pending.forEach(function(it){
      var key = it.date ? it.date.slice(0,7) : 'sem-data';
      (pendingByMonth[key] = pendingByMonth[key]||[]).push(it);
    });

    var monthKeys = Object.keys(pendingByMonth).sort();

    if(monthKeys.length === 0){
      html += '<div class="section">' + emptyState("Nada pendente por aqui.") + '</div>';
    } else {
      monthKeys.forEach(function(key){
        var items = pendingByMonth[key];
        var monthLabel = key === 'sem-data' ? 'Sem data definida' : (function(){
          var parts = key.split('-');
          var d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, 1);
          return d.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
        })();
        // Total do mês convertido para BRL
        var monthTotal = items.reduce(function(s,it){
          return s + parseMoneyBRL(it.value, it.currency);
        }, 0);
        var isCurrentMonth = key === (function(){
          var n = new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
        })();

        html += '<div class="section">';
        html += '<div class="section-head" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">';
        html += '<h2 style="text-transform:capitalize; display:flex; align-items:center; gap:8px;">';
        if(isCurrentMonth) html += '<span class="status-badge" style="background:var(--magenta-tint); color:var(--magenta-deep); font-size:10px;">este mês</span>';
        html += escapeHtml(monthLabel) + '</h2>';
        html += '<span style="font-size:14px; font-weight:700; color:var(--sage-deep);">'+fmtBRL(monthTotal)+'</span>';
        html += '</div>';
        html += '<div class="kanban-col-body" style="background:transparent;border:none;padding:0;">' + items.map(receivableRowHtml).join('') + '</div>';
        html += '</div>';
      });
    }

    // Recebidos agrupados por mês também
    var receivedByMonth = {};
    received.forEach(function(it){
      var key = it.date ? it.date.slice(0,7) : 'sem-data';
      (receivedByMonth[key] = receivedByMonth[key]||[]).push(it);
    });
    var receivedKeys = Object.keys(receivedByMonth).sort().reverse();

    html += '<div class="section"><div class="section-head"><h2>Recebidos ('+received.length+')</h2></div>';
    if(received.length === 0){
      html += emptyState("Nenhum trabalho pago ainda.");
    } else {
      receivedKeys.forEach(function(key){
        var items = receivedByMonth[key];
        var monthLabel = key === 'sem-data' ? 'Sem data' : (function(){
          var parts = key.split('-');
          var d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, 1);
          return d.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
        })();
        var monthTotal = items.reduce(function(s,it){
          return s + parseMoneyBRL(it.value, it.currency);
        }, 0);
        html += '<div style="margin-bottom:16px;">';
        html += '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; padding:0 2px;">';
        html += '<span style="font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:capitalize;">'+escapeHtml(monthLabel)+'</span>';
        html += '<span style="font-size:12.5px; font-weight:700; color:var(--sage-deep);">'+fmtBRL(monthTotal)+'</span>';
        html += '</div>';
        html += '<div class="kanban-col-body" style="background:transparent;border:none;padding:0;">' + items.map(receivedRowHtml).join('') + '</div>';
        html += '</div>';
      });
    }
    html += '</div>';

  } else if(state.paymentsTab==='despesas'){
    var allExpenses = state.expenses.filter(function(e){ return e.type!=='reembolso'; });
    var unpaid = allExpenses.filter(function(e){ return !e.paid; }).sort(function(a,b){ return (a.date||'9999').localeCompare(b.date||'9999'); });
    var paid = allExpenses.filter(function(e){ return e.paid; }).sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

    html += '<div class="section"><div class="section-head"><h2>Pendentes ('+unpaid.length+')</h2></div>';
    html += unpaid.length===0 ? emptyState("Nenhuma despesa pendente.")
      : '<div class="kanban-col-body" style="background:transparent;border:none;padding:0;">' + unpaid.map(expenseRowHtml).join('') + '</div>';
    html += '</div>';

    html += '<div class="section"><div class="section-head"><h2>Pagas ('+paid.length+')</h2></div>';
    html += paid.length===0 ? emptyState("Nenhuma despesa registrada.")
      : '<div class="kanban-col-body" style="background:transparent;border:none;padding:0;">' + paid.map(expenseRowHtml).join('') + '</div>';
    html += '</div>';

  } else if(state.paymentsTab==='reembolsos'){
    var allRefunds = state.expenses.filter(function(e){ return e.type==='reembolso'; });
    var unpaidR = allRefunds.filter(function(e){ return !e.paid; }).sort(function(a,b){ return (a.date||'9999').localeCompare(b.date||'9999'); });
    var paidR = allRefunds.filter(function(e){ return e.paid; }).sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

    html += '<div class="section"><div class="section-head"><h2>A receber ('+unpaidR.length+')</h2></div>';
    html += unpaidR.length===0 ? emptyState("Nenhum reembolso pendente.")
      : '<div class="kanban-col-body" style="background:transparent;border:none;padding:0;">' + unpaidR.map(expenseRowHtml).join('') + '</div>';
    html += '</div>';

    html += '<div class="section"><div class="section-head"><h2>Recebidos ('+paidR.length+')</h2></div>';
    html += paidR.length===0 ? emptyState("Nenhum reembolso registrado.")
      : '<div class="kanban-col-body" style="background:transparent;border:none;padding:0;">' + paidR.map(expenseRowHtml).join('') + '</div>';
    html += '</div>';

  } else {
    var allItems = [];
    getReceivableItems().filter(function(it){return it.paid;}).forEach(function(it){
      allItems.push({type:'receita', date:it.date||'', label:it.label, value:it.value, currency:it.currency, ts:0});
    });
    state.expenses.filter(function(e){return e.paid;}).forEach(function(e){
      var isRefund = e.type==='reembolso';
      allItems.push({
        type: isRefund ? 'reembolso' : 'despesa',
        date:e.date||'',
        label:e.description,
        value: isRefund ? parseMoneyGuess(e.value) : -parseMoneyGuess(e.value),
        currency: e.currency||'BRL',
        ts:e.createdAt||0
      });
    });
    allItems.sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || b.ts-a.ts; });

    html += '<div class="section"><div class="section-head"><h2>Histórico</h2></div>';
    if(allItems.length===0){
      html += emptyState("Nenhum registro no histórico ainda.");
    } else {
      html += '<div class="kanban-col-body" style="background:transparent;border:none;padding:0;">' + allItems.map(function(it){
        return '<div class="kanban-card" style="display:flex; align-items:center; justify-content:space-between; gap:14px; cursor:default;">' +
          '<div><p class="kanban-card-title" style="margin-bottom:4px;">'+escapeHtml(it.label)+(it.type==='reembolso'?' <span style="font-weight:400; color:var(--ink-soft); font-size:12.5px;">· reembolso</span>':'')+'</p>' +
          '<span style="font-size:12px; color:var(--ink-faint);">'+(it.date?fmtDate(it.date):'sem data')+'</span></div>' +
          '<span class="tag-value" style="color:'+(it.value>=0?'var(--sage-deep)':'var(--danger)')+';">'+(it.value>=0?'+':'-')+fmtCurrency(Math.abs(it.value), it.currency)+'</span>' +
        '</div>';
      }).join('') + '</div>';
    }
    html += '</div>';
  }

  wrap.innerHTML = html;
  wrap.querySelectorAll('[data-open-job]').forEach(function(el){
    el.addEventListener('click', function(){ openJobModal(el.getAttribute('data-open-job')); });
  });
  wrap.querySelectorAll('[data-mark-paid]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var jobId = btn.getAttribute('data-mark-paid');
      var instId = btn.getAttribute('data-inst-id') || null;
      markReceivablePaid(jobId, instId);
      renderPayments();
    });
  });
  wrap.querySelectorAll('[data-expense-id]').forEach(function(card){
    card.addEventListener('click', function(){ openExpenseModal(card.getAttribute('data-expense-id')); });
  });
}

function openRecordModal(){
  var modalHtml =
    '<div class="overlay" id="recordOverlay">' +
      '<div class="modal" role="dialog" aria-modal="true" style="max-width:420px;">' +
        '<div class="modal-head"><h2>Novo registro</h2><button class="modal-close" id="recordModalClose" aria-label="Fechar">✕</button></div>' +
        '<div class="field"><label for="rType">Tipo</label><select id="rType">' +
          '<option value="despesa">Despesa</option>' +
          '<option value="reembolso">Reembolso</option>' +
          '<option value="receita">Receita (trabalho)</option>' +
        '</select></div>' +
        '<div id="recordBody"></div>' +
      '</div>' +
    '</div>';
  document.getElementById('modalRoot').innerHTML = modalHtml;
  function close(){ document.getElementById('modalRoot').innerHTML = ''; }
  document.getElementById('recordModalClose').addEventListener('click', close);
  document.getElementById('recordOverlay').addEventListener('click', function(e){ if(e.target.id==='recordOverlay') close(); });
  document.getElementById('rType').addEventListener('change', updateRecordBody);
  updateRecordBody();

  function updateRecordBody(){
    var type = document.getElementById('rType').value;
    var body = document.getElementById('recordBody');
    if(type==='receita'){
      body.innerHTML = '<div class="field"><p style="font-size:12.5px; color:var(--ink-soft); margin:0 0 14px;">Receita vem de um trabalho cadastrado. Vamos abrir o formulário de trabalho.</p></div>' +
        '<div class="modal-actions"><button class="btn btn-ghost" id="rCancel">cancelar</button><button class="btn btn-primary" id="rGoJob">Continuar</button></div>';
      document.getElementById('rCancel').addEventListener('click', close);
      document.getElementById('rGoJob').addEventListener('click', function(){
        close();
        openJobModal(null);
      });
      return;
    }

    var isRefund = type==='reembolso';
    var descLabel = isRefund ? 'Do que é o reembolso' : 'Descrição';
    var descPlaceholder = isRefund ? 'Ex: Devolução de frete, produto não usado...' : 'Ex: Edição de vídeo, equipamento...';
    var paidLabel = isRefund ? 'já recebi esse valor' : 'já foi paga';
    var saveLabel = isRefund ? 'Criar reembolso' : 'Criar despesa';

    body.innerHTML =
      '<div class="field"><label for="rDesc">'+descLabel+'</label><input id="rDesc" type="text" placeholder="'+descPlaceholder+'" /></div>' +
      '<div class="field-row">' +
        '<div class="field"><label for="rValue">Valor *</label><input id="rValue" type="text" inputmode="decimal" placeholder="0,00" /></div>' +
        '<div class="field"><label for="rCurrency">Moeda</label><select id="rCurrency">' + CURRENCIES.map(function(c){ return '<option value="'+c.code+'">'+c.label+'</option>'; }).join('') + '</select></div>' +
      '</div>' +
      (isRefund ? '' : '<div class="field"><label for="rCategory">Categoria</label><select id="rCategory">'+expenseCategoryOptions('outros')+'</select></div>') +
      '<div class="field"><label for="rDate">Data</label><input id="rDate" type="date" /></div>' +
      '<div class="field"><label style="display:flex; align-items:center; gap:8px; font-weight:500; color:var(--ink);"><input type="checkbox" id="rPaid" style="width:auto;" /> '+paidLabel+'</label></div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" id="rCancel">cancelar</button><button class="btn btn-primary" id="rSave">'+saveLabel+'</button></div>';
    document.getElementById('rCancel').addEventListener('click', close);
    document.getElementById('rDesc').focus();
    document.getElementById('rValue').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('rSave').click(); });

    document.getElementById('rSave').addEventListener('click', function(){
      var desc = document.getElementById('rDesc').value.trim();
      var rawValue = document.getElementById('rValue').value.trim();
      var numericValue = parseMoneyGuess(rawValue);

      if(!desc){ showToast(isRefund ? 'Descreva o reembolso.' : 'Descreva a despesa.'); document.getElementById('rDesc').focus(); return; }
      if(!rawValue || numericValue<=0){ showToast('Informe um valor válido, maior que zero.'); document.getElementById('rValue').focus(); return; }

      var btn = document.getElementById('rSave');
      btn.disabled = true;

      state.expenses.push({
        id:uid(), description:desc,
        value: rawValue,
        currency: document.getElementById('rCurrency').value,
        date: document.getElementById('rDate').value,
        paid: document.getElementById('rPaid').checked,
        type: isRefund ? 'reembolso' : 'despesa',
        category: isRefund ? '' : document.getElementById('rCategory').value,
        createdAt: Date.now()
      });
      saveExpenses().then(function(){
        close();
        showToast(isRefund ? 'Reembolso registrado.' : 'Despesa registrada.');
        render();
      }).catch(function(){
        btn.disabled = false;
        showToast('Não foi possível salvar. Tente novamente.');
      });
    });
  }
}

function openExpenseModal(expenseId){
  var exp = state.expenses.find(function(e){ return e.id===expenseId; });
  if(!exp) return;
  var isRefund = exp.type==='reembolso';
  var modalHtml =
    '<div class="overlay" id="expOverlay">' +
      '<div class="modal" role="dialog" aria-modal="true" style="max-width:420px;">' +
        '<div class="modal-head"><h2>'+(isRefund?'Editar reembolso':'Editar despesa')+'</h2><button class="modal-close" id="expModalClose" aria-label="Fechar">✕</button></div>' +
        '<div class="field"><label for="eType">Tipo</label><select id="eType">' +
          '<option value="despesa" '+(!isRefund?'selected':'')+'>Despesa</option>' +
          '<option value="reembolso" '+(isRefund?'selected':'')+'>Reembolso</option>' +
        '</select></div>' +
        '<div class="field"><label for="eDesc">Descrição</label><input id="eDesc" type="text" value="'+escapeHtml(exp.description)+'" /></div>' +
        '<div class="field-row">' +
          '<div class="field"><label for="eValue">Valor *</label><input id="eValue" type="text" inputmode="decimal" value="'+escapeHtml(exp.value)+'" /></div>' +
          '<div class="field"><label for="eCurrency">Moeda</label><select id="eCurrency">' + CURRENCIES.map(function(c){ return '<option value="'+c.code+'" '+((exp.currency||'BRL')===c.code?'selected':'')+'>'+c.label+'</option>'; }).join('') + '</select></div>' +
        '</div>' +
        '<div class="field" id="eCategoryWrap"'+(isRefund?' style="display:none"':'')+'><label for="eCategory">Categoria</label><select id="eCategory">'+expenseCategoryOptions(exp.category)+'</select></div>' +
        '<div class="field"><label for="eDate">Data</label><input id="eDate" type="date" value="'+(exp.date||'')+'" /></div>' +
        '<div class="field"><label id="ePaidLabel" style="display:flex; align-items:center; gap:8px; font-weight:500; color:var(--ink);"><input type="checkbox" id="ePaid" '+(exp.paid?'checked':'')+' style="width:auto;" /> <span id="ePaidLabelText">'+(isRefund?'já recebi esse valor':'já foi paga')+'</span></label></div>' +
        '<div class="modal-actions"><button class="btn btn-danger-text" id="eDelete" style="margin-right:auto;">excluir</button><button class="btn btn-ghost" id="eCancel">cancelar</button><button class="btn btn-primary" id="eSave">Salvar</button></div>' +
      '</div>' +
    '</div>';
  document.getElementById('modalRoot').innerHTML = modalHtml;
  function close(){ document.getElementById('modalRoot').innerHTML = ''; }
  document.getElementById('expModalClose').addEventListener('click', close);
  document.getElementById('eCancel').addEventListener('click', close);
  document.getElementById('expOverlay').addEventListener('click', function(e){ if(e.target.id==='expOverlay') close(); });
  document.getElementById('eType').addEventListener('change', function(){
    var nowRefund = document.getElementById('eType').value==='reembolso';
    document.getElementById('ePaidLabelText').textContent = nowRefund ? 'já recebi esse valor' : 'já foi paga';
    document.getElementById('eCategoryWrap').style.display = nowRefund ? 'none' : '';
  });
  document.getElementById('eDelete').addEventListener('click', function(){
    if(confirm(isRefund ? 'Excluir este reembolso?' : 'Excluir esta despesa?')){
      state.expenses = state.expenses.filter(function(e){ return e.id!==exp.id; });
      saveExpenses(); close(); showToast(isRefund?'Reembolso excluído.':'Despesa excluída.'); render();
    }
  });
  document.getElementById('eSave').addEventListener('click', function(){
    var desc = document.getElementById('eDesc').value.trim();
    var rawValue = document.getElementById('eValue').value.trim();
    var numericValue = parseMoneyGuess(rawValue);
    if(!desc){ showToast('Descreva o registro.'); document.getElementById('eDesc').focus(); return; }
    if(!rawValue || numericValue<=0){ showToast('Informe um valor válido, maior que zero.'); document.getElementById('eValue').focus(); return; }

    var btn = document.getElementById('eSave');
    btn.disabled = true;
    exp.description = desc;
    exp.value = rawValue;
    exp.currency = document.getElementById('eCurrency').value;
    exp.date = document.getElementById('eDate').value;
    exp.paid = document.getElementById('ePaid').checked;
    exp.type = document.getElementById('eType').value==='reembolso' ? 'reembolso' : 'despesa';
    exp.category = exp.type==='despesa' ? document.getElementById('eCategory').value : '';
    saveExpenses().then(function(){
      close(); showToast('Atualizado.'); render();
    }).catch(function(){
      btn.disabled = false;
      showToast('Não foi possível salvar. Tente novamente.');
    });
  });
}

/* ---------------- render: metrics ---------------- */
function renderMetrics(){
  var html = '';
  html += '<div class="page-head"><div><h1>Métricas</h1><p class="page-sub">Relatório da sua performance como criadora.</p></div></div>';

  var summary = financeSummary();
  var ticketMedio = summary.paidJobs.length>0 ? summary.recebido/summary.paidJobs.length : 0;

  html += '<div class="metrics">';
  html += metricCard("Trabalhos fechados", summary.jobsFechados, "", "ativos no funil");
  html += metricCard("Receita prevista", fmtBRL(summary.previsto), "", "");
  html += metricCard("Receita recebida", fmtBRL(summary.recebido), "sage", "");
  html += metricCard("Receita pendente", fmtBRL(summary.pendente), "amber", "");
  html += metricCard("Ticket médio", fmtBRL(ticketMedio), "", "por trabalho pago");
  html += metricCard("Lucro líquido", fmtBRL(summary.lucroLiquido), summary.lucroLiquido>=0?"sage":"coral", "");
  html += '</div>';

  // revenue by month (last 6 months)
  var months = [];
  var now = new Date();
  for(var i=5;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({year:d.getFullYear(), month:d.getMonth(), label:d.toLocaleDateString('pt-BR',{month:'short'})+'/'+String(d.getFullYear()).slice(2)});
  }
  var byMonth = months.map(function(m){
    var jobsInMonth = state.jobs.filter(function(j){
      if(j.status===STATUS_CANCELLED) return false;
      var refDate = j.payDate || j.deadline;
      if(!refDate) return false;
      var d = new Date(refDate+"T00:00:00");
      return d.getFullYear()===m.year && d.getMonth()===m.month;
    });
    var total = jobsInMonth.reduce(function(s,j){ return s+parseMoneyBRL(j.value, j.currency); }, 0);
    return {label:m.label, total:total, count:jobsInMonth.length};
  });
  var maxVal = Math.max.apply(null, byMonth.map(function(m){return m.total;}).concat([1]));

  html += '<div class="section"><div class="section-head"><h2>Receita por trabalhos (últimos 6 meses)</h2></div>';
  html += '<div class="table-wrap" style="padding:24px 20px;">';
  html += '<div style="display:flex; align-items:flex-end; gap:16px; height:140px;">';
  byMonth.forEach(function(m){
    var h = maxVal>0 ? Math.max(6, Math.round((m.total/maxVal)*120)) : 6;
    html += '<div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%;">' +
      '<span style="font-size:11.5px; font-weight:700; color:var(--ink);">'+fmtBRL(m.total)+'</span>' +
      '<div style="width:100%; max-width:46px; height:'+h+'px; background:var(--magenta); border-radius:6px 6px 2px 2px; opacity:'+(m.total>0?'1':'0.25')+';"></div>' +
      '<span style="font-size:11px; color:var(--ink-soft);">'+m.label+'</span>' +
      '<span style="font-size:10.5px; color:var(--ink-faint);">'+m.count+' job(s)</span>' +
    '</div>';
  });
  html += '</div></div></div>';

  // ---- Métricas por nicho ----
  var byNicho = {};
  state.jobs.filter(function(j){ return j.status!==STATUS_CANCELLED && j.nicho; }).forEach(function(j){
    var n = j.nicho;
    if(!byNicho[n]) byNicho[n] = {count:0, receita:0};
    byNicho[n].count++;
    byNicho[n].receita += parseMoneyBRL(j.value, j.currency);
  });
  var nichoEntries = Object.keys(byNicho).map(function(n){
    return {name:n, count:byNicho[n].count, receita:byNicho[n].receita};
  }).sort(function(a,b){ return b.count - a.count || b.receita - a.receita; });

  html += '<div class="section"><div class="section-head"><h2>Desempenho por nicho</h2></div>';
  if(nichoEntries.length === 0){
    html += emptyState("Nenhum trabalho com nicho cadastrado ainda.");
  } else {
    var maxNichoCount = Math.max.apply(null, nichoEntries.map(function(e){ return e.count; }).concat([1]));
    html += '<div class="table-wrap" style="padding:18px 20px; display:flex; flex-direction:column; gap:14px;">';
    nichoEntries.forEach(function(e){
      var pct = Math.round((e.count/maxNichoCount)*100);
      html += '<div>' +
        '<div style="display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; margin-bottom:5px;">' +
          '<strong>'+escapeHtml(e.name)+'</strong>' +
          '<span style="display:flex; gap:14px;">' +
            '<span style="color:var(--ink-soft); font-size:12px;">'+e.count+' trabalho'+(e.count>1?'s':'')+'</span>' +
            '<span style="font-weight:700; color:var(--sage-deep);">'+fmtBRL(e.receita)+'</span>' +
          '</span>' +
        '</div>' +
        '<div style="background:var(--lilac); border-radius:999px; height:7px; overflow:hidden;">' +
          '<div style="width:'+pct+'%; height:100%; background:var(--sage);"></div>' +
        '</div>' +
      '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  // ---- Métricas por plataforma ----
  var byPlat = {};
  state.jobs.filter(function(j){ return j.status!==STATUS_CANCELLED && j.platformId; }).forEach(function(j){
    var pid = j.platformId;
    if(!byPlat[pid]) byPlat[pid] = {count:0, receita:0};
    byPlat[pid].count++;
    byPlat[pid].receita += parseMoneyBRL(j.value, j.currency);
  });
  var platEntries = Object.keys(byPlat).map(function(pid){
    var plat = platformById(pid);
    return {name:plat?plat.name:'—', id:pid, count:byPlat[pid].count, receita:byPlat[pid].receita};
  }).sort(function(a,b){ return b.count - a.count; });

  html += '<div class="section"><div class="section-head"><h2>Desempenho por plataforma</h2></div>';
  if(platEntries.length === 0){
    html += emptyState("Nenhum trabalho com plataforma cadastrada ainda.");
  } else {
    var maxPlatCount = Math.max.apply(null, platEntries.map(function(e){ return e.count; }).concat([1]));
    html += '<div class="table-wrap" style="padding:18px 20px; display:flex; flex-direction:column; gap:14px;">';
    platEntries.forEach(function(e){
      var pct = Math.round((e.count/maxPlatCount)*100);
      var c = platformColor(e.id);
      html += '<div>' +
        '<div style="display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; margin-bottom:5px;">' +
          '<span style="display:flex; align-items:center; gap:7px;"><span class="status-dot" style="background:'+c.dot+';"></span><strong>'+escapeHtml(e.name)+'</strong></span>' +
          '<span style="display:flex; gap:14px;">' +
            '<span style="color:var(--ink-soft); font-size:12px;">'+e.count+' job'+(e.count>1?'s':'')+'</span>' +
            (e.receita>0?'<span style="font-weight:700; color:var(--sage-deep);">'+fmtBRL(e.receita)+'</span>':'') +
          '</span>' +
        '</div>' +
        '<div style="background:var(--lilac); border-radius:999px; height:7px; overflow:hidden;">' +
          '<div style="width:'+pct+'%; height:100%; background:'+c.dot+';"></div>' +
        '</div>' +
      '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  // top brands by revenue
  var byBrand = {};
  state.jobs.filter(function(j){return j.status==='pago';}).forEach(function(j){
    byBrand[j.brandId] = (byBrand[j.brandId]||0) + parseMoneyBRL(j.value, j.currency);
  });
  var topBrands = Object.keys(byBrand).map(function(id){
    var b = brandById(id);
    return {name:b?b.name:'—', total:byBrand[id]};
  }).sort(function(a,b){ return b.total-a.total; }).slice(0,5);
  var maxBrand = Math.max.apply(null, topBrands.map(function(b){return b.total;}).concat([1]));

  html += '<div class="section"><div class="section-head"><h2>Marcas que mais geraram receita</h2></div>';
  if(topBrands.length===0){
    html += emptyState("Nenhum trabalho pago ainda pra gerar esse ranking.");
  } else {
    html += '<div class="table-wrap" style="padding:18px 20px; display:flex; flex-direction:column; gap:14px;">';
    topBrands.forEach(function(b){
      var pct = maxBrand>0 ? Math.round((b.total/maxBrand)*100) : 0;
      html += '<div>' +
        '<div style="display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:5px;"><strong>'+escapeHtml(b.name)+'</strong><span>'+fmtBRL(b.total)+'</span></div>' +
        '<div style="background:var(--lilac); border-radius:999px; height:7px; overflow:hidden;"><div style="width:'+pct+'%; height:100%; background:var(--magenta);"></div></div>' +
      '</div>';
    });
    html += '</div></div>';
  }
  html += '</div>';

  document.getElementById('pageContent').innerHTML = html;
}

/* ---------------- modal: job ---------------- */
function openJobModal(jobId, presetStatus){
  var job = jobId ? state.jobs.find(function(j){return j.id===jobId;}) : null;
  var isNew = !job;

    return '<option value="'+escapeHtml(b.name)+'"></option>';
  }).join('');

  var currentBrand = job ? brandById(job.brandId) : null;

  var platformOptions = '<option value="">— nenhuma —</option>' + state.platforms.map(function(p){

  }).join('');

  var statusOptions = STATUS_FLOW.map(function(s){

      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">' +

            '<datalist id="jBrandList">'+brandDatalistOptions+'</datalist>' +
            '<p style="font-size:11.5px; color:var(--ink-faint); margin:6px 2px 0;">Marca nova? Só escrever o nome — ela é criada automaticamente.</p></div>' +
          '<div class="field"><label for="jPlatform">Plataforma</label><select id="jPlatform">'+platformOptions+'</select></div>' +
        '</div>' +

        '<div class="field"><label for="jStatus">Status *</label><select id="jStatus">'+statusOptions+'</select></div>' +

        '<div class="field-row">' +
          '<div class="field"><label for="jContentType">Tipo de conteúdo</label><select id="jContentType">'+contentOptions+'</select></div>' +
          '<div class="field"><label for="jNicho">Nicho</label>' +
            '<div style="display:flex; gap:8px;">' +
              '<input id="jNicho" type="text" list="jNichoList" placeholder="Escolha da lista ou digite um nicho" value="'+escapeHtml(job&&job.nicho?job.nicho:'')+'" autocomplete="off" style="flex:1;" />' +
              '<datalist id="jNichoList">'+state.nichos.map(function(n){ return '<option value="'+escapeHtml(n)+'"></option>'; }).join('')+'</datalist>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="field-row">' +
          '<div class="field"><label for="jVideos">Vídeos</label><input id="jVideos" type="number" min="0" placeholder="0" value="'+(job&&job.videoCount!=null?job.videoCount:'')+'" /></div>' +
          '<div class="field"><label for="jPhotos">Fotos</label><input id="jPhotos" type="number" min="0" placeholder="0" value="'+(job&&job.photoCount!=null?job.photoCount:'')+'" /></div>' +
          '<div class="field"><label for="jStories">Stories</label><input id="jStories" type="number" min="0" placeholder="0" value="'+(job&&job.storyCount!=null?job.storyCount:'')+'" /></div>' +

              '<input id="jValue" type="text" placeholder="Valor combinado, ou escreva “permuta”" value="'+escapeHtml(job?job.value:'')+'" style="flex:1;" />' +
            '</div></div>' +
        '</div>' +

        '<div class="field"><label>Tipo de pagamento</label>' +
          '<div style="display:flex; gap:18px; padding:4px 2px;">' +
            '<label style="display:flex; align-items:center; gap:7px; font-weight:500; font-size:13.5px; color:var(--ink);"><input type="radio" name="jPayType" id="jPayTypeSingle" value="single" style="width:auto;" '+((!job||job.paymentType!=='split')?'checked':'')+' /> Pagamento único</label>' +
            '<label style="display:flex; align-items:center; gap:7px; font-weight:500; font-size:13.5px; color:var(--ink);"><input type="radio" name="jPayType" id="jPayTypeSplit" value="split" style="width:auto;" '+((job&&job.paymentType==='split')?'checked':'')+' /> Parcelado</label>' +
          '</div>' +
        '</div>' +

        '<div id="jSplitOptions" style="display:'+((job&&job.paymentType==='split')?'block':'none')+';">' +
          '<div class="field"><label>Dividir em</label>' +
            '<div style="display:flex; flex-direction:column; gap:7px; padding:4px 2px;">' +
              '<label style="display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink);"><input type="radio" name="jSplitMode" id="jSplitHalf" value="half" style="width:auto;" '+((!job||job.splitMode!=='per_video' && job.splitMode!=='custom')?'checked':'')+' /> 50% antes + 50% depois</label>' +
              '<label style="display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink);"><input type="radio" name="jSplitMode" id="jSplitPerVideo" value="per_video" style="width:auto;" '+((job&&job.splitMode==='per_video')?'checked':'')+' /> Por vídeo (1 parcela/vídeo)</label>' +
              '<label style="display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink);"><input type="radio" name="jSplitMode" id="jSplitCustom" value="custom" style="width:auto;" '+((job&&job.splitMode==='custom')?'checked':'')+' /> Personalizado</label>' +
            '</div>' +
          '</div>' +
          '<div class="field"><label>Parcelas</label><div id="jInstallmentsPreview" class="table-wrap" style="padding:10px;"></div></div>' +
          '<button class="btn btn-sm btn-ghost" id="jAddInstallment" type="button" style="display:none; margin:-8px 0 14px;">+ Adicionar parcela</button>' +
        '</div>' +

        '<div class="field"><label for="jNotes">Observações</label>' +
          '<textarea id="jNotes" placeholder="Briefing, combinados e pendências">'+escapeHtml(job?job.notes:'')+'</textarea></div>' +

        '<div class="modal-actions">' +
          (isNew ? '' : '<button class="btn btn-danger-text" id="jDelete" style="margin-right:auto;">excluir</button>') +
          '<button class="btn btn-ghost" id="jCancel">cancelar</button>' +
          '<button class="btn btn-primary" id="jSave">'+(isNew?'Criar trabalho':'Salvar alterações')+'</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('modalRoot').innerHTML = modalHtml;
  document.getElementById('jTitle').focus();

  var workingInstallments = (job && job.installments) ? job.installments.map(function(i){ return Object.assign({}, i); }) : [];

  function currentSplitMode(){
    var checked = document.querySelector('input[name="jSplitMode"]:checked');
    return checked ? checked.value : 'half';
  }
  function refreshInstallmentsForMode(){
    var mode = currentSplitMode();
    var total = document.getElementById('jValue').value;
    var videos = document.getElementById('jVideos').value || 1;
    if(mode==='custom'){
      if(workingInstallments.length===0){
        workingInstallments = buildInstallments('half', total, videos, null);
      }
    } else {
      workingInstallments = buildInstallments(mode, total, videos, null);
    }
    renderInstallmentsPreview();
  }
  function renderInstallmentsPreview(){
    var mode = currentSplitMode();
    var wrap = document.getElementById('jInstallmentsPreview');
    var addBtn = document.getElementById('jAddInstallment');
    addBtn.style.display = mode==='custom' ? 'inline-flex' : 'none';
    if(workingInstallments.length===0){
      wrap.innerHTML = '<p style="font-size:12.5px; color:var(--ink-faint); margin:4px;">Defina o valor total acima para gerar as parcelas.</p>';
      return;
    }
    wrap.innerHTML = workingInstallments.map(function(inst, idx){
      return '<div style="display:flex; align-items:center; gap:8px; padding:6px 4px; '+(idx>0?'border-top:1px solid var(--line);':'')+'">' +
        (mode==='custom'
          ? '<input type="text" data-inst-label="'+idx+'" value="'+escapeHtml(inst.label)+'" style="flex:1; padding:7px 9px; border-radius:7px; border:1px solid var(--line); font-size:13px;" />'
          : '<span style="flex:1; font-size:13.5px;">'+escapeHtml(inst.label)+'</span>') +
        '<input type="text" data-inst-value="'+idx+'" value="'+escapeHtml(inst.value)+'" style="width:90px; padding:7px 9px; border-radius:7px; border:1px solid var(--line); font-size:13px;" '+(mode!=='custom'?'readonly':'')+' />' +
        (mode==='custom' && workingInstallments.length>1 ? '<button type="button" data-inst-del="'+idx+'" style="border:none;background:transparent;color:var(--ink-faint);font-size:14px;">✕</button>' : '<span style="width:18px;"></span>') +

    });
    wrap.querySelectorAll('[data-inst-label]').forEach(function(input){

      });

    workingInstallments.push({id:uid(), label:'Parcela '+(workingInstallments.length+1), value:'0', dueDate:'', paid:false, paidDate:''});
