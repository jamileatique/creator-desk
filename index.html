  });

  document.getElementById('jPayTypeSingle').addEventListener('change', toggleSplitVisibility);
  document.getElementById('jPayTypeSplit').addEventListener('change', toggleSplitVisibility);
  function toggleSplitVisibility(){
    var isSplit = document.getElementById('jPayTypeSplit').checked;
    document.getElementById('jSplitOptions').style.display = isSplit ? 'block' : 'none';
    if(isSplit) refreshInstallmentsForMode();
  }
  ['jSplitHalf','jSplitPerVideo','jSplitCustom'].forEach(function(id){
    document.getElementById(id).addEventListener('change', refreshInstallmentsForMode);
  });
  document.getElementById('jValue').addEventListener('input', function(){
    if(document.getElementById('jPayTypeSplit').checked && currentSplitMode()!=='custom') refreshInstallmentsForMode();
  });
  document.getElementById('jVideos').addEventListener('input', function(){
    if(document.getElementById('jPayTypeSplit').checked && currentSplitMode()==='per_video') refreshInstallmentsForMode();
  });

  if(job && job.paymentType==='split'){
    renderInstallmentsPreview();
  }

  function close(){ document.getElementById('modalRoot').innerHTML = ''; }
  document.getElementById('jobModalClose').addEventListener('click', close);
  document.getElementById('jCancel').addEventListener('click', close);
  document.getElementById('jobOverlay').addEventListener('click', function(e){ if(e.target.id==='jobOverlay') close(); });

  if(!isNew){
    document.getElementById('jDelete').addEventListener('click', function(){
      if(confirm('Excluir este trabalho? Essa ação não pode ser desfeita.')){
        state.jobs = state.jobs.filter(function(j){return j.id!==job.id;});
        saveJobs();
        close();
        showToast('Trabalho excluído.');
        if(state.route==='jobs') renderKanban(); else render();
      }
    });
  }

  document.getElementById('jSave').addEventListener('click', function(){
    var brandNameInput = document.getElementById('jBrand').value.trim();
    if(!brandNameInput){ showToast('Digite o nome da marca.'); document.getElementById('jBrand').focus(); return; }
    var brand = findOrCreateBrandByName(brandNameInput);
    var brandId = brand.id;
    var title = document.getElementById('jTitle').value.trim();
    var videos = document.getElementById('jVideos').value;
    var photos = document.getElementById('jPhotos').value;
    var stories = document.getElementById('jStories').value;

    // Coleta o estado dos checks de vídeos produzidos (se existirem no modal)
    var videosDone = (!isNew && job.videosDone) ? Object.assign({}, job.videosDone) : {};
    document.querySelectorAll('[data-video-check]').forEach(function(cb){
      videosDone[cb.getAttribute('data-video-check')] = cb.checked;
    });

    var isSplit = document.getElementById('jPayTypeSplit').checked;
    var splitMode = isSplit ? currentSplitMode() : null;
    var data = {
      title: title,
      brandId: brandId,
      platformId: document.getElementById('jPlatform').value,
      status: document.getElementById('jStatus').value,
      contentType: document.getElementById('jContentType').value,
      nicho: (function(){
        var n = document.getElementById('jNicho').value.trim();
        if(n && !state.nichos.includes(n)){
          state.nichos.push(n);
          saveNichos();
        }
        return n;
      })(),
      videoCount: videos===''?null:parseInt(videos,10),
      photoCount: photos===''?null:parseInt(photos,10),
      storyCount: stories===''?null:parseInt(stories,10),
      videosDone: videosDone,
      deadline: document.getElementById('jDeadline').value,
      payDate: document.getElementById('jPayDate').value,
      paymentMethod: document.getElementById('jPaymentMethod').value,
      value: document.getElementById('jValue').value.trim(),
      currency: document.getElementById('jCurrency').value,
      paymentType: isSplit ? 'split' : 'single',
      splitMode: splitMode,
      installments: isSplit ? workingInstallments : [],
      notes: document.getElementById('jNotes').value.trim()
    };
    if(!data.title){
      var b = brandById(data.brandId);
      data.title = b ? b.name : 'Trabalho sem título';
    }
    if(isNew){
      data.id = uid();
      data.createdAt = Date.now();
      state.jobs.push(data);
      showToast('Trabalho criado.');
    } else {
      Object.assign(job, data);
      showToast('Alterações salvas.');
    }
    var btn = document.getElementById('jSave');
    btn.disabled = true;
    saveJobs().then(function(){
      close();
      if(state.route==='jobs') renderKanban();
      else render();
    }).catch(function(){
      btn.disabled = false;
    });
  });
}

/* ---------------- render: products ---------------- */
var PRODUCT_STATUS_FLOW = [
  {key:"aguardando", label:"Aguardando envio"},
  {key:"transito", label:"Em trânsito"},
  {key:"recebido", label:"Recebido"}
];
var PRODUCT_STATUS_COLORS = {
  aguardando: {dot:'var(--amber)', bg:'var(--amber-tint)', fg:'var(--amber-deep)'},
  transito:   {dot:'var(--plum)',  bg:'var(--plum-tint)',  fg:'var(--plum)'},
  recebido:   {dot:'var(--sage)',  bg:'var(--sage-tint)',  fg:'var(--sage-deep)'}
};

function renderProducts(){
  var html = '';
  html += '<div class="page-head"><div><h1>Produtos</h1><p class="page-sub">Itens físicos enviados pelas marcas para produção do conteúdo.</p></div>' +
    '<button class="btn btn-primary" id="btnNewProduct"><span>+</span> Novo produto</button></div>';

  if(state.products.length===0){
    html += emptyState("Nenhum produto cadastrado ainda. Registre quando uma marca enviar algo para você produzir.", "btnEmptyNewProduct", "+ Adicionar produto");
    document.getElementById('pageContent').innerHTML = html;
    document.getElementById('btnNewProduct').addEventListener('click', function(){ openProductModal(null); });
    document.getElementById('btnEmptyNewProduct').addEventListener('click', function(){ openProductModal(null); });
    return;
  }

  html += '<div class="kanban" id="productsKanban" style="height:auto; min-height:280px;"></div>';
  document.getElementById('pageContent').innerHTML = html;
  document.getElementById('btnNewProduct').addEventListener('click', function(){ openProductModal(null); });
  renderProductsKanban();
}

function renderProductsKanban(){
  var wrap = document.getElementById('productsKanban');
  var html = '';
  PRODUCT_STATUS_FLOW.forEach(function(s){
    var items = state.products.filter(function(p){ return p.status===s.key; });
    var c = PRODUCT_STATUS_COLORS[s.key];
    html += '<div class="kanban-col">' +
      '<div class="kanban-col-head"><span class="status-badge" style="background:'+c.bg+'; color:'+c.fg+';"><span class="status-dot" style="background:'+c.dot+';"></span>'+escapeHtml(s.label)+'</span><span class="kanban-col-count">('+items.length+')</span></div>' +
      '<div class="kanban-col-body" data-product-col="'+s.key+'">';
    items.forEach(function(p){ html += productCardHtml(p); });
    html += '<button class="kanban-add" data-new-product-status="'+s.key+'">+ Adicionar</button>';
    html += '</div></div>';
  });
  wrap.innerHTML = html;

  wrap.querySelectorAll('.kanban-card').forEach(function(card){
    card.addEventListener('click', function(){
      if(card.classList.contains('dragging')) return;
      openProductModal(card.getAttribute('data-product-id'));
    });
    card.addEventListener('dragstart', function(e){
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.getAttribute('data-product-id'));
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', function(){ card.classList.remove('dragging'); });
  });
  wrap.querySelectorAll('[data-new-product-status]').forEach(function(btn){
    btn.addEventListener('click', function(){ openProductModal(null, btn.getAttribute('data-new-product-status')); });
  });
  wrap.querySelectorAll('[data-product-col]').forEach(function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('drag-over'); });
    col.addEventListener('drop', function(e){
      e.preventDefault();
      col.classList.remove('drag-over');
      var pId = e.dataTransfer.getData('text/plain');
      var newStatus = col.getAttribute('data-product-col');
      var prod = state.products.find(function(x){ return x.id===pId; });
      if(prod && prod.status!==newStatus){
        prod.status = newStatus;
        if(newStatus==='recebido' && !prod.receivedDate) prod.receivedDate = isoDate(new Date());
        saveProducts();
        showToast('Movido para "'+(PRODUCT_STATUS_FLOW.find(function(s){return s.key===newStatus;})||{}).label+'".');
        renderProductsKanban();
      }
    });
  });
}

function productCardHtml(p){
  var brand = brandById(p.brandId);
  var d = p.expectedDate ? daysUntil(p.expectedDate) : null;
  var dateText = null;
  if(p.status==='recebido' && p.receivedDate){
    dateText = 'recebido em ' + fmtDate(p.receivedDate);
  } else if(d!==null){
    dateText = d<0 ? Math.abs(d)+'d de atraso' : d===0 ? 'chega hoje' : d===1 ? 'chega amanhã' : 'chega em '+d+'d';
  }
  return '<div class="kanban-card" draggable="true" data-product-id="'+p.id+'" tabindex="0" role="button" aria-label="Abrir '+escapeHtml(p.name)+'">' +
    '<p class="kanban-card-title">'+escapeHtml(p.name)+'</p>' +
    '<div class="kanban-tags">' +
      (brand ? '<span class="tag" style="background:var(--magenta-tint); color:var(--magenta-deep);">'+escapeHtml(brand.name)+'</span>' : '') +
    '</div>' +
    (dateText ? '<div style="margin-top:8px;"><span class="tag tag-deadline" style="'+(p.status==='recebido'?'background:var(--sage-tint); color:var(--sage-deep);':'')+'">'+escapeHtml(dateText)+'</span></div>' : '') +
  '</div>';
}

function openProductModal(productId, presetStatus){

          '<datalist id="prBrandList">'+brandDatalistOptions+'</datalist></div>' +
        '<div class="field"><label for="prJob">Vincular a um trabalho</label><select id="prJob">'+jobOptions+'</select></div>' +
        '<div class="field-row">' +
          '<div class="field"><label for="prStatus">Status</label><select id="prStatus">'+statusOptions+'</select></div>' +
          '<div class="field"><label for="prExpected">Previsão de chegada</label><input id="prExpected" type="date" value="'+(product&&product.expectedDate?product.expectedDate:'')+'" /></div>' +
        '</div>' +
        '<div class="field"><label for="prNotes">Observações</label>' +
          '<textarea id="prNotes" placeholder="Código de rastreio, estado do produto, observações">'+escapeHtml(product?product.notes:'')+'</textarea></div>' +
        '<div class="modal-actions">' +
          (isNew ? '' : '<button class="btn btn-danger-text" id="prDelete" style="margin-right:auto;">excluir</button>') +
          '<button class="btn btn-ghost" id="prCancel">cancelar</button>' +
          '<button class="btn btn-primary" id="prSave">'+(isNew?'Criar produto':'Salvar alterações')+'</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('modalRoot').innerHTML = modalHtml;
  document.getElementById('prName').focus();

  function close(){ document.getElementById('modalRoot').innerHTML = ''; }
  document.getElementById('prodModalClose').addEventListener('click', close);
  document.getElementById('prCancel').addEventListener('click', close);
  document.getElementById('prodOverlay').addEventListener('click', function(e){ if(e.target.id==='prodOverlay') close(); });

  if(!isNew){
    document.getElementById('prDelete').addEventListener('click', function(){
      if(confirm('Excluir este produto?')){
        state.products = state.products.filter(function(p){return p.id!==product.id;});
        saveProducts();
        close();
        showToast('Produto excluído.');
        render();
      }
    });
  }

  document.getElementById('prSave').addEventListener('click', function(){
    var name = document.getElementById('prName').value.trim();
    var brandNameInput = document.getElementById('prBrand').value.trim();
    if(!name){ showToast('Dê um nome ao produto.'); document.getElementById('prName').focus(); return; }
    if(!brandNameInput){ showToast('Digite o nome da marca.'); document.getElementById('prBrand').focus(); return; }
    var brand = findOrCreateBrandByName(brandNameInput);
    var newStatus = document.getElementById('prStatus').value;
    var data = {
      name: name,
      brandId: brand.id,
      jobId: document.getElementById('prJob').value || null,
      status: newStatus,
      expectedDate: document.getElementById('prExpected').value,
      notes: document.getElementById('prNotes').value.trim()
    };
    if(newStatus==='recebido'){
      data.receivedDate = (product && product.receivedDate) ? product.receivedDate : isoDate(new Date());
    } else {
      data.receivedDate = (product && product.receivedDate) ? product.receivedDate : '';
    }
    if(isNew){
      data.id = uid();
      data.createdAt = Date.now();
      state.products.push(data);
      showToast('Produto criado.');
    } else {
      Object.assign(product, data);
      showToast('Alterações salvas.');
    }
    var btn = document.getElementById('prSave');
    btn.disabled = true;
    saveProducts().then(function(){
      close();
      render();
    }).catch(function(){
      btn.disabled = false;
      showToast('Não foi possível salvar. Tente novamente.');
    });
  });
}

/* ---------------- notifications: smart, derived from existing data ---------------- */
/* Each notification gets a stable id (hash of its semantic content, not a random uid)
   so "mark as read" persists correctly across reloads/devices even though nothing
   is stored permanently — the notification itself is recomputed every time. */
function notifId(parts){ return parts.join('::'); }

function buildNotifications(){
  var list = [];
  var today = new Date(); today.setHours(0,0,0,0);
  var todayIso = isoDate(today);

  // Entregas próximas / atrasadas
  state.jobs.forEach(function(j){
    if(j.status===STATUS_CANCELLED || j.status==='pago' || !j.deadline) return;
    var brand = brandById(j.brandId);
    var d = daysUntil(j.deadline);
    var name = brand ? brand.name : (j.title||'um trabalho');
    if(d!==null && d<0){
      list.push({id:notifId(['deadline-late',j.id]), icon:'⚠', text:'Entrega '+name+' está '+Math.abs(d)+'d atrasada', date:j.deadline, priority:0, jobId:j.id});
    } else if(d===0){
      list.push({id:notifId(['deadline-today',j.id]), icon:'⚠', text:'Entrega '+name+' vence hoje', date:j.deadline, priority:1, jobId:j.id});
    } else if(d!==null && d<=3){
      list.push({id:notifId(['deadline-soon',j.id]), icon:'⚠', text:'Entrega '+name+' vence em '+d+'d', date:j.deadline, priority:2, jobId:j.id});
    }
    if(j.status==='aprovacao'){
      list.push({id:notifId(['awaiting-review',j.id]), icon:'📝', text:'Trabalho '+name+' aguardando revisão', date:j.deadline||todayIso, priority:3, jobId:j.id});
    }
  });

  // Pagamentos
  getReceivableItems().forEach(function(it){
    if(it.paid || !it.date) return;
    var d = daysUntil(it.date);
    if(d===0){
      list.push({id:notifId(['pay-today',it.jobId,it.instId||'']), icon:'💰', text:'Hoje você recebe '+fmtCurrency(it.value, it.currency)+' — '+it.label, date:it.date, priority:1, jobId:it.jobId});
    } else if(d!==null && d<0){
      list.push({id:notifId(['pay-late',it.jobId,it.instId||'']), icon:'💰', text:'Pagamento atrasado: '+fmtCurrency(it.value, it.currency)+' — '+it.label, date:it.date, priority:0, jobId:it.jobId});
    }
  });

  // Produtos
  state.products.forEach(function(p){
    var brand = brandById(p.brandId);
    var name = brand ? brand.name : p.name;
    if(p.status==='recebido' && p.receivedDate===todayIso){
      list.push({id:notifId(['product-received',p.id]), icon:'📦', text:'Produto '+name+' chegou hoje', date:p.receivedDate, priority:3, productId:p.id});
    } else if(p.status!=='recebido' && p.expectedDate===todayIso){
      list.push({id:notifId(['product-today',p.id]), icon:'📦', text:'Produto '+name+' chega hoje', date:p.expectedDate, priority:2, productId:p.id});
    }
  });

  // Follow-ups pendentes (sem contato há 5+ dias em status de follow-up)
  state.prospects.forEach(function(p){
    if(p.status!=='followup1' && p.status!=='followup2' && p.status!=='enviado') return;
    var refDate = p.updatedAt || p.createdAt;
    if(!refDate) return;
    var diffDays = Math.floor((Date.now()-refDate)/86400000);
    if(diffDays>=5){
      list.push({id:notifId(['followup',p.id, String(Math.floor(diffDays/5))]), icon:'📧', text:'Faz '+diffDays+' dias desde o último contato com '+p.brandName, date:todayIso, priority:2, prospectId:p.id});
    }
  });

  // Gravações hoje
  var recordingsToday = state.jobs.filter(function(j){ return j.status==='gravacao' && j.deadline; });
  var gravToday = recordingsToday.filter(function(j){ return daysUntil(j.deadline)===0; });
  if(gravToday.length>0){
    list.push({id:notifId(['recordings-today',todayIso]), icon:'🎬', text:'Hoje você tem '+gravToday.length+(gravToday.length===1?' gravação':' gravações')+' prevista'+(gravToday.length===1?'':'s'), date:todayIso, priority:1});
  }

  // Checklist atrasado (tarefas de trabalho não feitas com data passada)
  var lateChecks = state.checklist.filter(function(c){ return !c.done && c.date && c.date<todayIso && c.category==='trabalho'; });
  if(lateChecks.length>0){
    list.push({id:notifId(['checklist-late',todayIso,String(lateChecks.length)]), icon:'✓', text:lateChecks.length===1?'1 tarefa do checklist está atrasada':lateChecks.length+' tarefas do checklist estão atrasadas', date:todayIso, priority:2});
  }

  list.sort(function(a,b){ return a.priority-b.priority || (a.date||'').localeCompare(b.date||''); });
  return list;
}

function unreadNotifications(){
  return buildNotifications().filter(function(n){ return !state.notificationsRead[n.id]; });
}

function renderNotifBell(){
  var unread = unreadNotifications();
  var count = unread.length;
  var html = '<button class="notif-bell-btn" id="notifBellBtn" aria-label="Notificações">🔔' +
    (count>0 ? '<span class="notif-badge">'+(count>9?'9+':count)+'</span>' : '') +
  '</button>';
  ['notifBellWrapDesktop','notifBellWrapMobile'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.innerHTML = html;
  });
  document.querySelectorAll('#notifBellBtn').forEach(function(btn){
    btn.addEventListener('click', function(e){ e.stopPropagation(); toggleNotifPanel(btn); });
  });

function toggleNotifPanel(anchorBtn){
  var root = document.getElementById('notifPanelRoot');
  if(state.notifPanelOpen){ closeNotifPanel(); return; }
  state.notifPanelOpen = true;
  var notifs = buildNotifications();
  var rect = anchorBtn.getBoundingClientRect();
  var panelTop = rect.bottom + 8;
  var panelRight = Math.max(12, window.innerWidth - rect.right);

  var html = '<div class="notif-overlay" id="notifOverlay"></div>' +
    '<div class="notif-panel" id="notifPanel" style="top:'+panelTop+'px; right:'+panelRight+'px;">' +
      '<div class="notif-panel-head"><h3>Notificações</h3>' +
        (notifs.length>0 ? '<button class="notif-mark-all" id="notifMarkAll">marcar tudo como lida</button>' : '') +
      '</div>' +
      '<div class="notif-list">' +
        (notifs.length===0 ? '<div class="notif-empty">Tudo em dia por aqui. 🌿</div>' :
          notifs.map(function(n){
            var unread = !state.notificationsRead[n.id];
            return '<div class="notif-item '+(unread?'unread':'')+'" data-notif-id="'+n.id+'" data-job-id="'+(n.jobId||'')+'" data-product-id="'+(n.productId||'')+'" data-prospect-id="'+(n.prospectId||'')+'">' +
              '<span class="notif-ico">'+n.icon+'</span>' +
              '<span class="notif-text">'+escapeHtml(n.text)+'</span>' +
              (unread ? '<span class="notif-dot-new"></span>' : '') +
            '</div>';
          }).join('')
        ) +
      '</div>' +
    '</div>';
  root.innerHTML = html;

  document.getElementById('notifOverlay').addEventListener('click', closeNotifPanel);
  var markAllBtn = document.getElementById('notifMarkAll');
  if(markAllBtn) markAllBtn.addEventListener('click', function(){
    notifs.forEach(function(n){ state.notificationsRead[n.id] = true; });
    saveNotificationsRead();
    closeNotifPanel();
    renderNotifBell();
  });
  document.querySelectorAll('.notif-item').forEach(function(item){
    item.addEventListener('click', function(){
      var id = item.getAttribute('data-notif-id');
      state.notificationsRead[id] = true;
      saveNotificationsRead();
      renderNotifBell();
      var jobId = item.getAttribute('data-job-id');
      var productId = item.getAttribute('data-product-id');
      var prospectId = item.getAttribute('data-prospect-id');
      closeNotifPanel();
      if(jobId) openJobModal(jobId);
      else if(productId) openProductModal(productId);
      else if(prospectId) openProspectModal(prospectId);
    });
  });
}

function closeNotifPanel(){
  state.notifPanelOpen = false;
  document.getElementById('notifPanelRoot').innerHTML = '';
}

/* ---------------- scroll preservation: keeps the user's position after any re-render ---------------- */
var _savedScrollY = 0;
var _savedKanbanScrolls = {};
var _savedMainY = 0;
var _savedColScrolls = {};
var _lastRenderedRoute = null;
var _sameRoute = false;

function saveScrollY(){
  _sameRoute = (_lastRenderedRoute === state.route);
  _lastRenderedRoute = state.route;
  _savedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  var mainEl = document.getElementById('main');
  _savedMainY = mainEl ? mainEl.scrollTop : 0;
  _savedKanbanScrolls = {};
  ['kanbanWrap','prospectKanban','weekKanban'].forEach(function(id){
    var el = document.getElementById(id);
    if(el && el.scrollLeft > 0) _savedKanbanScrolls[id] = el.scrollLeft;
  });
  // rolagem vertical de cada coluna dos kanbans
  _savedColScrolls = {};
  document.querySelectorAll('[data-prospect-col],[data-status-col]').forEach(function(col){
    var key = col.hasAttribute('data-prospect-col') ? 'p:' + col.getAttribute('data-prospect-col') : 's:' + col.getAttribute('data-status-col');
    if(col.scrollTop > 0) _savedColScrolls[key] = col.scrollTop;
  });
}

function restoreScrollY(){
  if(!_sameRoute){
    // mudou de aba: começa do topo
    var m = document.getElementById('main');
    if(m) m.scrollTop = 0;
    return;
  }
  var winY = _savedScrollY, mainY = _savedMainY, kan = _savedKanbanScrolls, cols = _savedColScrolls;
  function apply(){
    if(winY > 0) window.scrollTo(0, winY);
    var mainEl = document.getElementById('main');
    if(mainEl && mainY > 0) mainEl.scrollTop = mainY;
    Object.keys(kan).forEach(function(id){
      var el = document.getElementById(id);
      if(el) setScrollLeftInstant(el, kan[id]);
    });
    Object.keys(cols).forEach(function(key){
      var attr = key.charAt(0) === 'p' ? 'data-prospect-col' : 'data-status-col';
      var col = document.querySelector('['+attr+'="'+key.slice(2)+'"]');
      if(col) col.scrollTop = cols[key];
    });
  }
  apply();                       // na hora (evita "piscar" no início)
  requestAnimationFrame(apply);  // e de novo após o layout final
}

/* ---------------- main render dispatcher ---------------- */
function render(){
  if(!state.loaded){
    document.getElementById('pageContent').innerHTML = '<p style="color:var(--ink-faint);">Carregando seus dados...</p>';
    return;
  }
  saveScrollY();
  renderNotifBell();
  if(state.route==='dashboard') renderDashboard();
  else if(state.route==='prospects') renderProspects();
  else if(state.route==='jobs') renderJobs();
  else if(state.route==='products') renderProducts();
  else if(state.route==='agenda') renderAgenda();
  else if(state.route==='checklist') renderChecklist();
  else if(state.route==='brands') renderBrands();
  else if(state.route==='platforms') renderPlatforms();
  else if(state.route==='payments') renderPayments();
  else if(state.route==='metrics') renderMetrics();
  else if(state.route==='contracts') renderContracts();
  else if(state.route==='scripts') renderScripts();
  else if(state.route==='finance') renderFinance();
  else if(state.route==='assistant') renderAssistant();
  else if(state.route==='theme') renderTheme();
  restoreScrollY();
}

    reader.onload = async function(e){
      var tpl = { name: file.name, type: file.type, data: e.target.result };
      // confere quais campos o modelo tem
      var found = [];
      try{ found = await listDocxTemplateFields(dataUrlToArrayBuffer(tpl.data)); }

      state.customContractTemplate = tpl;

    };
    reader.readAsDataURL(file);
    templateInput.value = '';
  });

  });

  if(btnDownload) btnDownload.addEventListener('click', function(){

    var a = document.createElement('a');
    a.href = state.customContractTemplate.data;
    a.download = state.customContractTemplate.name;
    a.click();
  });
}

// tira um CEP digitado dentro do endereço (o contrato já tem campo próprio de CEP)
function addressSemCep(addr){
  return String(addr||'')
    .replace(/[,;\-–\s]*\bcep\b[^0-9a-z]{0,4}[\d][\d.\s\-]{6,10}\d/ig, '')   // "cep 18110650", "CEP: 18.110-650"
    .replace(/[,;\-–\s]*\b\d{2}\.?\d{3}-\d{3}\b/g, '')                       // "18110-650" solto
    .replace(/[,;\-–\s]*\b\d{8}\b/g, '')                                     // "18110650" solto
    .replace(/\s{2,}/g, ' ').replace(/[,;\-–\s]+$/,'').replace(/[,;\-–\s]+\./g,'.').trim();
}

function dataUrlToArrayBuffer(dataUrl){
  var b64 = String(dataUrl).split(',')[1] || '';
  var bin = atob(b64), buf = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
// salva o modelo num documento separado (o documento principal tem limite de tamanho)
function saveContractTemplateToCloud(tpl){

/* Troca os campos {assim} no XML do Word — funciona mesmo quando o Word
   quebra um campo em vários pedaços com formatações diferentes. */
function fillDocxXml(xmlStr, values){
  var W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  var xml = new DOMParser().parseFromString(xmlStr, 'application/xml');
  var paras = xml.getElementsByTagNameNS(W, 'p');
  var found = {};
  for(var pi = 0; pi < paras.length; pi++){
    var tNodes = paras[pi].getElementsByTagNameNS(W, 't');
    if(!tNodes.length) continue;
    var nodes = [], full = '';
    for(var i = 0; i < tNodes.length; i++){
      var txt = tNodes[i].textContent || '';
      nodes.push({el:tNodes[i], start:full.length, text:txt});
      full += txt;
    }
    if(full.indexOf('{') === -1) continue;
    var re = /\{\s*([a-zA-Z_0-9]+)\s*\}/g, m, matches = [];
    while((m = re.exec(full))){
      var key = m[1].toLowerCase();
      found[key] = true;
      if(values && Object.prototype.hasOwnProperty.call(values, key)) matches.push({s:m.index, e:m.index + m[0].length, v:String(values[key])});
    }
    for(var k = matches.length - 1; k >= 0; k--){
      var mt = matches[k], first = true;
      nodes.forEach(function(n){
        var ns = n.start, ne = n.start + n.text.length;
        if(ne <= mt.s || ns >= mt.e) return;
        var a = Math.max(mt.s, ns) - ns, b = Math.min(mt.e, ne) - ns;
        n.text = n.text.slice(0, a) + (first ? mt.v : '') + n.text.slice(b);
        first = false;
      });
      var pos = 0; nodes.forEach(function(n){ n.start = pos; pos += n.text.length; });
    }
    nodes.forEach(function(n){
      if(n.el.textContent !== n.text){
        n.el.textContent = n.text;
        n.el.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
      }
    });
  }
  return {xml: new XMLSerializer().serializeToString(xml), found: Object.keys(found)};
}
function docxXmlFiles(zip){
  return Object.keys(zip.files).filter(function(n){ return /^word\/(document|header\d*|footer\d*)\.xml$/.test(n); });
}
async function listDocxTemplateFields(arrayBuffer){
  var zip = await JSZip.loadAsync(arrayBuffer);
  var files = docxXmlFiles(zip), found = {};
  if(!files.length) throw new Error('não é docx');
  for(var i = 0; i < files.length; i++){
    fillDocxXml(await zip.file(files[i]).async('string'), null).found.forEach(function(f){ found[f] = true; });
  }
  return Object.keys(found);
}
async function fillDocxTemplate(arrayBuffer, values){
  var zip = await JSZip.loadAsync(arrayBuffer);
  var files = docxXmlFiles(zip);
  for(var i = 0; i < files.length; i++){
    zip.file(files[i], fillDocxXml(await zip.file(files[i]).async('string'), values).xml);
  }
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* Número por extenso (pt-BR) — usado no contrato */
function numeroPorExtenso(n){
  n = Math.floor(Math.abs(Number(n)||0));
  if(n === 0) return 'zero';
  var U = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  var D = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  var C = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  function ate999(x){
    if(x === 100) return 'cem';
    var c = Math.floor(x/100), r = x%100, p = [];
    if(c) p.push(C[c]);
    if(r){ if(r<20) p.push(U[r]); else { p.push(D[Math.floor(r/10)] + (r%10 ? ' e ' + U[r%10] : '')); } }
    return p.join(' e ');
  }
  var grupos = [], i = 0;
  while(n > 0){ grupos.push(n % 1000); n = Math.floor(n/1000); }
  var nomes = [['',''],['mil','mil'],['milhão','milhões'],['bilhão','bilhões']];
  var partes = [];
  for(i = grupos.length-1; i >= 0; i--){
    var g = grupos[i]; if(!g) continue;
    var txt = (i === 1 && g === 1) ? 'mil' : ate999(g) + (i ? ' ' + nomes[i][g>1?1:0] : '');
    partes.push({txt:txt, g:g, i:i});
  }
  return partes.map(function(p, k){
    if(k === 0) return p.txt;
    var sep = (p.g < 100 || p.g % 100 === 0) ? ' e ' : ' ';
    return sep + p.txt;
  }).join('');
}
function valorPorExtenso(v){
  var reais = Math.floor(v), cent = Math.round((v - reais) * 100);
  if(cent === 100){ reais += 1; cent = 0; }
  var t = '';
  if(reais) t = numeroPorExtenso(reais) + (reais === 1 ? ' real' : ((reais % 1000000 === 0) ? ' de reais' : ' reais'));
  if(cent) t += (t ? ' e ' : '') + numeroPorExtenso(cent) + (cent === 1 ? ' centavo' : ' centavos');
  return t || 'zero reais';
}
function fmtValorContrato(v){
  return v.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}

function hexToHsl(hex){
  hex = String(hex||'').replace('#','');
  var r = parseInt(hex.substr(0,2),16)/255, g = parseInt(hex.substr(2,2),16)/255, b = parseInt(hex.substr(4,2),16)/255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b), h = 0, s = 0, l = (max+min)/2;
  if(max !== min){
    var d = max-min;
    s = l > .5 ? d/(2-max-min) : d/(max+min);
    if(max === r) h = (g-b)/d + (g<b?6:0); else if(max === g) h = (b-r)/d + 2; else h = (r-g)/d + 4;
    h /= 6;
  }
  return [h*360, s*100, l*100];
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  var k = function(n){ return (n + h/30) % 12; };
  var a = s * Math.min(l, 1-l);
  var f = function(n){ return l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1))); };
  return [f(0),f(8),f(4)].map(function(x){ return ('0'+Math.round(x*255).toString(16)).slice(-2); }).join('').toUpperCase();
}
// monta uma paleta completa a partir de uma única cor escolhida
function paletteFromColor(hex){
  var hsl = hexToHsl(hex), h = hsl[0], s = Math.max(hsl[1], 8);
  var sat = Math.min(s, 60);
  return {key:'custom', name:'Minha cor',
    dark: hslToHex(h, sat, 16), mid: hslToHex(h, sat, 30),
    accent: hslToHex(h, Math.min(s, 45), 61), tint: hslToHex(h, Math.min(s, 50), 96.5)};
}

/* ---------- leitura do roteiro colado ---------- */
function cleanSpeech(t){
  return t
    .replace(/^(\s*[^:“”"\[(]{1,25}:\s*)?[“"]\s*/, '$1')   // aspas de abertura (com ou sem "Fulana:")
    .replace(/\s*[”"](\s*(\([^)]*\))?\s*)$/, '$1')          // aspas de fechamento (antes de uma (rubrica) final)
    .trim();
}
function sceneKind(label){
  var l = (label||'').toLowerCase().replace(/^\s*(cena|scene|parte|bloco)\s*\d+\s*[–—\-:.]?\s*/,'');
  if(/^\s*(gancho|hook)/.test(l)) return 'hook';
  if(/^\s*(cta|chamada|call to action)/.test(l)) return 'cta';
  return 'scene';
}
var SCENE_WORDS = 'gancho|hook|cta|chamada|identifica\\w*|demonstra\\w*|resultado|virada|benef\\w*|problema|solu\\w*|abertura|introdu\\w*|desenvolvimento|encerramento|final|fechamento|apresenta\\w*|prova\\s+social|depoimento|unboxing|contexto|transi\\w*';
var RE_SCENE_WORD = new RegExp('^(' + SCENE_WORDS + ')(\\b[^:]{0,40})?\\s*[:\\-–—]\\s*(.*)$', 'i');
var RE_TAKE_PREFIX = /^(takes?|imagem|imagens|visual|v[íi]deo|b-?roll|plano|enquadramento|mostrar|mostra|grava[çc][ãa]o)\s*[:\-–—]\s*/i;
var RE_SPEECH_PREFIX = /^(falas?|[áa]udio|narra[çc][ãa]o|texto|locu[çc][ãa]o|voz|off|script)\s*[:\-–—]\s*/i;

// identifica se a linha abre uma cena; devolve {label, rest} ou null
function detectSceneHeader(t){
  var m;
  if((m = t.match(/^\[([^\]]+)\]$/))) return {label:m[1].trim(), rest:''};
  if((m = t.match(/^#{1,4}\s+(.+)$/))) return {label:m[1].replace(/\*+/g,'').trim(), rest:''};
  if((m = t.match(/^\*\*([^*]+)\*\*:?$/))) return {label:m[1].trim(), rest:''};
  if((m = t.match(/^(cena|scene|parte|bloco)\s*(\d+)\s*[:\-–—.]?\s*(.*)$/i))){
    var tail = m[3].trim();
    if(!tail || (tail.length <= 45 && !/["“”]/.test(tail))) return {label:(m[1]+' '+m[2]+(tail?' – '+tail:'')).trim(), rest:''};
    return {label:m[1]+' '+m[2], rest:tail};
  }
  if((m = t.match(RE_SCENE_WORD))) return {label:(m[1]+(m[2]||'')).trim(), rest:m[3].trim()};
  if((m = t.match(new RegExp('^(' + SCENE_WORDS + ')(\\s.{0,40})?$', 'i'))) && t.length <= 50 && !/["“”?!.]$/.test(t)) return {label:t, rest:''};
  if((m = t.match(/^(\d{1,2})[.)]\s+(.+)$/))){
    var r = m[2].trim();
    if(r.length <= 45 && !/["“”]/.test(r)) return {label:r, rest:''};
    return {label:'', rest:r};
  }
  // linha toda em MAIÚSCULAS (curta) = nome de cena
  var letters = t.replace(/[^A-Za-zÀ-ú]/g,'');
  if(letters.length >= 4 && t.length <= 60 && letters === letters.toUpperCase() && !/["“”!?]/.test(t)) return {label:t.replace(/:$/,''), rest:''};
  return null;
}
function parseScript(raw){
  var lines = String(raw||'').replace(/\r/g,'').split('\n');
  var scenes = [], cur = null;
  function newScene(label){ cur = {label: label || '', speech: [], takes: []}; scenes.push(cur); }
  function addLine(t){
    var p;
    if(!cur) newScene('');
    if(RE_TAKE_PREFIX.test(t)){ var tk = t.replace(RE_TAKE_PREFIX,'').trim(); if(tk) cur.takes.push(tk.replace(/^\((.*)\)$/,'$1')); return; }
    if(RE_SPEECH_PREFIX.test(t)){ var sp = t.replace(RE_SPEECH_PREFIX,'').trim(); if(sp) cur.speech.push(cleanSpeech(sp)); return; }
    if((p = t.match(/^\((.*)\)$/)) && p[1].indexOf(')') === -1){ cur.takes.push(p[1].trim()); return; }
    cur.speech.push(cleanSpeech(t.replace(/^[-•*]\s+/,'')));
  }
  var hasHeaders = lines.some(function(l){ var t = l.trim(); return t && detectSceneHeader(t); });
  lines.forEach(function(line){
    var t = line.trim();
    if(!t){ if(!hasHeaders && cur && (cur.speech.length || cur.takes.length)) cur = null; return; }
    // tabela colada do Word/Docs (colunas separadas por tab)
    if(t.indexOf('\t') !== -1){
      var cols = t.split('\t').map(function(x){ return x.trim(); }).filter(Boolean);
      if(cols.length >= 2){
        if(/^(#|n[ºo°]?|fala|[áa]udio|takes?|imagem|refer)/i.test(cols[0]) && /^(fala|[áa]udio|takes?|imagem|cena)/i.test(cols[1]||'')) return; // cabeçalho
        var lbl = /^(g|cta|\d{1,2})$/i.test(cols[0]) ? cols.shift() : '';
        newScene(lbl.toUpperCase() === 'G' ? 'Gancho' : (lbl.toUpperCase() === 'CTA' ? 'CTA' : ''));
        if(cols[0]) cur.speech.push(cleanSpeech(cols[0]));
        if(cols[1]) cur.takes.push(cols[1].replace(/^\((.*)\)$/,'$1'));
        return;
      }
    }
    var h = detectSceneHeader(t);
    if(h){ newScene(h.label); if(h.rest) addLine(h.rest); return; }
    addLine(t);
  });
  return numberScenes(scenes);
}
function numberScenes(scenes){
  scenes = scenes.filter(function(s){ return s.label || s.speech.length || s.takes.length; });
  var n = 0;
  scenes.forEach(function(s){
    s.kind = sceneKind(s.label);
    s.num = s.kind === 'hook' ? 'G' : (s.kind === 'cta' ? 'CTA' : String(++n));
  });
  return scenes;
}

function xEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function wRun(text, o){
  o = o || {};
  var pr = '<w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>' + (o.b?'<w:b/>':'') + (o.i?'<w:i/>':'') +
    (o.color?'<w:color w:val="'+o.color+'"/>':'') + '<w:sz w:val="'+(o.sz||20)+'"/><w:szCs w:val="'+(o.sz||20)+'"/>';
  return '<w:r><w:rPr>'+pr+'</w:rPr><w:t xml:space="preserve">'+xEsc(text)+'</w:t></w:r>';
}
function wPara(runs, o){
  o = o || {};
  var pr = '<w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after!=null?o.after:80)+'" w:line="276" w:lineRule="auto"/>' +
    (o.ind ? '<w:ind w:left="'+o.ind+'" w:hanging="'+(o.hang||0)+'"/>' : '') +
    (o.align ? '<w:jc w:val="'+o.align+'"/>' : '');
  return '<w:p><w:pPr>'+pr+'</w:pPr>'+runs+'</w:p>';
}
// fala: (rubricas) e [notas] em itálico; "Narrador:" em negrito
function speechRuns(text, pal){
  var out = '', m = text.match(/^([A-Za-zÀ-ú][^:()\[\]]{0,24}):\s+(.*)$/);
  if(m){ out += wRun(m[1] + ': ', {b:true, color:pal.mid}); text = m[2]; }
  text.split(/(\([^)]*\)|\[[^\]]*\])/).forEach(function(part){
    if(!part) return;
    if(/^[(\[]/.test(part)) out += wRun(part, {i:true, color:'7A6A60'});
    else out += wRun(part);
  });
  return out;
}
function wCell(width, content, o){
  o = o || {};
  var b = '<w:tcBorders>' + ['top','left','bottom','right'].map(function(s){
    return '<w:'+s+' w:val="single" w:sz="6" w:space="0" w:color="'+(o.border||'C49A6C')+'"/>'; }).join('') + '</w:tcBorders>';
  return '<w:tc><w:tcPr><w:tcW w:w="'+width+'" w:type="dxa"/>'+b+
    (o.fill?'<w:shd w:val="clear" w:color="auto" w:fill="'+o.fill+'"/>':'')+
    (o.span?'<w:gridSpan w:val="'+o.span+'"/>':'')+
    '<w:tcMar><w:top w:w="100" w:type="dxa"/><w:left w:w="140" w:type="dxa"/><w:bottom w:w="100" w:type="dxa"/><w:right w:w="140" w:type="dxa"/></w:tcMar>'+
    (o.vAlign?'<w:vAlign w:val="'+o.vAlign+'"/>':'')+

function wTable(widths, rowsXml){

function buildScriptDocxXml(opts){

  var IMG = !!opts.withImages;
  var W = IMG ? [700, 3550, 3050, 2600] : [800, 4700, 4400], TOT = 9900;
  var body = '';
  // cabeçalho
  var meta = wRun('NOME DA CREATOR: ', {b:true, color:'FFFFFF', sz:18}) + wRun(opts.creator || '—', {color:'FFFFFF', sz:18}) +
    wRun('     ·     PRODUTO: ', {b:true, color:'FFFFFF', sz:18}) + wRun(opts.product || '—', {color:'FFFFFF', sz:18}) +
    wRun('     ·     FORMATO: ', {b:true, color:'FFFFFF', sz:18}) + wRun(opts.format || '—', {color:'FFFFFF', sz:18});
  body += wTable([TOT],
    wRow(wCell(TOT, wPara(wRun(('ROTEIRO │ ' + (opts.title || 'SEM TÍTULO')).toUpperCase(), {b:true, color:'FFFFFF', sz:26}), {after:0}), {fill:pal.dark, border:pal.dark})) +
    wRow(wCell(TOT, wPara(meta, {after:0}), {fill:pal.mid, border:pal.mid})));
  body += wPara('', {after:120});
  // tabela de cenas
  var head = wRow(

    wCell(W[1], wPara(wRun('FALA / ÁUDIO', {b:true, color:'FFFFFF'}), {after:0}), {fill:pal.accent, border:pal.accent}) +
    wCell(W[2], wPara(wRun(IMG ? 'TAKES' : 'TAKES / IMAGEM', {b:true, color:'FFFFFF'}), {after:0}), {fill:pal.accent, border:pal.accent}) +
    (IMG ? wCell(W[3], wPara(wRun('REFERÊNCIA VISUAL', {b:true, color:'FFFFFF'}), {after:0}), {fill:pal.accent, border:pal.accent}) : ''), {header:true});
  var rows = '';

    s.speech.forEach(function(l){ speech += wPara(speechRuns(l, pal)); });
    if(!s.speech.length) speech += wPara(wRun('(sem fala — cena só de imagem)', {i:true, color:'9A8A80'}));
    var takes = '', list = s.takes, suggested = false;
    if(!list.length){ list = suggestTakes(s.label); suggested = true; }
    list.forEach(function(t){
      takes += wPara(wRun('•  ', {b:true, color:pal.accent}) + (suggested ? wRun(t, {i:true}) : speechRuns(t, pal)), {ind:240, hang:240, after:60});
    });
    if(suggested) takes += wPara(wRun('sugestão de take', {i:true, sz:15, color:'9A8A80'}), {ind:240, after:40});

      wCell(W[1], speech, {fill:fill, border:pal.accent}) +

  });

    body += wPara('', {after:120});

    '</w:body></w:document>';
}

    if(!part) return;
    out += /^[(\[]/.test(part) ? '<em style="color:#7A6A60">'+escapeHtml(part)+'</em>' : escapeHtml(part);
  });
  return out;
}

async function generateScriptDocx(){
  var f = readScriptForm(), scenes = getFormScenes(f);
  if(!scenes.length){ showToast(f.mode === 'cards' ? 'Preencha pelo menos uma cena. 🎬' : 'Cole o roteiro primeiro. 🎬'); return; }
  if(typeof JSZip === 'undefined'){ showToast('Não foi possível carregar o gerador de Word.'); return; }
  var st = getScriptStyle();
  if(f.creator && f.creator !== st.creatorName){ st.creatorName = f.creator; saveScriptStyle(); }
  try{
    var blob = await buildScriptDocx({palette: currentScriptPalette(), scenes: scenes, withImages: f.withImages,
      title: f.title, creator: f.creator, product: f.product, format: f.format,
      duration: f.duration, size: f.size, productsMap: f.productsMap, notes: f.notes});
    var name = 'roteiro-' + ((f.title || f.product || 'ugc').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,50) || 'ugc') + '.docx';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    showToast('Roteiro gerado! 🎬');
  }catch(e){
    console.error(e); showToast('Não consegui gerar o roteiro. Tente de novo.');
  }
}

function finRate(code){ code = code || 'BRL'; return (state.exchangeRates && state.exchangeRates[code]) || 1; }
function ymOf(dateIso){ return dateIso ? String(dateIso).slice(0,7) : ''; }
function ymAdd(ym, n){
  var y = +ym.slice(0,4), m = +ym.slice(5,7) - 1 + n;
  y += Math.floor(m/12); m = ((m%12)+12)%12;
  return y + '-' + ('0'+(m+1)).slice(-2);
}
function ymLabel(ym, opts){
  var d = new Date(ym + '-01T00:00:00');
  return d.toLocaleDateString('pt-BR', opts || {month:'long', year:'numeric'});
}
function getFinanceGoals(){
  if(!state.financeGoals || typeof state.financeGoals !== 'object') state.financeGoals = {monthly:0, perMonth:{}};
  if(!state.financeGoals.perMonth) state.financeGoals.perMonth = {};
  return state.financeGoals;
}
function goalForMonth(ym){
  var g = getFinanceGoals();
  return (g.perMonth[ym] != null) ? g.perMonth[ym] : (g.monthly || 0);
}

/* junta tudo por mês (valores em reais) */
function financeByMonth(){
  var curYm = ymOf(isoDate(new Date()));
  var months = {}, noDate = {receber:0, recebido:0};
  function M(ym){
    if(!months[ym]) months[ym] = {recebido:0, aReceber:0, reembolsos:0, reembolsosPendentes:0, despesasPagas:0, despesasAPagar:0, porCategoria:{}};
    return months[ym];
  }
  getReceivableItems().forEach(function(it){
    var v = (Number(it.value)||0) * finRate(it.currency);
    if(!v) return;
    var ym = ymOf(it.date);
    if(!ym){ if(it.paid) noDate.recebido += v; else noDate.receber += v; return; }
    if(it.paid) M(ym).recebido += v; else M(ym).aReceber += v;
  });
  (state.expenses||[]).forEach(function(e){
    var v = parseMoneyGuess(e.value) * finRate(e.currency);
    if(!v) return;
    var ym = ymOf(e.date) || (e.createdAt ? ymOf(isoDate(new Date(e.createdAt))) : curYm);
    if(!e.paid && ym < curYm) ym = curYm; // pendência atrasada aparece no mês atual
    var m = M(ym);
    if(e.type === 'reembolso'){ if(e.paid) m.reembolsos += v; else m.reembolsosPendentes += v; return; }
    if(e.paid) m.despesasPagas += v; else m.despesasAPagar += v;
    var cat = expenseCategory(e.category).key;
    m.porCategoria[cat] = (m.porCategoria[cat]||0) + v;
  });
  return {months: months, noDate: noDate, get: M};
}

  html += metricCard('Despesas pagas', fmtBRL(m.despesasPagas), 'coral', m.despesasAPagar ? fmtBRL(m.despesasAPagar)+' ainda a pagar' : 'gastos com a criação');
  html += metricCard('Lucro do mês', fmtBRL(lucro), lucro>=0?'sage':'coral', 'recebido − despesas pagas');
  html += metricCard('A receber', fmtBRL(m.aReceber + m.reembolsosPendentes), 'amber', ym===curYm ? 'inclui pagamentos atrasados' : 'previsto pra esse mês');
  html += '</div>';

  // meta
  html += '<div class="section"><div class="section-head"><h2>🎯 Meta do mês</h2><button class="btn btn-sm btn-ghost" id="finEditGoal">'+(goal?'editar meta':'definir meta')+'</button></div><div class="table-wrap fin-box">';
  if(!goal){
    html += '<p class="fin-muted">Defina quanto você quer faturar por mês e acompanhe aqui o quanto falta. 🌸</p>';
  } else {
    var got = m.recebido, withPending = m.recebido + m.aReceber;
    var pct = Math.min(100, Math.round(got/goal*100)), pct2 = Math.min(100, Math.round(withPending/goal*100));
    html += '<div class="fin-goal-top"><strong>'+fmtBRL(got)+'</strong><span>de '+fmtBRL(goal)+'</span></div>' +
      '<div class="fin-bar"><div class="fin-bar-pend" style="width:'+pct2+'%"></div><div class="fin-bar-fill" style="width:'+pct+'%"></div></div>' +
      '<p class="fin-goal-msg">' + (got >= goal ? '🎉 Meta batida! Você passou '+fmtBRL(got-goal)+' do objetivo.'
        : 'Faltam <strong>'+fmtBRL(goal-got)+'</strong> pra bater a meta' + (m.aReceber ? '. Contando o que ainda vai entrar, você chega a <strong>'+pct2+'%</strong>.' : '.')) + '</p>';
  }
  html += '</div></div>';

  // despesas por categoria
  var cats = Object.keys(m.porCategoria).map(function(k){ return {cat:expenseCategory(k), v:m.porCategoria[k]}; }).sort(function(a,b){ return b.v-a.v; });
  html += '<div class="section"><div class="section-head"><h2>🧾 Para onde foi o dinheiro</h2></div><div class="table-wrap fin-box">';
  if(!cats.length){

        '<div class="fin-bar fin-bar-thin"><div class="fin-bar-fill fin-coral" style="width:'+Math.max(3, c.v/maxV*100)+'%"></div></div></div>';
    }).join('');

  for(var i = 0; i < 6; i++){

  }

  if(fb.noDate.receber) html += '<p class="fin-muted" style="padding:0 16px 14px;">⚠️ '+fmtBRL(fb.noDate.receber)+' a receber estão sem data de pagamento e não entram na conta. Coloque a data nos trabalhos pra previsão ficar certinha.</p>';

  }
  var maxH = Math.max.apply(null, hist.map(function(h){ return Math.max(h.ent, h.sai); }).concat([1]));
  html += '<div class="section"><div class="section-head"><h2>📊 Últimos 6 meses</h2><span class="fin-legend"><i class="lg-in"></i>recebido <i class="lg-out"></i>despesas</span></div><div class="table-wrap fin-box"><div class="fin-chart">' +

        '<div class="fin-col-bars"><div class="fin-b-in" style="height:'+(h.ent/maxH*100)+'%"></div><div class="fin-b-out" style="height:'+(h.sai/maxH*100)+'%"></div></div>' +
        '<div class="fin-col-lucro '+(l>=0?'pos':'neg')+'">'+fmtBRLShort(l)+'</div>' +

    }).join('') +
  '</div></div></div>';

  document.getElementById('pageContent').innerHTML = html;

  function go(n){ state.financeMonth = ymAdd(state.financeMonth, n); renderFinance(); }
  document.getElementById('finPrev').addEventListener('click', function(){ go(-1); });
  document.getElementById('finNext').addEventListener('click', function(){ go(1); });

  document.getElementById('finEditGoal').addEventListener('click', function(){ openGoalModal(ym); });
  bindFinanceViewSwitch();
  document.getElementById('finNewExpense').addEventListener('click', function(){ openRecordModal(); });
  document.querySelectorAll('[data-fin-month]').forEach(function(el){
    el.addEventListener('click', function(){ state.financeMonth = el.getAttribute('data-fin-month'); renderFinance(); document.getElementById('main').scrollTop = 0; });
  });

function fmtBRLShort(v){
  var a = Math.abs(v), s = v < 0 ? '−' : '';
  if(a >= 1000) return s + 'R$ ' + (a/1000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'k';

/* ---------------- API Key management ---------------- */
/* ── Secure Backend Proxy ─────────────────────────────────
   A chave Anthropic NUNCA é exposta no frontend.
   Todas as chamadas em produção passam pelo backend seguro.
   Configure STUDIO_BACKEND_URL no seu HTML ou abaixo.
   ───────────────────────────────────────────────────────── */
var BACKEND_URL = (function(){
  if(window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'){
    return 'http://localhost:3000';
  }
  return window.STUDIO_BACKEND_URL || 'https://creator-desk-api.ugcjamileatique.workers.dev';
})();

function isRunningInClaudeAi(){
  try{
    return window.location.hostname.includes('claude.ai') ||
           window.location.hostname.includes('anthropic') ||
           window.parent !== window;
  }catch(e){ return true; }
}

// API Key de cada usuária — salva no Firebase vinculada ao uid dela
function getApiKey(){
  // tenta pegar do state (carregado do Firebase)
  if(state.userApiKey) return state.userApiKey;
  // fallback para localStorage (só na mesma máquina)
  try{ return localStorage.getItem('studio_user_api_key_'+(cloudUser?cloudUser.uid:'')) || ''; }catch(e){ return ''; }
}
function saveApiKey(key){
  state.userApiKey = key.trim();
  // salva no localStorage como cache local
  try{ localStorage.setItem('studio_user_api_key_'+(cloudUser?cloudUser.uid:''), key.trim()); }catch(e){}
  // salva no Firebase vinculado ao uid da usuária
  if(cloudUser && cloudDb){
    cloudDb.collection('users').doc(cloudUser.uid).collection('settings').doc('apikey')
      .set({ key: key.trim(), updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .catch(function(e){ console.error('Erro ao salvar API Key:', e); });
  }
}
function hasApiKey(){ return !!getApiKey() || isRunningInClaudeAi(); }

function apiFetch(body){
  // Dentro do Claude.ai (dev): chama Anthropic diretamente
  if(isRunningInClaudeAi()){
    return fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify(body)
    });
  }
  // Produção (GitHub Pages): chama o backend seguro
  var hasImage = body.messages && body.messages.some(function(m){
    return Array.isArray(m.content) && m.content.some(function(c){ return c.type === 'image'; });
  });
  var endpoint = hasImage
    ? BACKEND_URL + '/api/extract-instagram'
    : BACKEND_URL + '/api/assistant';

  // A chave NÃO vai junto: o app manda só o login (token do Firebase)
  // e o Worker busca a chave da própria creator no Firestore.
  var tokenPromise = (cloudUser && typeof cloudUser.getIdToken === 'function')
    ? cloudUser.getIdToken().catch(function(){ return ''; })
    : Promise.resolve('');
  return tokenPromise.then(function(token){
    var headers = { 'Content-Type':'application/json' };
    if(token) headers['Authorization'] = 'Bearer ' + token;
    return fetch(endpoint, { method:'POST', headers:headers, body:JSON.stringify(body) });
  });
}

function appendChatMessage(role, content, save){
  var wrap = document.getElementById('chatMessages');
  if(!wrap) return;

  var div = document.createElement('div');
  div.className = 'chat-msg ' + role;

  var avatar = role==='user' ? '👤' : '🌸';
  var bubble = document.createElement('div');
  bubble.className = 'chat-bubble';

  // detecta blocos de mensagem prontos (delimitados por ---)
  var parts = content.split('---MSG---');
  if(parts.length > 1){
    var mainText = document.createElement('div');
    mainText.style.marginBottom = '12px';
    mainText.textContent = parts[0];
    bubble.appendChild(mainText);

    parts.slice(1).forEach(function(msgBlock, idx){
      var labels = ['💌 Abordagem fria','🔔 Follow-up 1','⏰ Follow-up 2'];
      var statusMap = ['enviado','followup1','followup2'];
      var label = labels[idx] || ('Mensagem '+(idx+1));
      var nextStatus = statusMap[idx] || null;
      var msgWrap = document.createElement('div');
      msgWrap.style.cssText = 'background:var(--lilac); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px;';
      var lbl = document.createElement('div');
      lbl.style.cssText = 'font-size:11px; font-weight:700; color:var(--magenta-deep); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;';
      lbl.textContent = label;
      var txt = document.createElement('pre');
      txt.style.cssText = 'margin:0; font-family:Inter,sans-serif; font-size:13.5px; white-space:pre-wrap; color:var(--ink); line-height:1.6;';
      txt.textContent = msgBlock.trim();

      // botões
      var btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;';

      var copyBtn = document.createElement('button');
      copyBtn.className = 'chat-copy-btn';
      copyBtn.innerHTML = '📋 Copiar mensagem';
      copyBtn.addEventListener('click', function(){
        navigator.clipboard.writeText(msgBlock.trim()).then(function(){
          copyBtn.innerHTML = '✓ Copiado!';
          copyBtn.style.color = 'var(--sage-deep)';
          setTimeout(function(){ copyBtn.innerHTML = '📋 Copiar mensagem'; copyBtn.style.color=''; }, 2000);
        });
      });
      btnRow.appendChild(copyBtn);

      // seletor de status + botão de atualizar
      if(lastProspectId){
        (function(pid, defaultStatus){
          // seletor de para qual status mover
          var statusSelect = document.createElement('select');
          statusSelect.style.cssText = 'padding:5px 8px; border-radius:var(--radius-s); border:1px solid var(--sage); background:var(--sage-tint); font-size:12px; color:var(--sage-deep); outline:none; cursor:pointer;';
          PROSPECT_STATUS_FLOW.forEach(function(s){
            var opt = document.createElement('option');
            opt.value = s.key;
            opt.textContent = s.label;
            if(s.key === defaultStatus) opt.selected = true;
            statusSelect.appendChild(opt);
          });
          // opção cancelado
          var optCanc = document.createElement('option');
          optCanc.value = 'recusou'; optCanc.textContent = 'Recusou';
          statusSelect.appendChild(optCanc);

          var statusBtn = document.createElement('button');
          statusBtn.className = 'chat-copy-btn';
          statusBtn.innerHTML = '✓ Mover prospecção';
          statusBtn.style.borderColor = 'var(--sage)';
          statusBtn.style.color = 'var(--sage-deep)';

          statusBtn.addEventListener('click', function(){
            var p = state.prospects.find(function(x){ return x.id===pid; });
            if(p){
              var chosenStatus = statusSelect.value;
              var chosenLabel = (PROSPECT_STATUS_FLOW.find(function(s){return s.key===chosenStatus;})||{}).label || chosenStatus;
              p.status = chosenStatus;
              saveProspects();
              statusBtn.innerHTML = '✓ Movida para "'+chosenLabel+'"!';
              statusBtn.disabled = true;
              statusBtn.style.opacity = '0.6';
              statusSelect.disabled = true;
              showToast('Prospecção movida para "'+chosenLabel+'".');
              // atualiza o kanban de prospecção se estiver aberto
              if(state.route === 'prospects'){
                renderProspectKanban();
              }
            }
          });

          btnRow.appendChild(statusSelect);
          btnRow.appendChild(statusBtn);
        })(lastProspectId, nextStatus || 'enviado');
      }

      msgWrap.appendChild(lbl);
      msgWrap.appendChild(txt);
      msgWrap.appendChild(btnRow);
      bubble.appendChild(msgWrap);
    });
  } else {
    bubble.textContent = content;
  }

  div.innerHTML = '<div class="chat-avatar">'+avatar+'</div>';
  div.appendChild(bubble);
  wrap.appendChild(div);
  scrollChatToBottom();

  if(save !== false){
    state.assistantMessages.push({role:role, content:content});
    // limita histórico a 40 mensagens em memória
    if(state.assistantMessages.length > 40) state.assistantMessages = state.assistantMessages.slice(-40);
  }
}

function showTyping(){
  var wrap = document.getElementById('chatMessages');
  if(!wrap) return;
  var div = document.createElement('div');
  div.className = 'chat-msg assistant';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="chat-avatar">🌸</div><div class="chat-typing"><span></span><span></span><span></span></div>';
  wrap.appendChild(div);
  scrollChatToBottom();
}

function hideTyping(){
  var el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

function scrollChatToBottom(){
  var wrap = document.getElementById('chatMessages');
  if(wrap) wrap.scrollTop = wrap.scrollHeight;
}

function sendChatMessage(){
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if(!text) return;
  input.value = '';
  input.style.height = 'auto';
  appendChatMessage('user', text);
  callAssistantAPI(text);
}

function handleListarProspeccoes(){
  var abertas = state.prospects.filter(function(p){ return p.status!=='fechou' && p.status!=='recusou'; });
  if(abertas.length===0){
    appendChatMessage('assistant', 'Você não tem prospecções abertas no momento. Quer começar uma nova abordagem? Me passa o nome e @ da marca! 🌸');
    return;
  }
  var grupos = {};
  abertas.forEach(function(p){
    grupos[p.status] = grupos[p.status] || [];
    grupos[p.status].push(p);
  });
  var msg = 'Suas prospecções abertas ('+abertas.length+' no total):\n\n';
  Object.keys(grupos).forEach(function(status){
    var label = (PROSPECT_STATUS_FLOW.find(function(s){return s.key===status;})||{}).label || status;
    msg += '📌 '+label+' ('+grupos[status].length+'):\n';
    grupos[status].forEach(function(p){
      msg += '  • '+p.brandName+(p.contact?' ('+p.contact+')':'')+'\n';
    });
    msg += '\n';
  });
  msg += 'Quer que eu crie uma mensagem para alguma delas?';
  appendChatMessage('assistant', msg);
}

function buildSystemPrompt(){

  var prospectsContext = abertas.length > 0
    ? '\n\nPROSPECÇÕES ABERTAS NO APP:\n'+abertas.map(function(p){
        return '- '+p.brandName+(p.contact?' ('+p.contact+')':'')+(p.status?' ['+p.status+']':'')+(p.nicho?' nicho:'+p.nicho:'')+(p.notes?' bio:'+p.notes:'');

  var prompt = 'ASSISTENTE DE ABORDAGENS UGC\n\n' +

    'Quando a criadora pedir uma abordagem (Instagram ou Seu Influencer), NUNCA escreva direto.\n' +
    'Primeiro pergunte: Qual é a sua ideia para essa marca? Me conta o conceito, o produto, o que você quer mostrar.\n' +
    'Só escreva depois que ela responder. Se já trouxer a ideia, pode escrever direto.\n\n' +
    '1. FUNÇÃO DO ASSISTENTE\n' +
    'Você é o assistente estratégico de prospecção UGC de ' + userFullName + '.\n' +
    'Sua função é transformar informações de uma marca em uma abordagem comercial de UGC que pareça escrita pela própria criadora.\n' +
    'Seu trabalho: entender o produto; identificar o principal desejo, dor ou objeção; criar uma ideia de conteúdo visualmente forte; fazer a marca imaginar o vídeo pronto; conectar à experiência real da criadora; vender a solução criativa, não pedir uma oportunidade; adaptar ao canal.\n\n' +
    '2. QUEM É A CRIADORA\n' +
    'Nome: ' + userFullName + '. Criadora de conteúdo UGC.\n' +
    'O perfil completo está no campo PERFIL DA CRIADORA abaixo — use essas informações para personalizar todas as abordagens no estilo dela.\n\n' +
    '3. TOM DE VOZ\n' +
    'Humano, seguro, natural. NUNCA texto de agência, mensagem automática, genérico ou bajulação.\n' +
    'A criadora fala como parceira criativa apresentando uma solução, não como alguém pedindo uma chance.\n' +
    'NUNCA use: conteúdo autêntico e inovador, conteúdo incrível, conteúdo que conecta.\n' +
    'SEMPRE substitua adjetivos por imagens concretas do que será visto no vídeo.\n\n' +
    '4. REGRA DE OURO\n' +
    'A marca precisa conseguir visualizar o vídeo após ler a abordagem. Descreva: primeira cena, gancho, transformação, detalhes, resultado.\n\n' +
    '5. MÉTODO A.C.R.\n' +
    'A — ATENÇÃO: Comece pela dor, desejo, objeção ou situação cotidiana. Nunca comece falando de si.\n' +
    'C — CONEXÃO: Por que a criadora é a pessoa certa para contar essa história.\n' +
    'R — RESULTADO: Faça a marca visualizar o resultado: detalhes, objeção respondida, desejo despertado.\n\n' +

function callAssistantAPI(userMessage){

  showTyping();

  // monta histórico para contexto (últimas 10 trocas)
  var recentHistory = state.assistantMessages.slice(-20).map(function(m){
    return {role: m.role, content: m.content};
  });
  // remove a última msg do user pois vamos passar abaixo
  if(recentHistory.length > 0 && recentHistory[recentHistory.length-1].role==='user'){
    recentHistory.pop();
  }

  var messages = recentHistory.concat([{role:'user', content: userMessage}]);

  apiFetch({
    model: 'claude-sonnet-4-6',
    max_tokens: 1200,
    system: buildSystemPrompt(),
    messages: messages
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    hideTyping();
    var reply = data.content && data.content[0] ? data.content[0].text : '';
    if(!reply){
      reply = 'Erro da API: ' + JSON.stringify(data).slice(0, 200);
    }

    // detecta comando de cadastrar prospecção
    var cadastroMatch = reply.match(/CADASTRAR_PROSPECCAO:(\{[\s\S]*?\})/);
    if(cadastroMatch){
      try{
        var pData = JSON.parse(cadastroMatch[1]);
        var igPlat = state.platforms.find(function(p){ return p.name.toLowerCase()==='instagram'; });
        var jaExiste = state.prospects.find(function(p){
          return p.brandName.toLowerCase()===(pData.brandName||'').toLowerCase();
        });
        if(!jaExiste){
          state.prospects.push({
            id: uid(),
            brandName: pData.brandName||'',
            contact: pData.contact||'',
            instagramUrl: pData.instagramUrl||'',
            platformId: igPlat ? igPlat.id : '',
            nicho: pData.nicho||'',
            notes: '',
            status: pData.status||'pendente',
            createdAt: Date.now()
          });
          saveProspects();
        }
        // remove o JSON da resposta antes de exibir
        reply = reply.replace(/CADASTRAR_PROSPECCAO:\{[\s\S]*?\}/, '').trim();
      }catch(e){}
    }

    appendChatMessage('assistant', reply);
  })
  .catch(function(err){
    hideTyping();
    appendChatMessage('assistant', 'Erro: '+( err && err.message ? err.message : JSON.stringify(err)) + '\n\nVerifique se a API Key está salva corretamente no painel esquerdo.');
  });
}

function loadTheme(){
  try{
    var saved = localStorage.getItem(THEME_STORE_KEY);
    if(saved) return JSON.parse(saved);
  }catch(e){}
  return {bg:'#FAF4ED', accent:'#8E3B52', text:'#2B1A1E'};
}
function saveTheme(theme){
  try{ localStorage.setItem(THEME_STORE_KEY, JSON.stringify(theme)); }catch(e){}
}
function luminance(hex){
  var c = hexToRgb(hex);
  var r = c.r/255, g = c.g/255, b = c.b/255;
  r = r<=0.03928?r/12.92:Math.pow((r+0.055)/1.055,2.4);
  g = g<=0.03928?g/12.92:Math.pow((g+0.055)/1.055,2.4);
  b = b<=0.03928?b/12.92:Math.pow((b+0.055)/1.055,2.4);
  return 0.2126*r+0.7152*g+0.0722*b;
}
function isDark(hex){ return luminance(hex)<0.35; }

function applyTheme(theme){
  var root = document.documentElement;
  var bgLum = luminance(theme.bg);
  var bgDark = bgLum < 0.35;

  // fundo e variações
  root.style.setProperty('--lilac', theme.bg);
  root.style.setProperty('--blush', adjustColor(theme.bg, bgDark ? 12 : -6));
  root.style.setProperty('--line', adjustColor(theme.bg, bgDark ? 25 : -18));

  // paper (cards, modais, sidebar) — sempre mais claro que o fundo
  var paperColor = bgDark ? adjustColor(theme.bg, 22) : lightenToWhite(theme.bg, 0.6);
  root.style.setProperty('--paper', paperColor);

  // acento
  root.style.setProperty('--magenta', theme.accent);
  root.style.setProperty('--magenta-deep', adjustColor(theme.accent, -18));
  root.style.setProperty('--magenta-tint', hexToTint(theme.accent, 0.14));

  // texto — garante contraste mínimo com o paper
  var textColor = theme.text;
  // se fundo escuro e texto também escuro, usa texto claro
  if(bgDark && luminance(textColor) < 0.2){
    textColor = '#F0EAE4';
  }
  // se fundo claro mas texto muito claro, escurece
  if(!bgDark && luminance(textColor) > 0.5){
    textColor = '#2A2018';
  }
  root.style.setProperty('--ink', textColor);
  root.style.setProperty('--ink-soft', hexToTint(textColor, bgDark ? 0.55 : 0.42));
  root.style.setProperty('--ink-faint', hexToTint(textColor, bgDark ? 0.35 : 0.25));
}

function lightenToWhite(hex, factor){
  var c = hexToRgb(hex);
  var r = Math.round(c.r + (255-c.r)*factor);
  var g = Math.round(c.g + (255-c.g)*factor);
  var b = Math.round(c.b + (255-c.b)*factor);
  return rgbToHex(r,g,b);
}
function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(function(c){return c+c;}).join('');
  var n = parseInt(hex,16);
  return {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
}
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(function(v){ return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0'); }).join('').toUpperCase();
}
function adjustColor(hex, amount){
  var c = hexToRgb(hex);
  return rgbToHex(c.r+amount, c.g+amount, c.b+amount);
}
function hexToTint(hex, alpha){
  var c = hexToRgb(hex);
  var r = Math.round(c.r + (255-c.r)*(1-alpha));
  var g = Math.round(c.g + (255-c.g)*(1-alpha));
  var b = Math.round(c.b + (255-c.b)*(1-alpha));
  return rgbToHex(r,g,b);
}
function hsvToRgb(h,s,v){
  var r,g,b,i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  switch(i%6){case 0:r=v,g=t,b=p;break;case 1:r=q,g=v,b=p;break;case 2:r=p,g=v,b=t;break;case 3:r=p,g=q,b=v;break;case 4:r=t,g=p,b=v;break;case 5:r=v,g=p,b=q;break;}
  return {r:Math.round(r*255),g:Math.round(g*255),b:Math.round(b*255)};
}
function rgbToHsv(r,g,b){
  r/=255;g/=255;b/=255;
  var max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,h,s=max===0?0:d/max,v=max;
  if(max===min){h=0;}
  else{switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}
  return {h,s,v};
}

function initColorPicker(key, pickerState, onUpdate){
  var canvas = document.getElementById('canvas-'+key);
  var cursor = document.getElementById('cursor-'+key);
  var hueSlider = document.getElementById('hue-'+key);
  var hexInput = document.getElementById('hex-'+key);
  var swatch = document.getElementById('swatch-'+key);
  var rgbR = document.getElementById('rgb-r-'+key);
  var rgbG = document.getElementById('rgb-g-'+key);
  var rgbB = document.getElementById('rgb-b-'+key);
  var hexWrap = document.getElementById('hex-wrap-'+key);
  var rgbWrap = document.getElementById('rgb-wrap-'+key);

  // set hue slider
  hueSlider.value = Math.round(pickerState[key].h * 360);
  drawCanvas(key, pickerState[key].h);
  updatePickerUI(key, pickerState[key]);

  // toggle HEX / RGB
  document.querySelectorAll('[data-mode][data-target="'+key+'"]').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('[data-mode][data-target="'+key+'"]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      var mode = btn.getAttribute('data-mode');
      hexWrap.style.display = mode==='hex' ? '' : 'none';
      rgbWrap.style.display = mode==='rgb' ? '' : 'none';
      if(mode==='rgb'){
        var rgb = hexToRgb('#'+pickerState[key].hex);
        rgbR.value = rgb.r; rgbG.value = rgb.g; rgbB.value = rgb.b;
      }
    });
  });

  // drag no canvas
  var dragging = false;
  function pickFromCanvas(e){
    var rect = canvas.getBoundingClientRect();
    var x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    var y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
    pickerState[key].s = x;
    pickerState[key].v = 1 - y;
    var rgb = hsvToRgb(pickerState[key].h, pickerState[key].s, pickerState[key].v);
    pickerState[key].hex = rgbToHex(rgb.r, rgb.g, rgb.b).replace('#','').toUpperCase();
    updatePickerUI(key, pickerState[key]);
    if(rgbR) syncRgbInputs(key, pickerState[key]);
    if(onUpdate) onUpdate();
  }
  canvas.addEventListener('mousedown', function(e){ dragging=true; pickFromCanvas(e); });
  canvas.addEventListener('touchstart', function(e){ dragging=true; pickFromCanvas(e.touches[0]); e.preventDefault(); }, {passive:false});
  window.addEventListener('mousemove', function(e){ if(dragging) pickFromCanvas(e); });
  window.addEventListener('touchmove', function(e){ if(dragging) pickFromCanvas(e.touches[0]); }, {passive:false});
  window.addEventListener('mouseup', function(){ dragging=false; });
  window.addEventListener('touchend', function(){ dragging=false; });

  // hue slider
  hueSlider.addEventListener('input', function(){
    pickerState[key].h = parseInt(hueSlider.value) / 360;
    drawCanvas(key, pickerState[key].h);
    var rgb = hsvToRgb(pickerState[key].h, pickerState[key].s, pickerState[key].v);
    pickerState[key].hex = rgbToHex(rgb.r, rgb.g, rgb.b).replace('#','').toUpperCase();
    updatePickerUI(key, pickerState[key]);
    syncRgbInputs(key, pickerState[key]);
    if(onUpdate) onUpdate();
  });

  hexInput.addEventListener('input', function(){
    var val = hexInput.value.replace(/[^0-9a-fA-F]/g,'');
    hexInput.value = val;
    if(val.length===6){
      var rgb = hexToRgb('#'+val);
      var hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
      pickerState[key].h = hsv.h; pickerState[key].s = hsv.s; pickerState[key].v = hsv.v;
      pickerState[key].hex = val.toUpperCase();
      hueSlider.value = Math.round(hsv.h*360);
      drawCanvas(key, hsv.h);
      updatePickerUI(key, pickerState[key]);
      syncRgbInputs(key, pickerState[key]);
      if(onUpdate) onUpdate();
    }
  });

  function applyRgbInput(){
    var r = Math.max(0,Math.min(255,parseInt(rgbR.value)||0));
    var g = Math.max(0,Math.min(255,parseInt(rgbG.value)||0));
    var b = Math.max(0,Math.min(255,parseInt(rgbB.value)||0));
    var hex = rgbToHex(r,g,b);
    var hsv = rgbToHsv(r,g,b);
    pickerState[key].h = hsv.h; pickerState[key].s = hsv.s; pickerState[key].v = hsv.v;
    pickerState[key].hex = hex.replace('#','').toUpperCase();
    hueSlider.value = Math.round(hsv.h*360);
    drawCanvas(key, hsv.h);
    updatePickerUI(key, pickerState[key]);
    if(onUpdate) onUpdate();
  }
  [rgbR, rgbG, rgbB].forEach(function(inp){ if(inp) inp.addEventListener('input', applyRgbInput); });
}

function syncRgbInputs(key, ps){
  var rgb = hexToRgb('#'+ps.hex);
  var r = document.getElementById('rgb-r-'+key);
  var g = document.getElementById('rgb-g-'+key);
  var b = document.getElementById('rgb-b-'+key);
  if(r && document.activeElement!==r) r.value = rgb.r;
  if(g && document.activeElement!==g) g.value = rgb.g;
  if(b && document.activeElement!==b) b.value = rgb.b;
}

function drawCanvas(key, hue){
  var canvas = document.getElementById('canvas-'+key);
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  var rgb = hsvToRgb(hue, 1, 1);
  var hueColor = 'rgb('+rgb.r+','+rgb.g+','+rgb.b+')';
  // gradiente horizontal: branco → hue
  var gradH = ctx.createLinearGradient(0,0,w,0);
  gradH.addColorStop(0,'#fff');
  gradH.addColorStop(1, hueColor);
  ctx.fillStyle = gradH;
  ctx.fillRect(0,0,w,h);
  // gradiente vertical: transparente → preto
  var gradV = ctx.createLinearGradient(0,0,0,h);
  gradV.addColorStop(0,'rgba(0,0,0,0)');
  gradV.addColorStop(1,'rgba(0,0,0,1)');
  ctx.fillStyle = gradV;
  ctx.fillRect(0,0,w,h);
}

function updatePickerUI(key, ps){
  var cursor = document.getElementById('cursor-'+key);
  var hexInput = document.getElementById('hex-'+key);
  var swatch = document.getElementById('swatch-'+key);
  var canvas = document.getElementById('canvas-'+key);
  if(!canvas) return;
  var rect = canvas.getBoundingClientRect();
  var x = ps.s * 100;
  var y = (1-ps.v) * 100;
  if(cursor){ cursor.style.left=x+'%'; cursor.style.top=y+'%'; }
  if(hexInput && document.activeElement !== hexInput) hexInput.value = ps.hex;
  var fullHex = '#'+ps.hex;
  if(swatch) swatch.style.background = fullHex;
}

/* ---------------- init ---------------- */
window.addEventListener('scroll', function(){ if(state.notifPanelOpen) closeNotifPanel(); }, true);
window.addEventListener('resize', function(){ if(state.notifPanelOpen) closeNotifPanel(); });

(async function init(){
  applyBrandLogo();
  applyTheme(loadTheme());

  var loginScreen = document.getElementById('loginScreen');
  var appDiv      = document.getElementById('app');

  function showApp(){
    loginScreen.style.display = 'none';
    appDiv.style.display = 'flex';
    setupCloudAuthUI();
    navigate('dashboard');
    loadAll().then(function(){
      initCloudSync().then(function(){
        updateSyncUI();
        render();
      });
    });
  }

  // em dev (Claude.ai) entra direto
  if(isRunningInClaudeAi()){
    showApp(); return;
  }

  // garante que o Firebase está inicializado antes de usar o auth
  if(typeof firebase !== 'undefined' && isCloudConfigured()){
    if(!firebase.apps.length){
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    firebase.auth().onAuthStateChanged(function(user){
      if(user){
        showApp();
      } else {
        showLoginScreen();
      }
    });
  } else {
    // Firebase não disponível — mostra login de qualquer forma
    showLoginScreen();
  }

  function showLoginScreen(){
    loginScreen.style.display = 'flex';
    appDiv.style.display = 'none';

    var emailInput   = document.getElementById('loginEmail');
    var pwdInput     = document.getElementById('loginPassword');
    var loginBtn     = document.getElementById('loginBtn');
    var googleBtn    = document.getElementById('loginGoogleBtn');
    var errDiv       = document.getElementById('loginError');
    var togglePwd    = document.getElementById('togglePwd');
    var showSignup   = document.getElementById('showSignupBtn');
    var signupSec    = document.getElementById('signupSection');
    var signupBtn    = document.getElementById('signupBtn');
    var signupErr    = document.getElementById('signupError');

    // mostrar/ocultar senha
    togglePwd.addEventListener('click', function(){
      pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
      togglePwd.textContent = pwdInput.type === 'password' ? '👁' : '🙈';
    });

    // alternar cadastro
    showSignup.addEventListener('click', function(){
      var open = signupSec.style.display === 'block';
      signupSec.style.display = open ? 'none' : 'block';
      showSignup.textContent = open ? 'Criar conta' : 'Já tenho conta';
    });

    // login com Google
    googleBtn.addEventListener('click', function(){
      if(typeof firebase === 'undefined') return showToastLogin('Firebase não disponível.');
      var provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider)
        .then(function(){ showApp(); })
        .catch(function(e){ showErrLogin(errDiv, e.message); });
    });

    // login com email/senha
    loginBtn.addEventListener('click', function(){ tryEmailLogin(); });
    pwdInput.addEventListener('keydown', function(e){ if(e.key==='Enter') tryEmailLogin(); });
    emailInput.focus();

    function tryEmailLogin(){
      var email = emailInput.value.trim();
      var pwd   = pwdInput.value;
      if(!email || !pwd){ showErrLogin(errDiv, 'Preencha email e senha.'); return; }
      loginBtn.disabled = true; loginBtn.textContent = 'Entrando...';
      errDiv.style.display = 'none';
      if(typeof firebase === 'undefined'){ showErrLogin(errDiv, 'Firebase não disponível.'); loginBtn.disabled=false; loginBtn.textContent='Entrar no Creator Desk'; return; }
      firebase.auth().signInWithEmailAndPassword(email, pwd)
        .then(function(){ showApp(); })
        .catch(function(e){
          showErrLogin(errDiv, e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'
            ? 'Email ou senha incorretos.' : e.message);
          loginBtn.disabled = false; loginBtn.textContent = 'Entrar no Creator Desk';
        });
    }

    // cadastro
    signupBtn.addEventListener('click', function(){
      var name  = document.getElementById('signupName').value.trim();
      var email = document.getElementById('signupEmail').value.trim();
      var pwd   = document.getElementById('signupPassword').value;
      if(!name || !email || !pwd){ showErrLogin(signupErr, 'Preencha todos os campos.'); return; }
      if(pwd.length < 6){ showErrLogin(signupErr, 'Senha mínima de 6 caracteres.'); return; }
      signupBtn.disabled = true; signupBtn.textContent = 'Criando conta...';
      signupErr.style.display = 'none';
      firebase.auth().createUserWithEmailAndPassword(email, pwd)
        .then(function(cred){
          return cred.user.updateProfile({displayName: name});
        })
        .then(function(){ showApp(); })
        .catch(function(e){
          showErrLogin(signupErr, e.message);
          signupBtn.disabled = false; signupBtn.textContent = 'Criar conta';
        });
    });
  }

  function showErrLogin(el, msg){ el.textContent = msg; el.style.display = 'block'; }
  function showToastLogin(msg){ alert(msg); }
})();

})();
</script>
