
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Desk — controle seus jobs UGC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#F3E7DD;
    --lilac:#FAF4ED;
    --magenta:#8E3B52;
    --magenta-deep:#6B2A3D;
    --magenta-tint:#F1E0E3;
    --rose:#C98FA0;
    --paper:#FFFFFF;
    --ink:#3A2B2A;
    --ink-soft:#8A746E;
    --ink-faint:#BBA89F;
    --line:#EBDFD3;
    --sage:#7DA88B;
    --sage-deep:#4E7A5C;
    --sage-tint:#E3EFE6;
    --amber:#C99A3E;
    --amber-deep:#9C7724;
    --amber-tint:#F6EDD8;
    --slate:#8C8AA8;
    --slate-tint:#EBEAF4;
    --danger:#A8434C;
    --danger-tint:#F2DCDD;
    --plum:#6F5A8C;
    --plum-tint:#EAE5F1;
    --clay:#B5673B;
    --clay-tint:#F4E4D8;
    --teal:#3E8E8A;
    --teal-tint:#DEEEED;
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:20px;
    --shadow-soft:0 1px 2px rgba(58,43,42,0.04), 0 8px 24px -12px rgba(58,43,42,0.12);
  }
  html, body{height:100%;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--lilac);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  ::selection{background:var(--magenta-tint); color:var(--magenta-deep);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}

  /* ---- layout shell ---- */
  #app{display:flex; height:100vh; overflow:hidden;}

  .sidebar{
    width:248px;
    flex-shrink:0;
    background:var(--paper);
    border-right:1px solid var(--line);
    padding:28px 20px;
    display:flex;
    flex-direction:column;
    gap:28px;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:36px;height:36px;border-radius:10px;
    background:var(--magenta);
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-family:'Fraunces',serif; font-weight:700; font-size:17px;
    flex-shrink:0;
    overflow:hidden;
    background-size:cover;
    background-position:center;
  }
  .brand-name{font-size:17px; font-weight:600;}
  .brand-sub{font-size:11px; color:var(--ink-faint); margin-top:1px;}

  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px;
    border-radius:var(--radius-s);
    font-size:14px; font-weight:500;
    color:var(--ink-soft);
    border:none; background:transparent;
    text-align:left; width:100%;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item:hover{background:var(--lilac); color:var(--ink);}
  .nav-item.active{background:var(--magenta-tint); color:var(--magenta-deep);}
  .nav-item .ico{width:16px; text-align:center; font-size:14px;}

  .sidebar-foot{
    margin-top:auto;
    font-size:11.5px;
    color:var(--ink-faint);
    line-height:1.6;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .sync-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    margin-right:5px; vertical-align:middle; position:relative; top:-1px;
  }
  .sync-dot.ok{background:var(--sage);}
  .sync-dot.pending{background:var(--amber);}
  .sync-dot.off{background:var(--ink-faint);}
  #syncUserEmail{font-size:11px; color:var(--ink-soft); margin-top:4px; word-break:break-all;}
  #btnCloudAuth{width:100%; justify-content:center; margin-top:10px; font-size:12.5px;}

  .main{flex:1; min-width:0; padding:36px 44px 60px; height:100vh; overflow-y:auto;}
  .page-head{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:24px; gap:16px; flex-wrap:wrap;
  }
  .page-head h1{font-size:26px; margin:0 0 4px;}
  .page-sub{color:var(--ink-soft); font-size:14px; margin:0;}

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:10px 16px;
    border-radius:var(--radius-s);
    border:1px solid var(--line);
    background:var(--paper);
    font-size:13.5px; font-weight:600;
    color:var(--ink);
    transition:transform .08s ease, background .12s ease, border-color .12s ease;
    white-space:nowrap;
  }
  .btn:hover{background:var(--lilac);}
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:var(--magenta); border-color:var(--magenta); color:#fff;
  }
  .btn-primary:hover{background:var(--magenta-deep); border-color:var(--magenta-deep);}
  .btn-ghost{border-color:transparent; background:transparent;}
  .btn-ghost:hover{background:var(--lilac);}
  .btn-sm{padding:6px 11px; font-size:12.5px; border-radius:7px;}
  .btn-danger-text{color:var(--danger); border-color:var(--danger-tint); background:var(--danger-tint);}
  .btn-danger-text:hover{background:#ecc4cb;}

  /* ---- metric cards ---- */
  .metrics{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
    gap:14px; margin-bottom:32px;
  }
  .metric-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-l);
    padding:18px 20px; box-shadow:var(--shadow-soft);
  }
  .metric-label{font-size:12px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin:0 0 8px;}
  .metric-value{font-family:'Fraunces',serif; font-size:26px; font-weight:600; margin:0; color:var(--ink);}
  .metric-value.coral{color:var(--magenta-deep);}
  .metric-value.sage{color:var(--sage-deep);}
  .metric-value.amber{color:var(--amber-deep);}
  .metric-foot{font-size:12px; color:var(--ink-faint); margin-top:6px;}

  /* ---- section ---- */
  .section{margin-bottom:36px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .section-head h2{font-size:18px; margin:0;}

  /* ---- pill filters (platform tabs) ---- */
  .pill-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
  .pill-tab{
    padding:8px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper); font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  .pill-tab:hover{background:var(--lilac);}
  .pill-tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* ---- kanban ---- */
  .kanban{display:flex; gap:16px; overflow-x:auto; padding-bottom:8px; align-items:stretch; height:calc(100vh - 270px); min-height:340px;}
  .kanban-col{
    flex:0 0 270px; width:270px;
    display:flex; flex-direction:column; height:100%;
  }
  .kanban-col-head{display:flex; align-items:baseline; gap:6px; margin-bottom:12px; padding:0 2px; flex-shrink:0;}
  .kanban-col-title{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);}
  .kanban-col-count{font-size:11.5px; color:var(--ink-faint);}
  .kanban-col-body{
    display:flex; flex-direction:column; gap:10px;
    background:rgba(255,255,255,0.5);
    border:1.5px dashed var(--line); border-radius:var(--radius-m);
    padding:10px; min-height:90px;
    flex:1; overflow-y:auto;
    transition:background .12s ease, border-color .12s ease;
  }
  .kanban-col-body.drag-over{background:var(--magenta-tint); border-color:var(--magenta);}
  .kanban-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:14px 14px; box-shadow:var(--shadow-soft);
    cursor:grab; transition:border-color .12s ease, opacity .12s ease, transform .12s ease;
  }
  .kanban-card:hover{border-color:var(--magenta);}
  .kanban-card.dragging{opacity:0.4; transform:scale(0.97);}
  .kanban-card-title{font-size:15px; font-weight:600; margin:0 0 8px; font-family:'Fraunces',serif;}
  .kanban-tags{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .tag{
    display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px;
    font-size:11px; font-weight:600; white-space:nowrap;
  }
  .tag-platform{background:var(--slate-tint); color:#54527a; display:inline-flex; align-items:center; gap:5px;}
  .tag-value{font-size:12.5px; font-weight:700; color:var(--ink);}
  .tag-deadline{background:var(--danger-tint); color:var(--danger);}
  .status-dot{display:inline-block; width:6px; height:6px; border-radius:50%; flex-shrink:0;}
  .status-badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:3px 9px; border-radius:999px;
    font-size:11px; font-weight:600; white-space:nowrap;
  }
  .kanban-col-head .status-badge{padding:2px 8px;}
  .kanban-add{
    border:none; background:transparent; color:var(--ink-faint); font-size:13px;
    text-align:left; padding:6px 4px; font-weight:500; flex-shrink:0;
  }
  .kanban-add:hover{color:var(--magenta-deep);}

  .empty{
    text-align:center; padding:50px 20px;
    color:var(--ink-faint); font-size:14px;
    border:1.5px dashed var(--line); border-radius:var(--radius-l);
    background:var(--paper);
  }
  .empty .ico-big{font-size:26px; margin-bottom:10px; display:block;}

  /* ---- table ---- */
  .table-wrap{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-l); overflow:hidden; box-shadow:var(--shadow-soft);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{
    text-align:left; padding:12px 16px; font-size:11.5px; font-weight:600;
    color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;
    background:var(--lilac); border-bottom:1px solid var(--line);
  }
  td{padding:14px 16px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row-clickable:hover{background:var(--lilac);}
  .name-cell{font-weight:600; font-family:'Fraunces',serif; font-size:14.5px;}

  /* ---- modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(53,43,54,0.38);
    display:flex; align-items:center; justify-content:center; padding:24px;
    z-index:50; overflow-y:auto;
  }
  .modal{
    background:var(--paper); border-radius:var(--radius-l);
    width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    padding:28px 28px 24px; box-shadow:0 24px 60px -16px rgba(53,43,54,0.4);
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .modal-head h2{font-size:19px; margin:0;}
  .modal-close{
    width:30px; height:30px; border-radius:50%; border:none; background:var(--lilac);
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:15px;
  }
  .modal-close:hover{background:var(--line);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:var(--radius-s);
    border:1px solid var(--line); background:var(--lilac); color:var(--ink);
    font-size:14px; outline:none; transition:border-color .12s ease, background .12s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--magenta); background:var(--paper);
  }
  .field textarea{resize:vertical; min-height:64px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-row-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  /* ---- roteiros ---- */
  .rt-swatches{display:flex; flex-wrap:wrap; gap:10px;}
  .rt-swatch{display:flex; align-items:center; gap:3px; padding:8px 12px 8px 8px; border:1.5px solid var(--line); border-radius:999px; background:var(--paper); cursor:pointer; font:inherit;}
  .rt-swatch span{width:16px; height:16px; border-radius:50%; display:inline-block;}
  .rt-swatch em{font-style:normal; font-size:12.5px; color:var(--ink-soft); margin-left:6px;}
  .rt-swatch.active{border-color:var(--magenta); box-shadow:0 0 0 3px var(--magenta-tint);}
  .rt-swatch-custom input{width:26px; height:26px; border:none; padding:0; background:none; cursor:pointer;}
  .rt-toggle{display:flex; gap:18px; flex-wrap:wrap; font-size:13.5px;}
  .rt-toggle label{display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:500; color:var(--ink);}
  .rt-toggle input{width:auto !important;}
  .rt-hint{font-size:12px; color:var(--ink-faint); margin-top:6px; line-height:1.6;}
  .rt-hint code{background:var(--magenta-tint); padding:1px 5px; border-radius:5px;}
  .rt-details summary{cursor:pointer; font-size:13px; font-weight:600; color:var(--magenta-deep); margin-bottom:4px;}
  .rt-preview{overflow-x:auto; border-radius:var(--radius-l); background:#ECE7E2; padding:18px;}
  .rt-sheet{background:#fff; color:#2B2B2B; font-family:Arial,Helvetica,sans-serif; font-size:12px; max-width:760px; min-width:520px; margin:0 auto; padding:26px; box-shadow:0 4px 18px rgba(0,0,0,.08);}
  .rt-table{width:100%; border-collapse:collapse; margin-top:12px; table-layout:fixed;}
  .rt-table th{color:#fff; text-align:left; padding:7px 9px; font-size:11.5px; border:1px solid;}
  .rt-table th:first-child{width:46px; text-align:center;}
  .rt-4col th:nth-child(4){width:24%;}
  .rt-4col .rt-imgbox{margin-top:0; min-height:110px; text-align:center;}
  .rt-table td{border:1px solid; padding:8px 9px; vertical-align:top; line-height:1.45;}
  .rt-table p{margin:0 0 5px;}
  .rt-table ul{margin:0; padding-left:14px;}
  .rt-table li{margin-bottom:4px;}
  .rt-table li::marker{color:var(--dot);}
  .rt-label{font-size:9.5px; font-weight:700; text-transform:uppercase; margin-bottom:4px;}
  .rt-imgbox{border:1.5px dashed; border-radius:4px; min-height:70px; margin-top:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; gap:2px;}
  .rt-imgbox span{color:#8A7A70; font-style:italic;}
  .rt-foot{margin:8px 0 0; font-size:11.5px;}


  /* ---- relatório de importação de prints ---- */
  .imp-box{padding:14px 16px; background:var(--magenta-tint); border-radius:var(--radius-s); margin-bottom:16px; font-size:13px;}
  .imp-box.is-ok{background:var(--sage-tint);}
  .imp-box.is-warn{background:var(--amber-tint);}
  .imp-title{font-size:13.5px; font-weight:600; color:var(--magenta-deep); margin-bottom:8px;}
  .imp-box.is-ok .imp-title{color:var(--sage-deep);}
  .imp-box.is-warn .imp-title{color:var(--amber-deep);}
  .imp-bar{background:var(--paper); border-radius:999px; height:7px; overflow:hidden;}
  .imp-bar div{height:100%; background:var(--magenta); transition:width .3s;}
  .imp-box.is-ok .imp-bar div{background:var(--sage);}
  .imp-box.is-warn .imp-bar div{background:var(--amber);}
  .imp-sum{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-weight:600;}
  .imp-sum .ok{color:var(--sage-deep);} .imp-sum .dup{color:var(--ink-soft);} .imp-sum .fail{color:var(--danger);}
  .imp-stop{margin:10px 0 0; color:var(--danger);}
  .imp-list{margin-top:10px; background:var(--paper); border-radius:var(--radius-s); padding:8px 10px;}
  .imp-list-t{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); cursor:pointer; margin-bottom:4px;}
  .imp-row{display:flex; gap:10px; justify-content:space-between; padding:6px 0; border-top:1px solid var(--line); font-size:12.5px;}
  .imp-row:first-of-type{border-top:none;}
  .imp-file{color:var(--ink); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:0 1 45%;}
  .imp-why{color:var(--ink-soft); text-align:right; flex:1;}
  .imp-row.fail .imp-why{color:var(--danger);}
  .imp-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  @media (max-width:700px){ .imp-row{flex-direction:column; gap:2px;} .imp-why{text-align:left;} .imp-file{flex:none;} }
  /* ---- finanças ---- */
  .fin-switch{display:inline-flex; gap:4px; padding:4px; border-radius:999px; background:var(--lilac); border:1px solid var(--line); margin:0 0 22px;}
  .fin-switch-btn{font:inherit; font-size:13.5px; font-weight:600; padding:8px 16px; border-radius:999px; border:none; background:transparent; color:var(--ink-soft); cursor:pointer;}
  .fin-switch-btn.active{background:var(--paper); color:var(--magenta-deep); box-shadow:var(--shadow-soft);}
  .fin-month-nav{display:flex; align-items:center; gap:10px; margin:-4px 0 18px; flex-wrap:wrap;}
  .fin-month-nav h2{margin:0; font-size:20px; text-transform:capitalize; min-width:170px; text-align:center;}
  .fin-box{padding:16px 18px;}
  .fin-muted{font-size:13px; color:var(--ink-faint); margin:0;}
  .fin-goal-top{display:flex; align-items:baseline; gap:8px; margin-bottom:8px;}
  .fin-goal-top strong{font-family:'Fraunces',serif; font-size:24px; color:var(--ink);}
  .fin-goal-top span{font-size:13px; color:var(--ink-soft);}
  .fin-bar{position:relative; height:12px; border-radius:999px; background:var(--lilac); overflow:hidden;}
  .fin-bar-thin{height:7px;}
  .fin-bar-fill, .fin-bar-pend{position:absolute; left:0; top:0; bottom:0; border-radius:999px; transition:width .4s ease;}
  .fin-bar-fill{background:var(--sage);}
  .fin-bar-pend{background:var(--sage-tint);}
  .fin-bar-fill.fin-coral{background:var(--magenta);}
  .fin-goal-msg{font-size:13px; color:var(--ink-soft); margin:10px 0 0;}
  .fin-cat{margin-bottom:12px;}
  .fin-cat:last-child{margin-bottom:0;}
  .fin-cat-head{display:flex; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:5px; color:var(--ink);}
  .fin-cat-head em{font-style:normal; color:var(--ink-faint); font-size:12px; margin-left:4px;}
  .fin-table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:440px;}
  .fin-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:12px 16px 8px; font-weight:700;}
  .fin-table td{padding:11px 16px; border-top:1px solid var(--line); text-transform:none;}
  .fin-table td:first-child{text-transform:capitalize;}
  .fin-table tr{cursor:pointer;}
  .fin-table tr:hover td, .fin-table tr.is-sel td{background:var(--magenta-tint);}
  .fin-table .pos{color:var(--sage-deep);} .fin-table .neg{color:var(--danger);}
  .fin-chip{font-size:10px; font-weight:700; text-transform:uppercase; background:var(--sage-tint); color:var(--sage-deep); padding:2px 6px; border-radius:6px; margin-left:4px;}
  .fin-legend{font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .fin-legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-left:8px;}
  .lg-in{background:var(--sage);} .lg-out{background:var(--magenta);}
  .fin-chart{display:flex; gap:10px; align-items:flex-end; height:200px;}
  .fin-col{flex:1; display:flex; flex-direction:column; align-items:center; height:100%; cursor:pointer; min-width:0;}
  .fin-col-bars{flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; gap:4px;}
  .fin-b-in, .fin-b-out{width:38%; max-width:22px; border-radius:5px 5px 0 0; min-height:2px; transition:height .4s ease;}
  .fin-b-in{background:var(--sage);} .fin-b-out{background:var(--magenta);}
  .fin-col-lucro{font-size:11px; font-weight:600; margin-top:6px; white-space:nowrap;}
  .fin-col-lucro.pos{color:var(--sage-deep);} .fin-col-lucro.neg{color:var(--danger);}
  .fin-col-label{font-size:11px; color:var(--ink-faint); text-transform:capitalize;}
  @media (max-width:700px){ .fin-chart{gap:4px; height:170px;} .fin-col-lucro{font-size:9.5px;} }
  .rt-modes{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .rt-mode{font:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink-soft); cursor:pointer;}
  .rt-mode.active{background:var(--magenta); border-color:var(--magenta); color:#fff;}
  .rt-card{border:1px solid var(--line); border-radius:var(--radius-m); background:var(--paper); padding:12px; margin-bottom:10px;}
  .rt-card-head{display:flex; align-items:center; gap:6px; margin-bottom:10px;}
  .rt-card-head input{flex:1; min-width:0;}
  .rt-card-head .btn{padding:6px 9px;}
  .rt-card-n{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--magenta-deep); white-space:nowrap;}
  .rt-card-body{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .rt-card-body label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}
  .rt-card input, .rt-card textarea{width:100%; box-sizing:border-box; font:inherit; font-size:13.5px; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--lilac); color:var(--ink);}
  .rt-card textarea{resize:vertical; min-height:70px;}
  details.rt-hint summary{cursor:pointer; font-weight:600;}
  @media (max-width:700px){ .rt-card-body{grid-template-columns:1fr;} }
  @media (max-width:700px){ .rt-sheet{padding:14px;} .rt-preview{padding:8px;} }

  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px; flex-wrap:wrap;}

  .detail-funnel{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 18px;}
  .detail-step{
    padding:6px 10px; border-radius:7px; font-size:11.5px; font-weight:600;
    background:var(--lilac); color:var(--ink-faint); border:1px solid transparent;
  }
  .detail-step.active{background:var(--magenta); color:#fff;}
  .detail-step.past{background:var(--magenta-tint); color:var(--magenta-deep);}
  .detail-step.paid{background:var(--sage); color:#fff;}
  .detail-step.cancelled{background:var(--danger); color:#fff;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:999px;
    font-size:13.5px; font-weight:500; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; z-index:100;
    box-shadow:0 12px 30px -8px rgba(0,0,0,0.4);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .sr-only{position:absolute; width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  /* ---- agenda (intelligent calendar) ---- */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .cal-nav{display:flex; align-items:center; gap:10px;}
  .cal-title{font-size:18px; min-width:170px; text-align:center;}
  .agenda-filters{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
  .agenda-filter-chip{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:var(--paper); border-radius:999px;
    padding:4px 10px 4px 8px; font-size:11.5px; font-weight:500; color:var(--ink-faint);
    transition:all .12s ease; opacity:0.55;
  }
  .agenda-filter-chip.active{opacity:1; color:var(--ink); border-color:var(--rose); background:var(--lilac);}
  .agenda-filter-chip:hover{opacity:1;}
  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:6px;
  }
  .cal-dow{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--ink-faint); text-align:center; padding-bottom:6px; letter-spacing:.04em;}
  .cal-cell{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-s);
    min-height:96px; padding:7px; display:flex; flex-direction:column; gap:4px;
  }
  .cal-cell.empty-cell{background:transparent; border:none;}
  .cal-cell.today{border-color:var(--magenta); border-width:1.5px;}
  .cal-daynum{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .cal-cell.today .cal-daynum{color:var(--magenta-deep);}
  .cal-job-chip{
    font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;
  }

  /* ---- checklist (infinite week scroller) ---- */
  .week-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  .week-nav{display:flex; align-items:center; gap:10px;}
  .week-title{font-size:16px; min-width:170px; text-align:center;}

  /* Outer viewport: clips the scrollbar so navigation feels infinite, not "scrolled" */
  .week-scroll-viewport{
    margin:0 -4px; padding:0 4px;
    overflow:hidden;
  }

  /* ---- planner diário ---- */
  .planner-view-toggle{display:flex; gap:6px; margin-bottom:20px;}
  .planner-view-btn{
    padding:8px 18px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper); font-size:13px; font-weight:600; color:var(--ink-soft);
    cursor:pointer; transition:all .12s ease;
  }
  .planner-view-btn.active{background:var(--magenta); border-color:var(--magenta); color:#fff;}

  .daily-planner{display:flex; flex-direction:column; gap:18px;}
  .daily-nav{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
  .daily-nav-date{font-family:'Fraunces',serif; font-size:22px; font-weight:600; min-width:220px;}
  .daily-nav-sub{font-size:13px; color:var(--ink-soft);}

  .planner-phrase-card{
    background:linear-gradient(135deg, var(--magenta-tint) 0%, var(--blush) 100%);
    border:1px solid var(--line); border-radius:var(--radius-l);
    padding:20px 24px; position:relative;
  }
  .planner-phrase-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--magenta-deep); margin:0 0 8px;}
  .planner-phrase-input{
    width:100%; border:none; background:transparent; font-family:'Fraunces',serif;
    font-size:18px; color:var(--ink); font-weight:500; resize:none; outline:none;
    line-height:1.5;
  }
  .planner-phrase-input::placeholder{color:var(--ink-faint); font-style:italic;}

  .planner-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:700px){.planner-grid{grid-template-columns:1fr;}}

  .planner-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-l);
    padding:18px 20px; box-shadow:var(--shadow-soft);
  }
  .planner-card-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin:0 0 14px;}

  .priority-item{
    display:flex; align-items:center; gap:10px; padding:10px 0;
    border-bottom:1px solid var(--line); transition:opacity .15s ease;
  }
  .priority-item:last-child{border-bottom:none;}
  .priority-item.done .priority-input{ text-decoration:line-through; color:var(--ink-faint); }
  .priority-item.done .priority-num{
    background:var(--sage-tint); color:var(--sage-deep);
  }
  .priority-check{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--line);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; background:var(--paper); transition:all .15s ease;
    font-size:11px; color:transparent;
  }
  .priority-item.done .priority-check{
    background:var(--sage); border-color:var(--sage); color:#fff;
  }
  .priority-num{
    width:24px; height:24px; border-radius:50%; background:var(--magenta-tint);
    color:var(--magenta-deep); font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:all .15s ease;
  }
  .priority-input{
    flex:1; border:none; background:transparent; font-size:13.5px;
    color:var(--ink); outline:none; transition:all .15s ease;
  }
  .priority-input::placeholder{color:var(--ink-faint);}

  /* timer custom input */
  /* ---- assistente ---- */
  .assistant-layout{display:grid; grid-template-columns:300px 1fr; gap:20px; height:calc(100vh - 180px); min-height:500px;}
  @media(max-width:900px){.assistant-layout{grid-template-columns:1fr; height:auto;}}
  .assistant-profile-panel{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-l);
    padding:20px; display:flex; flex-direction:column; gap:14px;
    overflow-y:auto; max-height:100%;
  }
  .assistant-profile-panel h3{font-family:'Fraunces',serif; font-size:16px; margin:0 0 4px;}
  .assistant-profile-panel p{font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5;}
  .profile-textarea{
    width:100%; min-height:200px; padding:12px; border-radius:var(--radius-s);
    border:1px solid var(--line); background:var(--lilac); font-size:13px;
    color:var(--ink); resize:vertical; outline:none; line-height:1.6;
  }
  .profile-textarea:focus{border-color:var(--magenta); background:var(--paper);}

  .assistant-chat-panel{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-l);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .chat-messages{
    flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px;
  }
  .chat-msg{display:flex; gap:10px; align-items:flex-start;}
  .chat-msg.user{flex-direction:row-reverse;}
  .chat-bubble{
    max-width:80%; padding:12px 16px; border-radius:16px; font-size:14px; line-height:1.6;
    white-space:pre-wrap;
  }
  .chat-msg.assistant .chat-bubble{
    background:var(--lilac); color:var(--ink); border-bottom-left-radius:4px;
  }
  .chat-msg.user .chat-bubble{
    background:var(--magenta); color:#fff; border-bottom-right-radius:4px;
  }
  .chat-avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    background:var(--magenta-tint);
  }
  .chat-msg.user .chat-avatar{background:var(--magenta); color:#fff;}
  .chat-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .chat-action-btn{
    padding:6px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper); font-size:12.5px; font-weight:600; color:var(--magenta-deep);
    cursor:pointer; transition:all .12s ease;
  }
  .chat-action-btn:hover{background:var(--magenta-tint);}
  .chat-copy-btn{
    display:inline-flex; align-items:center; gap:5px; margin-top:8px;
    padding:5px 10px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper); font-size:12px; font-weight:600; color:var(--ink-soft);
    cursor:pointer;
  }
  .chat-copy-btn:hover{background:var(--sage-tint); color:var(--sage-deep); border-color:var(--sage);}
  .chat-input-row{
    display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--line);
    background:var(--paper);
  }
  .chat-input{
    flex:1; padding:11px 14px; border-radius:var(--radius-m); border:1px solid var(--line);
    background:var(--lilac); font-size:14px; outline:none; resize:none; min-height:44px; max-height:120px;
    font-family:'Inter',sans-serif; line-height:1.5;
  }
  .chat-input:focus{border-color:var(--magenta); background:var(--paper);}
  .chat-typing{
    display:flex; gap:6px; align-items:center; padding:10px 14px;
    background:var(--lilac); border-radius:16px; border-bottom-left-radius:4px;
    width:fit-content;
  }
  .chat-typing span{
    width:7px; height:7px; border-radius:50%; background:var(--ink-faint);
    animation:typingDot 1.2s infinite;
  }
  .chat-typing span:nth-child(2){animation-delay:.2s;}
  .chat-typing span:nth-child(3){animation-delay:.4s;}
  @keyframes typingDot{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}

  /* ---- tema / paleta de cores ---- */
  .theme-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:20px; margin-bottom:32px;}
  .theme-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-l);
    padding:22px 20px; box-shadow:var(--shadow-soft);
  }
  .theme-card-label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:0 0 14px;}
  .color-picker-wrap{display:flex; flex-direction:column; gap:10px;}
  .color-canvas-wrap{
    position:relative; width:100%; height:160px; border-radius:var(--radius-s); overflow:hidden;
    cursor:crosshair; user-select:none;
  }
  .color-canvas{width:100%; height:100%; display:block;}
  .color-cursor{
    position:absolute; width:14px; height:14px; border-radius:50%;
    border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,0.3);
    transform:translate(-50%,-50%); pointer-events:none;
  }
  .hue-slider-wrap{position:relative; height:18px; border-radius:999px; overflow:hidden;}
  .hue-slider{
    width:100%; height:100%; appearance:none; -webkit-appearance:none;
    background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
    border:none; cursor:pointer; outline:none;
  }
  .hue-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:#fff; border:2px solid rgba(0,0,0,0.2); box-shadow:0 1px 4px rgba(0,0,0,0.3);
    cursor:pointer;
  }
  .color-input-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .color-mode-toggle{
    display:flex; border:1px solid var(--line); border-radius:var(--radius-s); overflow:hidden;
    flex-shrink:0;
  }
  .color-mode-btn{
    padding:6px 10px; font-size:11.5px; font-weight:700; border:none; background:transparent;
    color:var(--ink-soft); cursor:pointer; transition:all .1s ease;
  }
  .color-mode-btn.active{background:var(--magenta); color:#fff;}
  .color-rgb-row{display:flex; gap:6px; flex:1;}
  .color-rgb-input{
    flex:1; padding:9px 8px; border-radius:var(--radius-s); border:1px solid var(--line);
    background:var(--lilac); font-size:13px; text-align:center; outline:none; min-width:0;
    color:var(--ink);
  }
  .color-rgb-input:focus{border-color:var(--magenta); background:var(--paper);}
  .color-rgb-label{font-size:10px; text-align:center; color:var(--ink-faint); font-weight:700; letter-spacing:.04em; margin-top:2px;}
  .color-preview-swatch{
    width:36px; height:36px; border-radius:var(--radius-s); border:1px solid var(--line);
    flex-shrink:0; cursor:pointer;
  }
  .color-hex-input{
    flex:1; padding:9px 12px; border-radius:var(--radius-s); border:1px solid var(--line);
    background:var(--lilac); font-size:13.5px; font-family:'Inter',sans-serif;
    color:var(--ink); outline:none; text-transform:uppercase;
  }
  .color-hex-input:focus{border-color:var(--magenta); background:var(--paper);}
  .theme-presets{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:24px;}
  .theme-preset-btn{
    padding:8px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper); font-size:13px; font-weight:600; color:var(--ink-soft);
    cursor:pointer; display:flex; align-items:center; gap:8px; transition:all .12s ease;
  }
  .theme-preset-btn:hover{background:var(--lilac);}
  .theme-preset-dot{width:12px; height:12px; border-radius:50%;}

  .timer-custom-row{
    display:flex; align-items:center; gap:8px; justify-content:center; margin-top:10px;
  }
  .timer-custom-input{
    width:64px; padding:6px 10px; border-radius:var(--radius-s);
    border:1px solid var(--line); background:var(--lilac); font-size:14px;
    text-align:center; font-family:'Fraunces',serif; font-weight:600; outline:none;
    color:var(--ink);
  }
  .timer-custom-input:focus{border-color:var(--magenta); background:var(--paper);}

  /* timer */
  .timer-display{
    text-align:center; padding:8px 0 16px;
  }
  .timer-time{
    font-family:'Fraunces',serif; font-size:52px; font-weight:600;
    color:var(--ink); letter-spacing:-2px; line-height:1;
    margin-bottom:6px;
  }
  .timer-mode-label{font-size:12px; color:var(--ink-soft); margin-bottom:16px;}
  .timer-controls{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .timer-ring{
    width:120px; height:120px; margin:0 auto 12px;
    position:relative;
  }
  .timer-ring svg{transform:rotate(-90deg);}
  .timer-ring-text{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--ink);
    flex-direction:column;
  }
  .timer-ring-sub{font-size:10px; font-weight:600; color:var(--ink-faint); font-family:'Inter',sans-serif; margin-top:2px;}

  .planner-tasks-col{display:flex; flex-direction:column; gap:6px;}

  .week-kanban{
    display:flex; gap:16px; align-items:stretch;
    overflow-x:auto; overflow-y:hidden;
    padding:4px 4px 22px; margin-bottom:-18px;
    scroll-behavior:smooth;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .week-kanban::-webkit-scrollbar{height:0; display:none;}
  .week-kanban{scrollbar-width:none; -ms-overflow-style:none;}

  .week-col{
    flex:1 1 0; min-width:196px; max-width:260px;
    scroll-snap-align:start;
    display:flex; flex-direction:column;
    animation:weekColIn .22s ease both;
  }
  @keyframes weekColIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .week-col-head{margin-bottom:12px; padding:0 3px;}
  .week-col-dow{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);}
  .week-col-date{font-size:14px; font-weight:600; color:var(--ink); margin-top:1px;}
  .week-col.is-today .week-col-dow{color:var(--magenta-deep);}
  .week-col.is-today .week-col-date{color:var(--magenta-deep);}
  .week-col.is-today .week-col-head{position:relative;}
  .week-col.is-today .week-col-head::after{
    content:""; position:absolute; left:3px; bottom:-6px; width:16px; height:2.5px;
    border-radius:2px; background:var(--magenta);
  }
  .week-col-body{
    background:rgba(255,255,255,0.45); border:1.5px dashed var(--line); border-radius:var(--radius-m);
    padding:10px 8px; min-height:160px; flex:1;
    display:flex; flex-direction:column; gap:16px;
    transition:background .15s ease, border-color .15s ease;
  }
  .week-col-body.drag-over{background:var(--magenta-tint); border-color:var(--magenta); border-style:solid;}
  .week-cat-label{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-faint); margin:2px 0 8px 2px;
  }
  .week-cat-label.cat-work{color:var(--magenta-deep);}

  .check-list{display:flex; flex-direction:column; gap:7px;}

    display:flex; align-items:flex-start; gap:8px; position:relative;

  .check-item.auto-deadline:hover{border-color:var(--amber);}

  .check-auto-tag{
    display:inline-flex; align-items:center; font-size:9.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.04em; color:var(--amber-deep);

    padding:1.5px 5px; margin-top:2px; flex-shrink:0;
  }
  .check-box{
    width:19px; height:19px; border-radius:6px; border:1.5px solid var(--line);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:#fff; font-size:12px; transition:all .12s ease;
    margin-top:1px;
  }
  .check-box.checked{background:var(--sage); border-color:var(--sage);}
  .check-text{
    flex:1; font-size:13px; min-width:0; line-height:1.4; padding-right:12px;
    word-break:normal; overflow-wrap:anywhere;
    -webkit-hyphens:auto; hyphens:auto; hyphenate-limit-chars:7 3 3;
    text-wrap:pretty;
  }
  .check-item.checked .check-text{color:var(--ink-faint); text-decoration:line-through;}
  .check-del{
    border:none; background:transparent; color:var(--ink-faint); font-size:12px; padding:3px;

    position:absolute; top:5px; right:5px;
  }
  @media (hover:hover){

  .week-add{

<script>
(function(){
"use strict";

/* ---------------- constants ---------------- */
var STATUS_FLOW = [
  {key:"prospeccao", label:"Prospecção"},
  {key:"followup", label:"Follow-up"},
  {key:"negociacao", label:"Negociação"},
  {key:"contrato", label:"Contrato fechado"},
  {key:"aguardando_produto", label:"Aguardando produto"},
  {key:"roteiro", label:"Roteiro"},
  {key:"gravacao", label:"Gravação"},
  {key:"edicao", label:"Edição"},
  {key:"aprovacao", label:"Enviado p/ aprovação"},
  {key:"alteracoes", label:"Alterações"},
  {key:"aguardando_pagamento", label:"Aguardando pagamento"},
  {key:"pago", label:"Pago / finalizado"}
];
var STATUS_CANCELLED = "cancelado";
var STATUS_INDEX = {};
STATUS_FLOW.forEach(function(s,i){ STATUS_INDEX[s.key] = i; });
var KANBAN_STATUSES = STATUS_FLOW.concat([{key:STATUS_CANCELLED,label:"Cancelado"}]);

/* Status color map: each status gets a dot color + soft tint background,
   staying within the existing palette family (no new hues introduced outside it). */
var STATUS_COLORS = {
  /* ---- prospecção ---- */
  pendente:             {dot:'var(--ink-faint)',     bg:'var(--lilac)',        fg:'var(--ink-soft)'},
  enviado:              {dot:'var(--slate)',          bg:'var(--slate-tint)',   fg:'#54527a'},
  email:                {dot:'var(--teal)',           bg:'var(--teal-tint)',    fg:'#2d6663'},
  respondeu_email:      {dot:'var(--sage)',           bg:'var(--sage-tint)',    fg:'var(--sage-deep)'},
  followup_email:       {dot:'var(--plum)',           bg:'var(--plum-tint)',    fg:'var(--plum)'},
  followup1:            {dot:'var(--teal)',           bg:'var(--teal-tint)',    fg:'#2d6663'},
  followup2:            {dot:'var(--amber)',          bg:'var(--amber-tint)',   fg:'var(--amber-deep)'},
  respondeu:            {dot:'var(--sage)',           bg:'var(--sage-tint)',    fg:'var(--sage-deep)'},
  negociando:           {dot:'var(--amber)',          bg:'var(--amber-tint)',   fg:'var(--amber-deep)'},
  fechou:               {dot:'var(--sage-deep)',      bg:'var(--sage-tint)',    fg:'var(--sage-deep)'},
  recusou:              {dot:'var(--danger)',         bg:'var(--danger-tint)',  fg:'var(--danger)'},
  /* ---- jobs ---- */
  prospeccao:           {dot:'var(--slate)',          bg:'var(--slate-tint)',   fg:'#54527a'},
  followup:             {dot:'var(--teal)',           bg:'var(--teal-tint)',    fg:'#2d6663'},
  negociacao:           {dot:'var(--amber)',          bg:'var(--amber-tint)',   fg:'var(--amber-deep)'},
  contrato:             {dot:'var(--sage)',           bg:'var(--sage-tint)',    fg:'var(--sage-deep)'},
  aguardando_produto:   {dot:'var(--clay)',           bg:'var(--clay-tint)',    fg:'var(--clay)'},
  roteiro:              {dot:'var(--plum)',           bg:'var(--plum-tint)',    fg:'var(--plum)'},
  gravacao:             {dot:'#D6A24A',               bg:'var(--amber-tint)',   fg:'var(--amber-deep)'},
  edicao:               {dot:'var(--plum)',           bg:'var(--plum-tint)',    fg:'var(--plum)'},
  aprovacao:            {dot:'var(--clay)',           bg:'var(--clay-tint)',    fg:'var(--clay)'},
  alteracoes:           {dot:'var(--danger)',         bg:'var(--danger-tint)',  fg:'var(--danger)'},
  aguardando_pagamento: {dot:'var(--amber)',          bg:'var(--amber-tint)',   fg:'var(--amber-deep)'},
  pago:                 {dot:'var(--sage-deep)',      bg:'var(--sage-tint)',    fg:'var(--sage-deep)'},
  cancelado:            {dot:'var(--ink-faint)',      bg:'var(--lilac)',        fg:'var(--ink-soft)'}
};
function statusColor(key){
  return STATUS_COLORS[key] || {dot:'var(--ink-faint)', bg:'var(--lilac)', fg:'var(--ink-soft)'};
}
function statusBadgeHtml(key, label){
  var c = statusColor(key);

function hashStringToIndex(str, mod){
  var h = 0;
  for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h % mod;
}
function platformColor(platformIdOrName){
  var key = String(platformIdOrName||'');
  return PLATFORM_PALETTE[hashStringToIndex(key, PLATFORM_PALETTE.length)];
}

/* Auto-scroll durante drag: rola o kanban automaticamente quando o card
   chega perto da borda, resolvendo o problema de só poder soltar onde já
   está visível na tela. */
var _dragScrollRAF = null;
var _dragScrollState = {el: null, x: 0, y: 0};

function startDragScroll(scrollEl, clientX, clientY){
  _dragScrollState = {el: scrollEl, x: clientX, y: clientY};
  var EDGE = 80;
  var SPEED = 14;
  cancelAnimationFrame(_dragScrollRAF);
  function loop(){
    var s = _dragScrollState;
    if(!s.el){ return; }
    var rect = s.el.getBoundingClientRect();
    if(s.x < rect.left + EDGE)   s.el.scrollLeft -= SPEED;
    if(s.x > rect.right - EDGE)  s.el.scrollLeft += SPEED;
    if(s.y < 80)                  window.scrollBy(0, -SPEED);
    if(s.y > window.innerHeight - 80) window.scrollBy(0, SPEED);
    _dragScrollRAF = requestAnimationFrame(loop);
  }
  _dragScrollRAF = requestAnimationFrame(loop);
}

function updateDragScroll(clientX, clientY){
  _dragScrollState.x = clientX;
  _dragScrollState.y = clientY;
}

function stopDragScroll(){
  cancelAnimationFrame(_dragScrollRAF);
  _dragScrollRAF = null;
  _dragScrollState = {el: null, x: 0, y: 0};
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function ensureArray(val){
  if(Array.isArray(val)) return val;
  if(val && typeof val === 'object') return [val];
  return [];
}

var storageAdapter = (function(){
  var lsAvailable = false;
  try{
    localStorage.setItem('__ugc_test__', '1');
    localStorage.removeItem('__ugc_test__');
    lsAvailable = true;
  }catch(e){ lsAvailable = false; }

  function lsGet(key){
    if(!lsAvailable) return null;
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  function lsSet(key, val){
    if(!lsAvailable) return Promise.reject(new Error('localStorage unavailable neste navegador'));
    try{ localStorage.setItem(key, val); return Promise.resolve(); }catch(e){ return Promise.reject(e); }
  }
  // O Creator Desk roda como site publicado (Vercel) e persiste localmente via
  // localStorage, com Firestore por cima para sincronizar entre dispositivos.
  // Nunca usar window.storage aqui: essa API só existe no preview de artifacts
  // do Claude e nunca estará disponível no site real — usá-la faria todo
  // salvamento (despesas, jobs, tudo) falhar silenciosamente em produção.
  return {
    get: function(key){ return Promise.resolve({ value: lsGet(key) }); },
    set: lsSet
  };
})();

var saveQueue = Promise.resolve();

async function loadKey(key){
  try{
    var r = await storageAdapter.get(key, false);
    var raw = r && r.value != null && r.value !== '' ? r.value : null;
    if(!raw) return [];
    return ensureArray(JSON.parse(raw));
  }catch(e){ return []; }
}
async function loadKeyObj(key){
  try{
    var r = await storageAdapter.get(key, false);
    var raw = r && r.value != null && r.value !== '' ? r.value : null;
    if(!raw) return null;
    var parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : null;
  }catch(e){ return null; }
}
function saveKey(key, val){
  var payload = JSON.stringify(val);
  // Grava localmente de imediato — essa é a operação que precisa ter sucesso
  // ou falha visíveis na hora (é o que faz "criar despesa" funcionar ou não).
  // A sincronização com a nuvem roda à parte, sem travar nem ser travada por ela.
  var localSave = storageAdapter.set(key, payload, false).catch(function(err){
    showToast("Não foi possível salvar neste navegador. Tente novamente.");
    throw err;
  });
  saveQueue = saveQueue.then(function(){ return localSave; }).catch(function(){ /* já avisado acima */ });
  return localSave.then(function(){
    if(!applyingRemote) scheduleCloudSync();
  });
}
function saveKeyQuiet(key, val){
  return storageAdapter.set(key, JSON.stringify(val), false);
}

// "assinatura" dos dados sincronizados, pra saber se um update da nuvem mudou algo de verdade
function cloudDataSignature(){
  try{
    return JSON.stringify([state.jobs, state.brands, state.platforms, state.checklist, state.expenses,
      state.prospects, state.products, state.contractProfile, state.notificationsRead,
      state.exchangeRates, state.nichos, state.creatorProfile, state.financeGoals]);
  }catch(e){ return String(Math.random()); }
}
function applyRemoteData(data){
  if(!data) return;
  // Se os dados remotos chegaram completamente vazios mas temos dados locais,
  // ignoramos o update — pode ser um sync incompleto ou documento novo no Firestore.
  var remoteHasData = (data.jobs && data.jobs.length > 0) ||
    (data.brands && data.brands.length > 0) ||
    (data.prospects && data.prospects.length > 0) ||
    (data.checklist && data.checklist.length > 0) ||
    (data.expenses && data.expenses.length > 0) ||
    (data.products && data.products.length > 0);
  if(!remoteHasData && hasLocalData()) return;

  applyingRemote = true;
  state.jobs = ensureArray(data.jobs);
  state.brands = ensureArray(data.brands);
  state.platforms = ensureArray(data.platforms);
  state.checklist = ensureArray(data.checklist);
  state.expenses = ensureArray(data.expenses);
  state.prospects = ensureArray(data.prospects);
  state.products = ensureArray(data.products);
  state.contractProfile = data.contractProfile && typeof data.contractProfile === 'object' && !Array.isArray(data.contractProfile)
    ? data.contractProfile : null;
  state.notificationsRead = data.notificationsRead && typeof data.notificationsRead === 'object' && !Array.isArray(data.notificationsRead)
    ? data.notificationsRead : {};
  state.exchangeRates = data.exchangeRates && typeof data.exchangeRates === 'object' && !Array.isArray(data.exchangeRates)
    ? Object.assign({BRL:1}, data.exchangeRates) : state.exchangeRates;
  state.nichos = ensureArray(data.nichos);
  if(data.creatorProfile && typeof data.creatorProfile === 'object'){
    state.creatorProfile = data.creatorProfile;
  }
  if(data.financeGoals && typeof data.financeGoals === 'object' && !Array.isArray(data.financeGoals)){
    state.financeGoals = data.financeGoals;
  }
  applyingRemote = false;
}
function subscribeCloudData(){
  if(cloudUnsubscribe){ cloudUnsubscribe(); cloudUnsubscribe = null; }
  var ref = getCloudDocRef();
  if(!ref) return;

  cloudUnsubscribe = ref.onSnapshot(function(snap){
    if(snap.metadata.hasPendingWrites) return;

    if(!snap.exists){
      if(hasLocalData()){
        pushAllToCloud();
      }
      updateSyncUI();
      return;
    }

    var sigBefore = cloudDataSignature();
    applyRemoteData(snap.data());
    var dataChanged = cloudDataSignature() !== sigBefore;
    persistAllLocalQuiet().then(function(){
      // eco do próprio salvamento (nada mudou de verdade): não redesenha a tela
      // — era isso que fazia a prospecção voltar pro início e fechar modais
      if(state.loaded && dataChanged){
        var activeEl = document.activeElement;
        // não re-renderiza se digitando no planner diário
        var plannerInputs = ['dpPhrase','dpP1','dpP2','dpP3'];
        var typingInPlanner = activeEl && plannerInputs.indexOf(activeEl.id) !== -1;
        // não re-renderiza se estiver no planner semanal (evita voltar para maio)
        var inWeeklyPlanner = state.route === 'checklist' && state.plannerView === 'weekly';

        if(!typingInPlanner && !inWeeklyPlanner){
          document.getElementById('modalRoot').innerHTML = '';
          render();
        }
      }
      updateSyncUI();
    });
  }, function(){
    setCloudSyncStatus('off', 'Sem conexão. Usando cópia local.');
  });
}
function initCloudSync(){
  if(!isCloudConfigured() || typeof firebase === 'undefined'){
    updateSyncUI();
    return Promise.resolve();
  }

  if(!firebase.apps.length){
    firebase.initializeApp(FIREBASE_CONFIG);
  }
  cloudDb = firebase.firestore();

  return new Promise(function(resolve){
    var ready = false;
    firebase.auth().onAuthStateChanged(function(user){
      // detecta troca de usuário e limpa localStorage para não vazar dados
      var previousUid = null;
      try{ previousUid = localStorage.getItem('studio_current_uid'); }catch(e){}
      if(user && previousUid && previousUid !== user.uid){
        // usuário diferente — limpa todos os dados locais
        var keysToRemove = Object.values(STORE);
        keysToRemove.forEach(function(k){
          try{ localStorage.removeItem(k); }catch(e){}
        });
        try{ localStorage.removeItem('studio_auth_token'); }catch(e){}
      }
      if(user){
        try{ localStorage.setItem('studio_current_uid', user.uid); }catch(e){}
      } else {
        try{ localStorage.removeItem('studio_current_uid'); }catch(e){}
      }

      cloudUser = user;
      if(cloudUnsubscribe){ cloudUnsubscribe(); cloudUnsubscribe = null; }

      if(user){
        subscribeCloudData();
      } else {
        updateSyncUI();
      }
      if(!ready){
        ready = true;
        resolve();
      }
    });
  });
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  if(str===undefined||str===null) return "";
  return String(str).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}
function fmtDate(iso){
  if(!iso) return "—";
  var d = new Date(iso+"T00:00:00");
  if(isNaN(d.getTime())) return "—";
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
}
function daysUntil(iso){
  if(!iso) return null;
  var d = new Date(iso+"T00:00:00");
  if(isNaN(d.getTime())) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d-today)/86400000);
}
function brandById(id){ return state.brands.find(function(b){return b.id===id;}); }
function platformById(id){ return state.platforms.find(function(p){return p.id===id;}); }
function statusLabel(key){
  if(key===STATUS_CANCELLED) return "Cancelado";
  var s = STATUS_FLOW.find(function(x){return x.key===key;});
  return s ? s.label : key;
}
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}
function parseMoneyGuess(v){
  if(!v) return 0;
  var cleaned = String(v).replace(/[^\d,.\-]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');
  var n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function fmtBRL(n){
  try{ return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  catch(e){ return 'R$ ' + n.toFixed(2); }
}
function fmtCurrency(n, currencyCode){
  currencyCode = currencyCode || 'BRL';
  try{ return n.toLocaleString('pt-BR',{style:'currency',currency:currencyCode}); }
  catch(e){
    var c = CURRENCIES.find(function(c){return c.code===currencyCode;});
    return (c?c.symbol:'R$') + ' ' + n.toFixed(2);
  }
}

/* Converts any tracked currency to BRL using the user-configured exchange rates,
   so totals across the app (Dashboard, Pagamentos, Métricas) can sum mixed-currency
   jobs into one meaningful number. Individual job cards still display the original
   currency — only aggregates go through this. */
function parseMoneyBRL(value, currencyCode){
  var amount = parseMoneyGuess(value);
  if(!amount) return 0;
  var code = currencyCode || 'BRL';
  var rate = (state.exchangeRates && state.exchangeRates[code]) || (code==='BRL' ? 1 : 1);
  return amount * rate;
}

/* ---------------- installments helpers ---------------- */
function jobTotalValue(job){
  if(job.paymentType==='split' && job.installments && job.installments.length>0){
    return job.installments.reduce(function(s,inst){ return s+parseMoneyBRL(inst.value, job.currency); }, 0);
  }
  return parseMoneyBRL(job.value, job.currency);
}
function jobPaidValue(job){
  if(job.paymentType==='split' && job.installments && job.installments.length>0){
    return job.installments.filter(function(i){return i.paid;}).reduce(function(s,inst){ return s+parseMoneyBRL(inst.value, job.currency); }, 0);
  }
  return job.status==='pago' ? parseMoneyBRL(job.value, job.currency) : 0;
}
function jobPendingValue(job){
  return jobTotalValue(job) - jobPaidValue(job);
}
function buildInstallments(splitMode, totalValue, videoCount, customRows){
  var total = parseMoneyGuess(totalValue);
  if(splitMode==='half'){
    var half = (total/2);
    return [
      {id:uid(), label:'Entrada (50%)', value: half.toFixed(2), dueDate:'', paid:false, paidDate:''},
      {id:uid(), label:'Final (50%)', value: (total-half).toFixed(2), dueDate:'', paid:false, paidDate:''}
    ];
  }
  if(splitMode==='per_video'){
    var n = Math.max(1, parseInt(videoCount,10) || 1);
    var per = total/n;
    var rows = [];
    for(var i=0;i<n;i++){
      rows.push({id:uid(), label:'Vídeo '+(i+1), value: per.toFixed(2), dueDate:'', paid:false, paidDate:''});
    }
    return rows;
  }
  if(splitMode==='custom' && customRows){
    return customRows;
  }
  return [];
}

function renderProspectKanban(){
  var wrap = document.getElementById('prospectKanban');
  if(!wrap) return;

  // salva scroll horizontal do wrapper, vertical de cada coluna E do #main
  var savedScrollX = wrap.scrollLeft;
  var mainEl = document.getElementById('main');
  var savedMainY = mainEl ? mainEl.scrollTop : 0;
  var savedColScrolls = {};
  wrap.querySelectorAll('[data-prospect-col]').forEach(function(col){
    var key = col.getAttribute('data-prospect-col');
    savedColScrolls[key] = col.scrollTop; // salva mesmo se 0
  });

  var html = '';
  PROSPECT_STATUS_FLOW.forEach(function(s){
    var items = state.prospects.filter(function(p){ return p.status===s.key; });
    html += '<div class="kanban-col">' +
      '<div class="kanban-col-head">'+statusBadgeHtml(s.key, s.label)+'<span class="kanban-col-count">('+items.length+')</span></div>' +
      '<div class="kanban-col-body" data-prospect-col="'+s.key+'">';
    items.forEach(function(p){ html += prospectCardHtml(p); });
    html += '<button class="kanban-add" data-new-prospect-status="'+s.key+'">+ Adicionar</button>';
    html += '</div></div>';
  });
  wrap.innerHTML = html;

  // restaura todos os scrolls
  setScrollLeftInstant(wrap, savedScrollX);
  requestAnimationFrame(function(){
    setScrollLeftInstant(wrap, savedScrollX);
    var mainEl2 = document.getElementById('main');
    if(mainEl2) mainEl2.scrollTop = savedMainY;
    wrap.querySelectorAll('[data-prospect-col]').forEach(function(col){
      var key = col.getAttribute('data-prospect-col');
      col.scrollTop = savedColScrolls[key] || 0;
    });
  });

  wrap.querySelectorAll('.kanban-card').forEach(function(card){
    card.addEventListener('click', function(){
      if(card.classList.contains('dragging')) return;
      openProspectModal(card.getAttribute('data-prospect-id'));
    });
    card.addEventListener('dragstart', function(e){
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.getAttribute('data-prospect-id'));
      e.dataTransfer.effectAllowed = 'move';
      startDragScroll(wrap, e.clientX, e.clientY);
    });
    card.addEventListener('dragend', function(){
      card.classList.remove('dragging');
      stopDragScroll();
    });
  });
  wrap.addEventListener('dragover', function(e){ updateDragScroll(e.clientX, e.clientY); });
  wrap.querySelectorAll('[data-new-prospect-status]').forEach(function(btn){
    btn.addEventListener('click', function(){ openProspectModal(null, btn.getAttribute('data-new-prospect-status')); });
  });
  wrap.querySelectorAll('[data-prospect-col]').forEach(function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('drag-over'); });
    col.addEventListener('drop', function(e){
      e.preventDefault();
      col.classList.remove('drag-over');
      stopDragScroll();
      var pId = e.dataTransfer.getData('text/plain');
      var newStatus = col.getAttribute('data-prospect-col');
      var p = state.prospects.find(function(x){ return x.id===pId; });
      if(p && p.status!==newStatus){
        moveProspectToStatus(p, newStatus);
      }
    });
  });
}

function moveProspectToStatus(p, newStatus){
  p.status = newStatus;
  saveProspects();
  if(newStatus==='fechou'){
    convertProspectToJob(p);

    showToast('Movido para "'+ (PROSPECT_STATUS_FLOW.find(function(s){return s.key===newStatus;})||{}).label +'".');

  renderProspectKanban();
}

/* Finds a brand by case-insensitive name match, or creates one. Never creates duplicates.
   Shared by prospect→job conversion and the job form's brand autocomplete. */
function findOrCreateBrandByName(rawName, extra){
  var name = (rawName || '').trim();
  if(!name) return null;
  var existing = state.brands.find(function(b){ return b.name.trim().toLowerCase()===name.toLowerCase(); });
  if(existing) return existing;
  extra = extra || {};
  var brand = {
    id: uid(),
    name: name,
    contact: extra.contact || '',
    notes: extra.notes || 'Criada automaticamente ao cadastrar um trabalho.',
    createdAt: Date.now()
  };
  state.brands.push(brand);
  saveBrands();
  return brand;
}

/* ---------------- importar print do Instagram com IA ---------------- */
function processMultiplePrints(files){
  if(!files || files.length===0) return;
  // bloqueia se não estiver logada — evita gastar créditos sem salvar na conta
  if(!cloudUser){
    showToast('⚠️ Faça login com Google antes de importar prints para salvar na sua conta.');
    var resultDiv = document.getElementById('prospectImportResult');
    if(resultDiv) resultDiv.innerHTML = '<div style="padding:12px 16px; background:var(--amber-tint); border-radius:var(--radius-s); font-size:13.5px; color:var(--amber-deep); margin-bottom:16px;">⚠️ Você precisa estar logada com Google para importar prints. Assim as marcas ficam salvas na sua conta e aparecem em todos os dispositivos.</div>';
    return;
  }
  var resultDiv = document.getElementById('prospectImportResult');

  if(files.length === 1){
    extractInstagramFromImage(files[0]);
    return;
  }

  // múltiplos: processa em fila e cadastra automaticamente sem abrir modal
  var total = files.length;
  var done = 0;
  var report = []; // {file, status:'ok'|'dup'|'fail'|'skip', name, reason}
  var stopped = null;
  var igPlatform = state.platforms.find(function(p){ return p.name.toLowerCase()==='instagram'; });

  function updateProgress(){
    if(!resultDiv) return;
    var finished = done===total;
    var pct = Math.round((done/total)*100);
    var ok = report.filter(function(r){ return r.status==='ok'; });
    var dup = report.filter(function(r){ return r.status==='dup'; });
    var fail = report.filter(function(r){ return r.status==='fail' || r.status==='skip'; });
    var allGood = finished && !fail.length;
    var h = '<div class="imp-box '+(finished?(allGood?'is-ok':'is-warn'):'')+'">' +
      '<div class="imp-title">' + (finished ? (allGood ? '✓ Pronto! ' : '⚠️ Importação concluída com avisos · ') : '📸 Processando ') + done+'/'+total+' prints</div>' +
      '<div class="imp-bar"><div style="width:'+pct+'%"></div></div>';
    if(finished){
      h += '<div class="imp-sum"><span class="ok">✓ '+ok.length+' criadas</span>' +
        (dup.length?'<span class="dup">↺ '+dup.length+' já existiam</span>':'') +
        (fail.length?'<span class="fail">✕ '+fail.length+' não foram</span>':'') + '</div>';
      if(stopped) h += '<p class="imp-stop">Parei a importação: <strong>'+escapeHtml(stopped)+'</strong> Resolva isso e tente de novo os prints que faltaram.</p>';
      if(fail.length){
        h += '<div class="imp-list"><div class="imp-list-t">Prints que não foram</div>' + fail.map(function(r){
          return '<div class="imp-row fail"><span class="imp-file">'+escapeHtml(r.file)+'</span><span class="imp-why">'+escapeHtml(r.reason)+'</span></div>';
        }).join('') + '</div>';
      }
      if(dup.length){
        h += '<details class="imp-list"><summary class="imp-list-t">Já estavam na prospecção ('+dup.length+')</summary>' + dup.map(function(r){
          return '<div class="imp-row dup"><span class="imp-file">'+escapeHtml(r.file)+'</span><span class="imp-why">'+escapeHtml(r.name)+'</span></div>';
        }).join('') + '</details>';
      }
      if(ok.length){
        h += '<details class="imp-list"><summary class="imp-list-t">Criadas ('+ok.length+')</summary>' + ok.map(function(r){
          return '<div class="imp-row ok"><span class="imp-file">'+escapeHtml(r.file)+'</span><span class="imp-why">'+escapeHtml(r.name)+'</span></div>';
        }).join('') + '</details>';
      }
      h += '<div class="imp-actions">' +
        (fail.length ? '<button class="btn btn-sm" id="impRetry">↻ Tentar de novo os que não foram</button>' : '') +
        '<button class="btn btn-sm btn-ghost" id="impClose">fechar</button></div>';
    }
    h += '</div>';
    resultDiv.innerHTML = h;
    if(finished){
      var rb = document.getElementById('impRetry');
      if(rb) rb.addEventListener('click', function(){
        var retryFiles = report.filter(function(r){ return r.status==='fail' || r.status==='skip'; }).map(function(r){ return r.fileObj; });
        processMultiplePrints(retryFiles);
      });
      var cb = document.getElementById('impClose');
      if(cb) cb.addEventListener('click', function(){ resultDiv.innerHTML = ''; });
    }
  }

  // fila estritamente sequencial — evita race condition
  function processNext(index){
    if(index >= total){ updateProgress(); return; }
    if(stopped){
      for(var k = index; k < total; k++){ report.push({file:files[k].name, fileObj:files[k], status:'skip', reason:'Não processado (importação interrompida).'}); done++; }
      updateProgress(); return;
    }
    var file = files[index];
    extractInstagramData(file, function(parsed, err){
      done++;
      if(parsed){
        var alreadyExists = state.prospects.find(function(pr){
          return (parsed.handle && pr.contact && pr.contact.toLowerCase()===parsed.handle.toLowerCase()) ||
                 (parsed.brandName && pr.brandName && pr.brandName.toLowerCase()===parsed.brandName.toLowerCase());
        });
        var label = (parsed.brandName||'') + (parsed.handle ? ' ' + parsed.handle : '');
        if(!alreadyExists){
          state.prospects.push({
            id: uid(),
            brandName: parsed.brandName||parsed.handle||'Sem nome',
            contact: parsed.handle||'',
            instagramUrl: parsed.url||'',
            platformId: igPlatform ? igPlatform.id : '',
            nicho: parsed.nicho||'',
            notes: parsed.bio||'',
            status: 'pendente',
            createdAt: Date.now()
          });
          if(parsed.nicho && !state.nichos.includes(parsed.nicho)){
            state.nichos.push(parsed.nicho);
            saveNichos();
          }
          report.push({file:file.name, fileObj:file, status:'ok', name:label.trim()});
          saveProspects();
          renderProspectKanban();
        } else {
          report.push({file:file.name, fileObj:file, status:'dup', name:label.trim()+' → já cadastrada como "'+alreadyExists.brandName+'"'});
        }
      } else {
        report.push({file:file.name, fileObj:file, status:'fail', reason: err ? err.reason : 'Erro desconhecido.'});
        if(err && err.fatal) stopped = err.reason;
      }
      updateProgress();
      processNext(index+1);
    });
  }

  updateProgress();
  processNext(0);
}

/* traduz erros da IA/Worker em mensagens claras.
   fatal = não adianta tentar os outros prints (ex.: sem chave, sem login, sem crédito) */
function friendlyAiError(status, data){
  var msg = data && (typeof data.error === 'string' ? data.error : (data.error && data.error.message)) || '';
  var low = String(msg).toLowerCase();
  if(low.indexOf('credit balance') !== -1 || low.indexOf('billing') !== -1) return {reason:'Sua conta da Anthropic está sem créditos.', fatal:true};
  if(status === 401 || low.indexOf('api key') !== -1 || low.indexOf('x-api-key') !== -1) return {reason: msg && typeof data.error === 'string' ? msg : 'API Key inválida ou não configurada.', fatal:true};
  if(status === 429) return {reason:'Muitos prints de uma vez, a IA pediu uma pausa.', retry:true};
  if(status === 529 || status === 503 || low.indexOf('overloaded') !== -1) return {reason:'A IA está sobrecarregada no momento.', retry:true};
  if(status === 413) return {reason:'Imagem muito grande.'};
  if(status >= 500) return {reason:'Erro no servidor da IA.', retry:true};
  return {reason: msg || ('Erro inesperado (código ' + status + ').')};
}

function extractInstagramData(file, callback, attempt){
  attempt = attempt || 1;
  var reader = new FileReader();
  reader.onload = function(e){
    var base64 = e.target.result.split(',')[1];
    var mediaType = file.type || 'image/jpeg';
    var httpStatus = 0;
    apiFetch({
      model: 'claude-sonnet-4-6',
      max_tokens: 500,
      messages: [{
        role: 'user',
        content: [
          {type: 'image', source: {type: 'base64', media_type: mediaType, data: base64}},
          {type: 'text', text: 'Este é um print de perfil do Instagram. Extraia as informações e responda SOMENTE com JSON válido, sem texto adicional:\n{"brandName":"nome visível da marca","handle":"@usuario","url":"https://www.instagram.com/usuario/","bio":"bio completa se visível","nicho":"categoria do negócio em 1-2 palavras, ex: Beleza, Moda, Skincare, Casa, Pets, Alimentos, Fitness, Tech, Outro"}\n\nSe não for um perfil do Instagram: {"error":"nao identificado"}'}
        ]
      }]
    })
    .then(function(r){ httpStatus = r.status; return r.json().catch(function(){ return {}; }); })
    .then(function(data){
      if(httpStatus && (httpStatus < 200 || httpStatus >= 300)){
        var fe = friendlyAiError(httpStatus, data);
        if(fe.retry && attempt < 2){ setTimeout(function(){ extractInstagramData(file, callback, attempt + 1); }, 4000); return; }
        callback(null, fe);
        return;
      }
      var parsed = null;
      if(data && data.result !== undefined){ parsed = data.result; } // resposta do Worker
      else {
        var text = (data.content && data.content[0]) ? (data.content[0].text||'') : '';
        try{ var m = text.match(/\{[\s\S]*\}/); if(m) parsed = JSON.parse(m[0]); }catch(ex){}
      }
      if(!parsed) return callback(null, {reason:'A IA não conseguiu ler esse print.'});
      if(parsed.error) return callback(null, {reason:'Não parece um perfil do Instagram.'});
      if(!parsed.brandName && !parsed.handle) return callback(null, {reason:'Não achei o nome nem o @ no print.'});
      callback(parsed, null);
    })
    .catch(function(){
      if(attempt < 2){ setTimeout(function(){ extractInstagramData(file, callback, attempt + 1); }, 3000); return; }
      callback(null, {reason:'Falha de conexão. Confira sua internet.'});
    });
  };
  reader.onerror = function(){ callback(null, {reason:'Não consegui abrir esse arquivo.'}); };
  reader.readAsDataURL(file);
}

  var alreadyExists = state.jobs.some(function(j){ return j.prospectId===p.id; });

    paymentMethod: '',
    value: '',

  });

}

        '<div class="field"><label for="pInstagramUrl">Link do perfil</label><input id="pInstagramUrl" type="url" placeholder="https://www.instagram.com/..." value="'+escapeHtml(initUrl)+'" /></div>' +
        '<div class="field-row">' +
          '<div class="field"><label for="pStatus">Status</label><select id="pStatus">'+statusOptions+'</select></div>' +
          '<div class="field"><label for="pNicho">Nicho</label>' +
            '<input id="pNicho" type="text" list="pNichoList" placeholder="Escolha da lista ou digite um nicho" value="'+escapeHtml(initNicho)+'" autocomplete="off" />' +
            '<datalist id="pNichoList">'+state.nichos.map(function(n){ return '<option value="'+escapeHtml(n)+'"></option>'; }).join('')+'</datalist>' +
          '</div>' +
        '</div>' +
        '<div class="field"><label for="pNotes">Notas</label><textarea id="pNotes" placeholder="Como foi o contato, o que foi combinado, próximos passos">'+escapeHtml(initNotes)+'</textarea></div>' +
        '<div class="modal-actions">' +
          (isNew ? '' : '<button class="btn btn-danger-text" id="pDelete" style="margin-right:auto;">excluir</button>') +
          '<button class="btn btn-ghost" id="pCancel">cancelar</button>' +
          '<button class="btn btn-primary" id="pSave">'+(isNew?'Criar prospecção':'Salvar alterações')+'</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('pBrandName').focus();

  document.getElementById('prospModalClose').addEventListener('click', close);
  document.getElementById('pCancel').addEventListener('click', close);
  document.getElementById('prospOverlay').addEventListener('click', function(e){ if(e.target.id==='prospOverlay') close(); });

  if(!isNew){
    document.getElementById('pDelete').addEventListener('click', function(){
      if(confirm('Excluir esta prospecção?')){
        state.prospects = state.prospects.filter(function(x){ return x.id!==p.id; });
        saveProspects(); close(); showToast('Prospecção excluída.');
        if(state.route==='prospects') renderProspectKanban(); else render();
      }
    });
  }

  document.getElementById('pSave').addEventListener('click', function(){
    var brandName = document.getElementById('pBrandName').value.trim();
    if(!brandName){ showToast('Dá um nome pra marca.'); return; }
    var newStatus = document.getElementById('pStatus').value;
    var data = {

      contact: document.getElementById('pContact').value.trim(),
      instagramUrl: document.getElementById('pInstagramUrl').value.trim(),
      platformId: document.getElementById('pPlatform').value,

          saveNichos();

        convertProspectToJob(p);
        showToast('Prospecção fechada — trabalho criado.');
        render();
      } else {
        showToast('Alterações salvas.');
        if(state.route==='prospects') renderProspectKanban(); else render();
      }
    }
  });
}
